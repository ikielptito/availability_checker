<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability — Agent Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fb;--surface:#ffffff;--surface2:#ece9f7;--border:#e0dcef;--text:#1a1730;--text-2:#3d3960;--muted:#6a6590;--subtle:#9893b8;--avail:#dceee0;--avail-text:#1a6b34;--avail-border:#9dc7a8;--booked:#f5dcdc;--booked-text:#9a2828;--booked-border:#d6a3a3;--primary:#5847e0;--primary-2:#4438b5;--primary-soft:#e4dffa;--today-ring:#5847e0;--today-bg:#e4dffa;--accent:#5847e0;--shadow:0 4px 12px rgba(60,40,160,.06),0 1px 2px rgba(60,40,160,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.icon{width:16px;height:16px;flex-shrink:0;display:inline-block;vertical-align:middle}
.icon-sm{width:14px;height:14px}
.icon-lg{width:20px;height:20px}
.icon-xl{width:36px;height:36px}
#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(ellipse 60% 40% at 70% 30%,rgba(29,78,216,.05) 0%,transparent 60%),radial-gradient(ellipse 40% 50% at 20% 80%,rgba(26,107,52,.04) 0%,transparent 60%),var(--bg)}
.loading-wordmark{font-family:'Inter',sans-serif;font-size:2.4rem;font-weight:700;letter-spacing:-.025em;color:var(--text)}
.loading-sub{font-size:.75rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-screen{min-height:100vh;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:40px;text-align:center}
.error-screen.show{display:flex}
.error-title{font-family:'Inter',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.error-msg{color:var(--text-2);font-size:.9rem;max-width:380px;line-height:1.7}
#app{display:none}#app.on{display:block}
.topbar{position:sticky;top:0;z-index:100;background:rgba(243,241,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:16px}
.topbar-brand{font-family:'Inter',sans-serif;font-size:1.5rem;font-weight:700;color:var(--text);letter-spacing:-.025em;white-space:nowrap}
.topbar-count{font-size:.72rem;font-weight:500;color:var(--text-2);padding:4px 11px;background:var(--surface);border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.spacer{flex:1}
.search-wrap{position:relative;width:220px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px;pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px 8px 32px;font-family:'Sora',sans-serif;font-size:.85rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input::placeholder{color:var(--subtle)}.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(107,92,255,.18)}
.live-pill{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.live-dot{width:7px;height:7px;background:var(--avail-text);border-radius:50%;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.refresh-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text-2);padding:7px 14px;font-family:'Sora',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.refresh-btn:hover{color:var(--text);border-color:var(--subtle);background:var(--surface2)}.refresh-btn svg{width:12px;height:12px}
.filter-bar{padding:14px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.filter-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.filter-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
@media(max-width:520px){.filter-bar{padding:12px 14px}}
.legend-bar{padding:11px 28px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--border);background:var(--surface)}
.legend-item{display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:600;color:var(--text-2);letter-spacing:.08em;text-transform:uppercase}
.swatch{width:24px;height:10px;border-radius:3px}
.sw-avail{background:var(--avail);border:1px solid var(--avail-border)}
.sw-booked{background:var(--booked);border:1px solid var(--booked-border)}
.sw-today{width:10px;height:10px;border-radius:2px;background:var(--today-bg);border:1.5px solid var(--today-ring)}
.prop-grid{padding:24px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(680px,1fr));gap:18px}
@media(max-width:760px){.prop-grid{grid-template-columns:1fr;padding:14px}.topbar{padding:0 14px;gap:10px}.search-wrap{width:140px}.legend-bar{padding:9px 14px}}
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;animation:fadeUp .3s ease both;box-shadow:var(--shadow)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.prop-head{padding:16px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border)}
.prop-name{font-family:'Inter',sans-serif;font-size:1.2rem;font-weight:700;line-height:1.25;color:var(--text);letter-spacing:-.02em}
.prop-type{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
.prop-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chip{font-size:.72rem;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.chip-price{color:var(--text);font-weight:600;background:#fff;border-color:var(--subtle)}
.avail-pill{font-size:.68rem;padding:4px 11px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;margin-top:2px;font-weight:600}
.avail-now{background:var(--avail);color:var(--avail-text);border:1px solid var(--avail-border)}
.avail-from{background:var(--today-bg);color:var(--today-ring);border:1px solid #d9b86a}
.prop-photo{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);cursor:pointer;transition:opacity .2s}
.prop-photo:hover{opacity:.85}
.prop-photo-placeholder{width:64px;height:64px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.cal-scroll{overflow-x:auto;padding:16px 20px 18px;scrollbar-width:thin;scrollbar-color:var(--subtle) transparent}
.cal-scroll::-webkit-scrollbar{height:4px}.cal-scroll::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:4px}
.cal-months{display:flex;gap:18px;min-width:max-content}
.cal-month{width:165px;flex-shrink:0}
.cal-month-lbl{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin-bottom:8px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px}
.dow{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:600}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.68rem;border-radius:3px;font-weight:500;color:var(--text-2)}
.day.avail{background:var(--avail);color:var(--avail-text);font-weight:600}
.day.booked{background:var(--booked);color:var(--booked-text);font-weight:600}
.day.past{opacity:.3}.day.empty{background:transparent}
.day.today{outline:2px solid var(--today-ring);outline-offset:-1px;font-weight:700;color:var(--today-ring);background:var(--today-bg)}
.card-actions{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.action-btn{flex:1;min-width:0;padding:12px;background:var(--surface);border:1.5px solid var(--primary);border-radius:10px;color:var(--primary);font-family:'Sora',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.action-btn:hover{background:var(--primary-soft)}
.action-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;flex:1.4}
.action-btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.action-btn .btn-label{overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.card-actions{gap:8px;padding:12px}.action-btn{font-size:.78rem;padding:11px 8px}}
.skel-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.skel-head{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.skel-bar{border-radius:4px;background:var(--surface2);animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
.skel-body{padding:16px 20px 18px;display:flex;gap:18px}
.skel-mo{width:165px;flex-shrink:0}.skel-lbl{height:9px;width:60px;margin:0 auto 7px}
.skel-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px}
.skel-cell{aspect-ratio:1;border-radius:3px;background:var(--surface2);animation:shimmer 1.4s ease-in-out infinite}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-2);font-size:.95rem;font-weight:500}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(40,25,90,.45);backdrop-filter:blur(3px);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
@media(min-width:760px){.modal-overlay{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:780px;max-height:92vh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease;box-shadow:0 20px 60px rgba(20,15,5,.18)}
@media(min-width:760px){.modal{border-radius:16px;max-height:88vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal-header{padding:18px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface)}
.modal-title{font-family:'Inter',sans-serif;font-size:1.5rem;font-weight:700;color:var(--text);letter-spacing:-.025em}
.modal-close{background:var(--surface2);border:1px solid var(--border);color:var(--text-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.modal-close:hover{color:var(--text);background:var(--border)}
.modal-body{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--subtle) transparent;background:var(--bg)}
/* CAROUSEL */
.carousel{position:relative;background:#1a1a1a;height:260px;flex-shrink:0;overflow:hidden}
@media(min-width:760px){.carousel{height:340px}}
.carousel-img{width:100%;height:100%;object-fit:contain;display:block}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.carousel-nav:hover{background:rgba(0,0,0,.8)}
.carousel-prev{left:12px}.carousel-next{right:12px}
.carousel-counter{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:.7rem;padding:3px 8px;border-radius:10px}
.carousel-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.82rem;flex-direction:column;gap:10px}
.carousel-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
/* MODAL SECTIONS */
.modal-section{padding:20px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
.modal-section:last-child{border-bottom:none}
.modal-section-title{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:700;margin-bottom:12px}
.overview-text{font-size:.95rem;line-height:1.7;color:var(--text)}
.detail-cols{display:flex;gap:24px;flex-wrap:wrap}
.detail-col{flex:1;min-width:160px}
.detail-row{font-size:.85rem;line-height:1.8;color:var(--text);display:flex;gap:6px}
.detail-row::before{content:'·';color:var(--subtle);flex-shrink:0}
.price-row{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.price-amount{font-family:'Inter',sans-serif;font-size:1.6rem;font-weight:700;color:var(--text);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.price-period{font-size:.8rem;color:var(--text-2);font-weight:500}
.inclusion-row{font-size:.85rem;line-height:1.8;color:var(--text-2);padding-left:22px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a6b34' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");background-repeat:no-repeat;background-position:0 .5em;background-size:14px 14px}
/* MAP */
.map-container{position:relative;height:220px;background:var(--surface2)}
.map-iframe{width:100%;height:100%;border:none;display:block}
.map-open-btn{position:absolute;top:10px;right:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Sora',sans-serif;font-size:.78rem;font-weight:500;padding:7px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all .2s;box-shadow:var(--shadow)}
.map-open-btn:hover{background:var(--surface2)}
/* MODAL ACTIONS */
.modal-actions{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.modal-action-btn{flex:1;min-width:120px;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Sora',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.modal-action-btn:hover{background:var(--surface2);border-color:var(--subtle)}
.modal-wa-btn{background:#128c4f;border-color:#128c4f;color:#fff;font-weight:600}
.modal-wa-btn:hover{background:#0f7a44;border-color:#0f7a44;color:#fff}
/* LIGHTBOX */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.lb-overlay.open{display:flex}
.lb-img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:6px}
.lb-controls{display:flex;align-items:center;gap:20px}
.lb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-counter{color:rgba(255,255,255,.5);font-size:.8rem;min-width:60px;text-align:center}
.lb-close{position:fixed;top:18px;right:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}
</style>
</head>
<body>
<div id="loading-screen">
  <div class="loading-wordmark">Availability</div>
  <div class="loading-sub">Agent Portal · Loading properties…</div>
  <div class="loading-spinner"></div>
</div>
<div class="error-screen" id="error-screen">
  <div style="color:var(--primary);display:flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-xl"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
  <div class="error-title">Could not load properties</div>
  <div class="error-msg" id="error-detail">Check that HOSTEX_TOKEN is set in Vercel environment variables.</div>
</div>
<div id="app">
  <div class="topbar">
    <span class="topbar-brand">Availability</span>
    <span class="topbar-count" id="prop-count"></span>
    <div class="spacer"></div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="search" placeholder="Filter properties…" oninput="doFilter()" />
    </div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
    <button class="refresh-btn" onclick="doRefresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
  <div class="legend-bar">
    <div class="legend-item"><div class="swatch sw-avail"></div>Available</div>
    <div class="legend-item"><div class="swatch sw-booked"></div>Booked</div>
    <div class="legend-item"><div class="swatch sw-today"></div>Today</div>
  </div>
  <div class="filter-bar" id="filter-bar" style="display:none">
    <span class="filter-label">Bedrooms</span>
    <div class="filter-chips" id="bedroom-chips"></div>
  </div>
  <div class="prop-grid" id="grid"></div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="carousel" id="carousel">
        <div class="carousel-loading" id="carousel-loading"><div class="carousel-spinner"></div><span>Loading photos…</span></div>
        <img class="carousel-img" id="carousel-img" src="" alt="" style="display:none" />
        <button class="carousel-nav carousel-prev" onclick="carNav(-1)" style="display:none" id="carousel-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-lg"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="carousel-nav carousel-next" onclick="carNav(1)" style="display:none" id="carousel-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-lg"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="carousel-counter" id="carousel-counter" style="display:none"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Overview</div>
        <div class="overview-text" id="modal-overview"></div>
      </div>
      <div class="modal-section">
        <div class="detail-cols" id="modal-details"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Pricing</div>
        <div id="modal-pricing"></div>
        <div style="margin-top:12px">
          <div class="modal-section-title" style="margin-bottom:6px">Monthly Inclusions</div>
          <div id="modal-inclusions"></div>
        </div>
      </div>
      <div class="modal-section" style="padding:0" id="map-section">
        <div class="map-container">
          <iframe class="map-iframe" id="map-iframe" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

function getBedrooms(propId){

  if(info.unitType){const m=String(info.unitType).match(/(\d+)\s*BR/i); if(m) return +m[1];}
  for(const f of (info.features||[])){const m=String(f).match(/(\d+)\s*Bedroom/i); if(m) return +m[1];}
  return null;
}

function closeModal(e) {
  if(e && e.target!==document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('carousel-img').style.display='none';

  document.getElementById('carousel-loading').innerHTML='<div class="carousel-spinner"></div><span>Loading photos…</span>';
  document.getElementById('carousel-prev').style.display='none';
  document.getElementById('carousel-next').style.display='none';
  document.getElementById('carousel-counter').style.display='none';
  document.getElementById('map-iframe').src='';
  carPhotos=[]; carIdx=0;
}

async function loadCarousel(propId,folderId) {
  carPhotos=[]; carIdx=0;
  document.getElementById('carousel-img').style.display='none';
  document.getElementById('carousel-loading').style.display='flex';
  document.getElementById('carousel-prev').style.display='none';
  document.getElementById('carousel-next').style.display='none';
  document.getElementById('carousel-counter').style.display='none';
  const prop=properties.find(p=>p.id==propId);
  if(prop&&prop.photo){carPhotos=[prop.photo];showCarPhoto();}
  try {
    const r=await fetch('/api/gdrive?folder='+folderId);
    const d=await r.json();
    if(d.photos&&d.photos.length){carPhotos=d.photos.map(p=>p.url);carIdx=0;showCarPhoto();}
  } catch(e){}
  if(!carPhotos.length) document.getElementById('carousel-loading').innerHTML='<span style="color:var(--muted)">No photos available yet</span>';
}

function showCarPhoto() {
  const img=document.getElementById('carousel-img');
  document.getElementById('carousel-loading').style.display='none';
  img.style.display='block'; img.src=carPhotos[carIdx];
  if(carPhotos.length>1){
    document.getElementById('carousel-prev').style.display='flex';
    document.getElementById('carousel-next').style.display='flex';
    document.getElementById('carousel-counter').style.display='block';
    document.getElementById('carousel-counter').textContent=(carIdx+1)+' / '+carPhotos.length;
  }
}

function carNav(dir){carIdx=(carIdx+dir+carPhotos.length)%carPhotos.length;showCarPhoto();}

(function(){
  const el=document.getElementById('carousel');
  const img=document.getElementById('carousel-img');
  let startX=0,startY=0,isHoriz=null,busy=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||busy)return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; isHoriz=null;
    img.style.transition='none';
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!carPhotos.length||e.touches.length!==1||busy)return;
    const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if(isHoriz===null) isHoriz=Math.abs(dx)>Math.abs(dy);
    if(!isHoriz)return;
    e.preventDefault();
    const cdx=Math.max(-el.offsetWidth,Math.min(el.offsetWidth,dx));
    img.style.transform='translateX('+cdx+'px)';
  },{passive:false});
  el.addEventListener('touchend',e=>{
    if(!carPhotos.length||!isHoriz||busy){isHoriz=null;return;}
    const dx=e.changedTouches[0].clientX-startX;
    isHoriz=null;
    if(Math.abs(dx)>50){
      busy=true;
      const dir=dx<0?1:-1;
      const nextIdx=(carIdx+dir+carPhotos.length)%carPhotos.length;
      img.style.transition='transform 0.2s ease-in';
      img.style.transform='translateX('+(dx<0?'-110%':'110%')+')';
      setTimeout(()=>{
        carIdx=nextIdx; img.src=carPhotos[carIdx];
        document.getElementById('carousel-counter').textContent=(carIdx+1)+' / '+carPhotos.length;
        img.style.transition='none';
        img.style.transform='translateX('+(dx<0?'110%':'-110%')+')';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          img.style.transition='transform 0.2s ease-out';
          img.style.transform='translateX(0)';
          setTimeout(()=>{busy=false;},200);
        }));
      },200);
    } else {
      img.style.transition='transform 0.2s ease-out';
      img.style.transform='translateX(0)';
    }
  },{passive:true});
})();

// ── ANALYTICS ──
// WhatsApp-attributed visits arrive with ?ref=wa_alert&aid=<crm_agent_id>.
// We override the anonymous browser ID with the CRM ID so a single agent's
// activity stitches together across devices, and we tag the session src so
// the dashboard can break out WhatsApp-driven traffic from organic clicks.
const URL_PARAMS = new URLSearchParams(window.location.search);
const URL_REF = URL_PARAMS.get('ref') || null;        // 'wa_alert' | 'wa_digest' | null
const URL_AID = URL_PARAMS.get('aid') || null;        // CRM agent id, if present
if (URL_AID && /^[a-zA-Z0-9_-]{1,64}$/.test(URL_AID)) {
  localStorage.setItem('samba_agent_id', URL_AID);
  if (URL_REF) sessionStorage.setItem('samba_session_src', URL_REF);
}
const SESSION_SRC = sessionStorage.getItem('samba_session_src') || 'portal';

function getAgentId() {
  let id = localStorage.getItem('samba_agent_id');
  if (!id) { id = 'a_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('samba_agent_id', id); }
  return id;
}

function track(event, propId, propName) {
  let newSession = false;
  if (event === 'page_view' && !sessionStorage.getItem('samba_sess')) {
    sessionStorage.setItem('samba_sess', '1');
    newSession = true;
  }
  fetch('/api/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event, propId, propName, agentId: getAgentId(), newSession, src: SESSION_SRC })
  }).catch(() => {});
}

// ── API ──
async function boot() {
  let items=[], hostexError=null;
  try {
    const r=await fetch('/api/properties');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    items=d.data?.properties||d.data?.items||d.data||d.items||[];
  } catch(e) { hostexError=e; }
  properties=items.map(p=>({id:String(p.id||p.property_id),name:p.name||p.title||'Unnamed',type:p.property_type||p.room_type||'',photo:p.cover?.large_url||p.cover?.original_url||''}));
  customListings.forEach(l=>{
    const id='c_'+l.slug;
    PROPS[id]=l; SLUGS[id]=l.slug;
    properties.push({id,name:l.name,type:l.tag||'',photo:'',custom:true,folder:l.folder});
  });
  if(!properties.length){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('error-detail').textContent=hostexError?hostexError.message:'No properties returned';
    document.getElementById('error-screen').classList.add('show');
    return;
  }
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('prop-count').textContent=properties.length+' propert'+(properties.length===1?'y':'ies');
  track('page_view'); renderBedroomFilter(); showSkeletons(); await loadAll(); render();
}

async function fetchAvail(propId) {
  const start=ds(TODAY);
  const endD=new Date(TODAY.getFullYear(),TODAY.getMonth()+6,0);
  const r=await fetch('/api/calendar?id='+propId+'&start_date='+start+'&end_date='+ds(endD));
  if(!r.ok) return new Set();
  const d=await r.json();
  const items=d.data?.items||d.data||d.items||[];
  const booked=new Set();
  items.forEach(day=>{if(day.status==='booked'||day.available===false||day.blocked===true)booked.add(day.date||day.day);});
  return booked;
}

function rangesToSet(ranges) {
  const booked=new Set();
  (ranges||[]).forEach(r=>{
    if(!r||!r.from||!r.to) return;
    const cur=new Date(r.from+'T00:00:00'), end=new Date(r.to+'T00:00:00');
    while(cur<=end){booked.add(ds(cur));cur.setDate(cur.getDate()+1);}
  });
  return booked;
}

async function loadAll() {
  await Promise.all(properties.map(async p=>{
    const info=PROPS[p.id]||{};
    // Card photo precedence: admin-picked cover → existing (Hostex cover) →
    // first photo in the Drive folder. The Drive fallback covers Hostex
    // properties with no Airbnb listing (no cover image upstream).
    if(info.coverPhotoId){
      p.photo='https://lh3.googleusercontent.com/d/'+info.coverPhotoId+'=w400';
    }else if(!p.photo&&(p.folder||info.folder)){
      try{
        const r=await fetch('/api/gdrive?folder='+encodeURIComponent(p.folder||info.folder));
        const d=await r.json();
        if(d.photos&&d.photos[0])p.photo=d.photos[0].thumb;
      }catch{}
    }
    if(p.custom){
      const booked=rangesToSet(info.bookedRanges);
      if(info.icalUrl){
        try{
          const r=await fetch('/api/ical?slug='+encodeURIComponent(SLUGS[p.id]));
          const d=await r.json();
          (d.booked||[]).forEach(x=>booked.add(x));
        }catch{}
      }
      avail[p.id]=booked;
      return;
    }
    try{avail[p.id]=await fetchAvail(p.id);}catch{avail[p.id]=new Set();}
  }));
}

function showSkeletons() {
  const sk=()=>'<div class="skel-mo"><div class="skel-bar skel-lbl"></div><div class="skel-grid">'+Array(35).fill('<div class="skel-cell"></div>').join('')+'</div></div>';
  document.getElementById('grid').innerHTML=properties.map(()=>'<div class="skel-card"><div class="skel-head"><div style="flex:1"><div class="skel-bar" style="height:13px;width:50%;margin-bottom:6px"></div><div class="skel-bar" style="height:8px;width:28%"></div></div></div><div class="skel-body">'+Array(6).fill(0).map(sk).join('')+'</div></div>').join('');
}

function render() {
  const grid=document.getElementById('grid');
  const q=query.toLowerCase();
  const filtered=properties.filter(p=>{
    if(!(p.name.toLowerCase().includes(q)||(p.type||'').toLowerCase().includes(q))) return false;
    if(bedroomFilter!=='all'){const b=getBedrooms(p.id); if(b!==+bedroomFilter) return false;}
    return true;
  });
  if(!filtered.length){grid.innerHTML='<div class="empty-state">No properties match "'+esc(query)+'"</div>';return;}
  grid.innerHTML=filtered.map((p,i)=>{
    const booked=avail[p.id]||new Set();
    const info=PROPS[p.id];
    const photoHtml=p.photo?'<img class="prop-photo" src="'+p.photo+'" alt="'+esc(p.name)+'" loading="lazy" onclick="openLightbox(\''+p.id+'\',\''+esc(p.name)+'\',\''+p.photo+'\')" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">':'';
    const phStyle=p.photo?'display:none':'';
    const waNum=(info&&info.waNumber)||'6281246357778';
    const waName=(info&&info.waContactName)||'Era';
    const waMsg=encodeURIComponent('Hi '+waName+', I\'d like to schedule a visit for '+p.name+'.');
    const waUrl='https://wa.me/'+waNum+'?text='+waMsg;
    let chips='';
    if(info){
      const bits=[];
      if(info.unitType)bits.push('<span class="chip">'+esc(info.unitType)+'</span>');
      if(info.monthly)bits.push('<span class="chip chip-price">'+esc(info.monthly)+'/mo</span>');
      if(info.yearly)bits.push('<span class="chip">'+esc(info.yearly)+'/yr</span>');
      if(info.yearly2)bits.push('<span class="chip">'+esc(info.yearly2)+'/2yr</span>');
      if(bits.length)chips='<div class="prop-meta">'+bits.join('')+'</div>';
    }
    const av=availLabel(booked);
    const availHtml=av?'<span class="avail-pill '+av.cls+'">'+av.text+'</span>':'';
    return '<div class="prop-card" style="animation-delay:'+i*0.04+'s">'
      +'<div class="prop-head">'+photoHtml
      +'<div class="prop-photo-placeholder" style="'+phStyle+'">'+icon('home','lg')+'</div>'
      +'<div style="flex:1;min-width:0"><div class="prop-name">'+esc(p.name)+'</div>'
      +(info&&info.tag?'<div style="font-size:.72rem;color:var(--muted);margin-top:4px;font-weight:500">'+esc(info.tag)+'</div>'
        :(p.type?'<div class="prop-type">'+esc(p.type)+'</div>':''))
      +chips
      +'</div>'+availHtml+'</div>'
      +'<div class="cal-scroll"><div class="cal-months">'+buildSix(booked)+'</div></div>'
      +'<div class="card-actions">'
      +(info?'<button class="action-btn" onclick="openModal(\''+p.id+'\')">'+icon('info','sm')+'<span class="btn-label">Details &amp; Photos</span></button>':'')
      +'<button class="action-btn" onclick="shareCard(\''+p.id+'\',\''+esc(p.name)+'\')">'+icon('share','sm')+'<span class="btn-label">Share</span></button>'
      +'<a class="action-btn primary" href="'+waUrl+'" target="_blank" rel="noopener" onclick="track(\'whatsapp_click\',\''+p.id+'\',\''+esc(p.name)+'\')">'+icon('whatsapp','sm')+'<span class="btn-label">Schedule a Visit</span></a>'
      +'</div>'
      +'</div>';
  }).join('');
}

function buildSix(booked) {
  let html='';
  for(let m=0;m<6;m++){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+m,1);
    html+='<div class="cal-month"><div class="cal-month-lbl">'+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</div>'+buildMonth(d.getFullYear(),d.getMonth(),booked)+'</div>';
  }
  return html;
}

function buildMonth(year,month,booked) {
  const firstDow=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  let html='<div class="cal-grid">';
  DOWS.forEach(d=>{html+='<div class="dow">'+d+'</div>';});
  for(let i=0;i<firstDow;i++)html+='<div class="day empty"></div>';
  for(let d=1;d<=days;d++){
    const key=year+'-'+p2(month+1)+'-'+p2(d);
    let cls=key<todayStr?'past':(booked.has(key)?'booked':'avail');
    if(key===todayStr)cls+=' today';
    html+='<div class="day '+cls+'" title="'+key+'">'+d+'</div>';
  }
  return html+'</div>';
}

// "Available now" if today is free; otherwise the first free day in the
// next 6 months ("From Jul 1"). Null (no pill) if fully booked throughout.
function availLabel(booked){
  let firstFree=null;
  for(let i=0;i<180;i++){
    const d=new Date(TODAY);d.setDate(d.getDate()+i);
    const k=ds(d);
    if(!booked.has(k)){firstFree=d;break;}
  }
  if(!firstFree)return null;
  if(ds(firstFree)===todayStr)return{cls:'avail-now',text:'Available now'};
  return{cls:'avail-from',text:'From '+MONTHS[firstFree.getMonth()].slice(0,3)+' '+firstFree.getDate()};
}

function doFilter(){query=document.getElementById('search').value;render();}
async function doRefresh(){
  track('refresh');
  const btn=document.querySelector('.refresh-btn');btn.style.opacity='.5';
  avail={};showSkeletons();await loadAll();render();btn.style.opacity='';
}

let customListings = [];
async function loadListingMeta() {
  try {
    const r = await fetch('/api/listings');
    if (!r.ok) return;
    const { listings } = await r.json();
    const slugToHostex = Object.fromEntries(Object.entries(SLUGS).map(([id, s]) => [s, String(id)]));
    listings.forEach(l => {
      if (l.custom) { if (!l.hidden) customListings.push(l); return; }
      const hostexId = slugToHostex[l.slug];
      if (hostexId && PROPS[hostexId]) Object.assign(PROPS[hostexId], l);
    });
  } catch {}
}

(async () => {
  await loadListingMeta();
  boot();
})();
</script>
