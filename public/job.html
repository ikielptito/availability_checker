<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perbaikan · Samba</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/brand.css">
<script src="/shared.js"></script>
<style>
/* The tukang opens this on a phone, outdoors, one-handed, and needs three
   things fast: which villa, what is broken, and what it looks like. So the
   photos are large and the address line is the first thing under the title.
   Same document family as the owner's maintenance page, minus everything to
   do with money owed or approvals. */
:root{--accent-soft:var(--sb-terracotta-050);--green:var(--sb-success-fg);--red:var(--sb-error-fg);--yellow:#B8860B;--st-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:clamp(14px,4vw,40px) 14px 60px;}
.brand{max-width:720px;margin:0 auto 18px;display:flex;align-items:center;gap:9px;}
.brand .mark{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--st-serif);font-weight:600;font-size:15px;}
.brand .wm{font-family:var(--st-serif);font-size:1.15rem;letter-spacing:.02em;}
.brand .wm small{display:block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;margin-top:1px;}
.loading,.empty{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:56px 24px;text-align:center;color:var(--muted);font-size:.9rem;}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-width:720px;margin:0 auto;}
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface2);}
.mast .rl{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;}
.mast .rr{text-align:right;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.pad{padding:26px 28px;}
.pad+.pad{border-top:1px solid var(--border);}
.eyebrow{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;}
.title{font-family:var(--st-serif);font-weight:500;font-size:1.9rem;line-height:1.1;letter-spacing:-.01em;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:999px;margin-top:12px;}
.chip.wait{background:var(--accent-soft);color:var(--accent);}
.chip.ok{background:#e2ede0;color:var(--green);}
.chip.no{background:var(--sb-error-bg,#fbe9e7);color:var(--red);}
.chip.urgent{background:#FCF3E3;color:#8A5A0B;}
.desc{margin-top:16px;font-size:.94rem;line-height:1.65;color:var(--text-2);}
.cost{margin-top:20px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:18px 20px;}
.cost .cl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.cost .cv{font-family:var(--st-serif);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;}
.cost .cs{margin-top:9px;font-size:.76rem;color:var(--muted);}
.when{margin-top:18px;background:var(--accent-soft);border-radius:13px;padding:16px 20px;}
.when .cl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.when .cv{font-family:var(--st-serif);font-size:1.3rem;line-height:1.25;}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:6px;}
.shots a{display:block;border-radius:11px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3;background:var(--surface2);}
.shots img{width:100%;height:100%;object-fit:cover;display:block;}
.sec-h{font-family:var(--st-serif);font-weight:500;font-size:1.2rem;margin-bottom:12px;}
.note{margin-top:14px;font-size:.82rem;color:var(--muted);line-height:1.65;}
@media(max-width:560px){.pad{padding:20px 18px;}.title{font-size:1.6rem;}}
</style>
</head>
<body>
<div class="brand"><div class="mark">S</div><div class="wm">Samba<small>Realty · Perbaikan</small></div></div>
<div id="root"><div class="loading">Memuat…</div></div>
<script>
'use strict';
const TOKEN = (location.pathname.match(/^\/j\/(.+)$/) || [])[1] || '';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, cur) => n == null ? null : (cur || 'IDR') + ' ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const pname = (n) => String(n == null ? '' : n).replace(/\s*[–—]\s*/g, ' · ');
const dstr = (s) => s ? new Date(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

const STATUS = {
  offered:   ['wait', 'Menunggu jawaban Anda'],
  confirmed: ['ok',   'Sudah dijadwalkan'],
  arrived:   ['ok',   'Anda sudah di lokasi'],
  done:      ['ok',   'Selesai'],
  declined:  ['no',   'Anda tidak bisa mengambil pekerjaan ini'],
};

async function load() {
  try {
    const r = await fetch('/api/maintenance?action=job&token=' + encodeURIComponent(TOKEN));
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Link ini sudah tidak berlaku.');
    render(await r.json());
  } catch (e) {
    document.getElementById('root').innerHTML =
      '<div class="empty"><h3 style="font-family:var(--st-serif);color:var(--text);margin:0 0 8px">Link tidak tersedia</h3><p>' + esc(e.message) + '</p></div>';
  }
}

function render(d) {
  const [cls, label] = STATUS[d.visit_status] || ['wait', 'Permintaan perbaikan'];
  let html = `<div class="sheet">
    <div class="mast"><div class="rl">Permintaan perbaikan</div>
      <div class="rr">Dilaporkan ${esc(dstr(d.reported_at))}</div></div>
    <div class="pad">
      <div class="eyebrow">${esc(pname(d.place || ''))}</div>
      <div class="title">${esc(d.title)}</div>
      ${d.urgency === 'urgent' ? '<div><span class="chip urgent">Mendesak</span></div>' : ''}
      <div><span class="chip ${cls}">${esc(label)}</span></div>
      ${d.description ? `<div class="desc">${esc(d.description)}</div>` : ''}`;

  if (d.visit_label) {
    html += `<div class="when"><div class="cl">Waktu yang disepakati</div>
      <div class="cv">${esc(d.visit_label)}</div></div>`;
  }
  if (d.budget != null) {
    html += `<div class="cost">
      <div class="cl">Perkiraan biaya</div>
      <div class="cv">${esc(money(d.budget, d.currency))}</div>
      <div class="cs">Ini perkiraan dari Samba Realty. Kalau biaya sebenarnya berbeda, tolong kabari dulu sebelum mengerjakan.</div>
    </div>`;
  }
  html += `</div>`;

  if ((d.photo_urls || []).length) {
    html += `<div class="pad"><div class="sec-h">Foto</div><div class="shots">` +
      d.photo_urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Foto kerusakan" loading="lazy"></a>`).join('') +
      `</div></div>`;
  }

  html += `<div class="pad"><div class="note">
    Balas saja lewat WhatsApp: kabari kapan Anda bisa datang, lalu kabari lagi kalau sudah sampai dan kalau pekerjaan sudah selesai.
    Kalau ada yang kurang jelas, tanya saja di chat yang sama.
  </div></div></div>`;
  document.getElementById('root').innerHTML = html;
}
load();
</script>
</body>
</html>
