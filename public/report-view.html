<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your villa report — Samba</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/brand.css">
<script src="/shared.js"></script>
<style>
/* Core tokens come from brand.css aliases; page extras below. --rep-serif
   deliberately overrides the brand alias — the report is a serif artefact. */
:root{--accent-soft:var(--sb-terracotta-050);--green:var(--sb-success-fg);--red:var(--sb-error-fg);--yellow:#B8860B;--rep-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:clamp(14px,4vw,40px) 14px 60px;}
.brand{max-width:820px;margin:0 auto 18px;display:flex;align-items:center;gap:9px;}
.brand .mark{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--rep-serif);font-weight:600;font-size:15px;}
.brand .wm{font-family:var(--rep-serif);font-size:1.15rem;letter-spacing:.02em;color:var(--text);}
.brand .wm small{display:block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;margin-top:1px;}
.loading{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:56px 24px;text-align:center;color:var(--muted);font-size:.9rem;}
.report-foot-cta{max-width:820px;margin:20px auto 0;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.7;}

/* ── report styles (identical to the portal Reports tab) ── */
.rep-sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-width:820px;margin:0 auto;}
.rep-mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface2);}
.rep-mast .rl{font-size:0.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;}
.rep-mast .rr{text-align:right;font-size:0.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.rep-mast .rr b{display:block;color:var(--text-2);font-size:0.74rem;}
.rep-pad{padding:26px 28px;}
.rep-pad+.rep-pad{border-top:1px solid var(--border);}
.rep-eyebrow{font-size:0.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;}
.rep-title{font-family:var(--rep-serif);font-weight:500;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em;color:var(--text);}
.rep-loc{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:0.84rem;margin-top:10px;}
.rep-loc .rd{width:3px;height:3px;border-radius:50%;background:var(--subtle);}
.rep-prep{margin-top:15px;padding-top:13px;border-top:1px dashed var(--border);font-size:0.84rem;color:var(--text-2);}
.rep-prep b{color:var(--text);}
.rep-note{margin-top:18px;padding:15px 17px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;font-family:var(--rep-serif);font-size:1.05rem;line-height:1.5;color:var(--text-2);}
.rep-note b{color:var(--text);}
.rep-sec-h{font-family:var(--rep-serif);font-weight:500;font-size:1.3rem;color:var(--text);margin-bottom:16px;}
.rep-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.rep-kpi{background:var(--surface);padding:15px 15px 13px;}
.rep-kpi .kl{font-size:0.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.rep-kpi .kv{font-family:var(--rep-serif);font-size:2rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.rep-kpi .kv small{font-size:0.9rem;color:var(--muted);}
.rep-kpi .kc{margin-top:6px;font-size:0.68rem;color:var(--muted);}
.rep-chip{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:0.68rem;font-weight:600;padding:2px 7px;border-radius:20px;font-variant-numeric:tabular-nums;}
.rep-chip.up{color:var(--green);background:#e2ede0;}
.rep-chip.down{color:var(--red);background:#f2ddd6;}
.rep-chip.flat{color:var(--muted);background:var(--surface2);}
.rep-chart{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px 18px 10px;}
.rep-chart svg{width:100%;height:auto;display:block;overflow:visible;}
.rep-bar{fill:var(--subtle);}
.rep-bar.peak{fill:var(--accent);}
.rep-bl{font-family:sans-serif;font-size:10px;fill:var(--muted);}
.rep-bv{font-family:sans-serif;font-size:10px;fill:var(--text-2);font-weight:600;}
.rep-chart-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:0.72rem;color:var(--muted);}
.rep-chart-foot b{color:var(--text-2);}
.rep-funnel{display:flex;flex-direction:column;gap:9px;}
.rep-fstep{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;}
.rep-fstep .ffl{font-size:0.8rem;color:var(--text-2);}
.rep-fstep .ffl small{display:block;color:var(--muted);font-size:0.66rem;}
.rep-ftrack{position:relative;height:38px;background:var(--surface2);border-radius:8px;overflow:hidden;}
.rep-ffill{position:absolute;top:0;bottom:0;left:0;border-radius:8px;display:flex;align-items:center;padding-left:13px;min-width:38px;}
.rep-ffill.s1{background:var(--text);}
.rep-ffill.s2{background:var(--green);}
.rep-ffill.s3{background:var(--accent);}
.rep-ffill .fn{font-size:0.82rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}
.rep-conv{margin-top:9px;font-size:0.76rem;color:var(--muted);}
.rep-conv b{color:var(--green);}
.rep-cols{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:560px){.rep-cols{grid-template-columns:1fr 1fr;}}
.rep-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px;}
.rep-card.fill{background:var(--surface2);}
.rep-card h4{font-size:0.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600;}
.rep-big{font-family:var(--rep-serif);font-size:2.3rem;line-height:1;color:var(--text);}
.rep-big small{font-size:0.9rem;color:var(--muted);}
.rep-line{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--border);font-size:0.8rem;}
.rep-line:last-child{border-bottom:none;}
.rep-line .lk{color:var(--text-2);}
.rep-line .lv{font-weight:600;font-variant-numeric:tabular-nums;}
.rep-ring{display:flex;align-items:center;gap:16px;}
.rep-ring svg text{font-family:var(--rep-serif);}
.rep-book{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:0.78rem;border-bottom:1px dashed var(--border);}
.rep-book:last-child{border-bottom:none;}
.rep-book .bd{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;}
.rep-book.open .bd{background:var(--accent);}
.rep-book .bt{margin-left:auto;font-size:0.7rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.rep-bench{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px;}
.rep-bench .bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:13px;}
.rep-bench .bp{font-family:var(--rep-serif);font-size:1.4rem;color:var(--text);}
.rep-bench .bp b{color:var(--accent);}
.rep-bench .bs{font-size:0.72rem;color:var(--muted);}
.rep-btrack{height:9px;border-radius:5px;background:linear-gradient(90deg,var(--border),var(--subtle));position:relative;}
.rep-bmark{position:absolute;top:50%;width:3px;height:18px;background:var(--accent);border-radius:2px;transform:translate(-50%,-50%);}
.rep-bscale{display:flex;justify-content:space-between;margin-top:7px;font-size:0.62rem;color:var(--muted);}
.rep-maya{display:flex;gap:13px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:17px;}
.rep-maya .mav{width:38px;height:38px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--rep-serif);font-size:1.05rem;font-weight:600;}
.rep-maya .mrow{display:flex;align-items:baseline;gap:8px;font-size:0.8rem;color:var(--text-2);margin-bottom:6px;}
.rep-maya .mrow:last-child{margin-bottom:0;}
.rep-maya .mrow b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
.rep-maya .mnote{margin-top:9px;font-size:0.68rem;color:var(--muted);font-style:italic;}
.rep-recs{display:flex;flex-direction:column;gap:10px;}
.rep-rec{display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.rep-rec .rn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:0.72rem;font-weight:700;display:grid;place-items:center;}
.rep-rec .rt{font-size:0.82rem;color:var(--text);}
.rep-rec .rt b{font-weight:600;}
.rep-rec .rt span{display:block;color:var(--muted);font-size:0.74rem;margin-top:2px;}
.rep-foot{padding:20px 28px;border-top:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.rep-strength{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:.8rem;line-height:1.5;}
.rep-strength a{color:var(--accent);font-weight:600;text-decoration:none;}
.rep-fmeta{font-size:0.68rem;color:var(--muted);line-height:1.6;}
.rep-empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted);max-width:820px;margin:0 auto;}
.rep-empty h3{font-family:var(--rep-serif);color:var(--text);font-size:1.2rem;margin:0 0 7px;}

/* ── Print: the report doubles as a clean one-pager owners can save as PDF.
   White paper, no shadows, keep the serif letterhead, and never break a
   metric card or section across pages. ── */
@media print{
  body{background:#fff;padding:0;}
  .report-foot-cta{display:none;}
  .rep-sheet{border:none;box-shadow:none;max-width:none;}
  .rep-mast{background:#fff;}
  .rep-pad{padding:18px 6px;break-inside:avoid;page-break-inside:avoid;}
  .rep-kpis,.rep-card,.rep-chart,.rep-bench,.rep-rec,.rep-note{break-inside:avoid;page-break-inside:avoid;}
  .rep-foot{background:#fff;}
  .rep-chip.up{background:#e2ede0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rep-ffill,.rep-kpi,.rep-bmark,.rep-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="brand">
  <span class="mark">S</span>
  <span class="wm">Samba<small>Rentals · Bali</small></span>
</div>
<div id="report"><div class="loading">Loading your report…</div></div>
<div class="report-foot-cta">This is a private report for your villa. Questions? Reply to Maya on WhatsApp any time.</div>

<script>
/* escapeHtml() comes from /shared.js */
function fmtRange(a,b){const da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00'),sameM=da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear();return da.toLocaleDateString('en-GB',sameM?{day:'numeric'}:{day:'numeric',month:'short'})+' – '+db.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function repPctDelta(now,prev){ if(!prev) return now>0?{cls:'up',txt:'▲ new'}:{cls:'flat',txt:'—'}; const d=Math.round((now-prev)/prev*100); if(d>0)return{cls:'up',txt:'▲ '+d+'%'}; if(d<0)return{cls:'down',txt:'▼ '+Math.abs(d)+'%'}; return{cls:'flat',txt:'even'};}
function repPtsDelta(now,prev){ const d=now-prev; if(d>0)return{cls:'up',txt:'▲ '+d}; if(d<0)return{cls:'down',txt:'▼ '+Math.abs(d)}; return{cls:'flat',txt:'even'};}
function repChip(dl){return `<span class="rep-chip ${dl.cls}">${dl.txt}</span>`;}
function fmtMoney(v,cur){
  const p=cur==='IDR'?'Rp ':(cur||'')+' ';
  if(v>=1e9)return p+(v/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(v>=1e6)return p+(v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(v>=1e3)return p+Math.round(v/1e3)+'K';
  return p+Math.round(v);
}
function repSummary(d){
  const v=d.metrics.views,e=d.metrics.enquiries;
  const dv=v.prev?Math.round((v.now-v.prev)/v.prev*100):null;
  let s=`Interest in <b>${escapeHtml(d.name)}</b> `;
  s+=(dv==null)?`is building`:dv>0?`climbed ${dv}% this week`:dv<0?`eased ${Math.abs(dv)}% this week`:`held steady this week`;
  s+=` — <b>${v.now}</b> ${v.now===1?'person':'people'} opened your listing`;
  s+=e.now?` and <b>${e.now}</b> reached out to enquire.`:`, though none enquired yet.`;
  if(d.bookings&&d.bookings.week.count){const bw=d.bookings.week;s+=` Your calendar took <b>${bw.count}</b> new booking${bw.count===1?'':'s'} worth <b>${fmtMoney(bw.net,d.bookings.currency)}</b>.`;}
  return s;
}
function repBookings(d){
  if(!d.bookings)return '';
  const bk=d.bookings,wk=bk.week,up=bk.upcoming;
  const kpi=(l,v,u,chipHtml,ctx)=>`<div class="rep-kpi"><div class="kl">${l}</div><div class="kv">${v}${u?`<small>${u}</small>`:''}</div>${chipHtml||''}<div class="kc">${ctx}</div></div>`;
  const chips=Object.entries(wk.byChannel||{}).map(([c,n])=>escapeHtml(c)+(n>1?' ×'+n:'')).join(' · ');
  const cancelNote=bk.cancelledThisWeek?` One booking was cancelled this week.`:'';
  return `<div class="rep-pad"><div class="rep-sec-h">Bookings &amp; revenue</div>
    <div class="rep-kpis">
      ${kpi('New bookings',wk.count,'',repChip(repPtsDelta(wk.count,bk.prevWeek.count)),chips||'none this week')}
      ${kpi('Nights sold',wk.nights,'',repChip(repPtsDelta(wk.nights,bk.prevWeek.nights)),'from this week’s bookings')}
      ${kpi('Booked this week',fmtMoney(wk.net,bk.currency),'','',wk.count?'net of channel fees':'no new bookings yet')}
      ${kpi('On the books',fmtMoney(up.net,bk.currency),'','',up.count+' confirmed stay'+(up.count===1?'':'s')+' ahead')}
    </div>
    <p class="rep-conv">${up.adr?`Confirmed stays ahead average <b>${fmtMoney(up.adr,bk.currency)}</b> a night across <b>${up.nights}</b> nights. `:''}Figures come straight from your booking channels — Airbnb, direct and others — and show what you receive after channel fees.${cancelNote}</p>
  </div>`;
}
function repChart(daily){
  const max=Math.max(...daily.map(x=>x.views),1);
  const bars=daily.map((x,i)=>{
    const h=Math.max(2,Math.round(x.views/max*130)),bx=i*100+18,by=165-h,cx=bx+32,peak=x.views===max&&max>0;
    const wd=new Date(x.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'});
    return `<rect class="rep-bar${peak?' peak':''}" x="${bx}" y="${by}" width="64" height="${h}" rx="4"/><text class="rep-bv" x="${cx}" y="${by-5}" text-anchor="middle">${x.views}</text><text class="rep-bl" x="${cx}" y="185" text-anchor="middle">${wd}</text>`;
  }).join('');
  const avg=Math.round(daily.reduce((a,b)=>a+b.views,0)/daily.length);
  const peakDay=daily.reduce((a,b)=>b.views>a.views?b:a,daily[0]);
  return `<div class="rep-chart"><svg viewBox="0 0 700 200" role="img" aria-label="Daily listing views this week"><line x1="0" y1="165" x2="700" y2="165" stroke="var(--border)"/>${bars}</svg><div class="rep-chart-foot"><span>Peak · <b>${new Date(peakDay.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'})}, ${peakDay.views} views</b></span><span>Daily average · <b>${avg} views</b></span></div></div>`;
}
function repRecs(d){
  const recs=[];
  if(d.occupancy&&d.occupancy.openWindows.length){const w=d.occupancy.openWindows[0];recs.push([`Fill your ${fmtRange(w.from,w.to)} gap`,`A ${w.nights}-night opening between bookings. Maya can push a weekly-rate offer to the ${d.agentsReached.now} agents already following this villa.`]);}
  const conv=d.funnel.viewed?d.funnel.enquired/d.funnel.viewed:0;
  if(d.funnel.viewed>20&&conv<0.02) recs.push(['Refresh your photos','Views are healthy but few turn into enquiries. New hero and interior shots typically lift the enquiry rate.']);
  if(d.benchmark.percentile!=null&&d.benchmark.percentile>=70) recs.push(['Hold your rate','Demand is running well above comparable villas — no need to discount this month.']);
  if(d.metrics.enquiries.now===0&&d.metrics.views.now>5) recs.push(['Make enquiring easy','People are looking but not messaging. Check your WhatsApp contact and pricing are clear and up front.']);
  if(!recs.length) recs.push(['Keep your calendar current','An up-to-date availability calendar keeps you in Maya\'s daily availability broadcast to agents.']);
  return recs.slice(0,3);
}
function renderReport(d){
  const m=d.metrics,occ=d.occupancy,ar=d.agentsReached;
  const kpi=(l,v,u,chipHtml,ctx)=>`<div class="rep-kpi"><div class="kl">${l}</div><div class="kv">${v}${u?`<small>${u}</small>`:''}</div>${chipHtml||''}<div class="kc">${ctx}</div></div>`;
  const kpis=`<div class="rep-kpis">
    ${kpi('Listing views',m.views.now,'',repChip(repPctDelta(m.views.now,m.views.prev)),`vs ${m.views.prev} last week`)}
    ${kpi('Enquiries',m.enquiries.now,'',repChip(repPtsDelta(m.enquiries.now,m.enquiries.prev)),'agents who messaged to book')}
    ${kpi('Agents reached',ar.now,'',repChip(repPtsDelta(ar.now,ar.prev)),'unique agents this week')}
    ${occ?kpi('Occupancy · 30d',occ.pct,'%','','of the next 30 nights'):kpi('Occupancy · 30d','—','','','add an iCal link to track')}
  </div>`;
  const fmax=Math.max(d.funnel.viewed,d.funnel.engaged,d.funnel.enquired,1);
  const fw=v=>Math.max(6,Math.round(v/fmax*100));
  const conv=d.funnel.viewed?(d.funnel.enquired/d.funnel.viewed*100):0;
  const funnel=`<div class="rep-funnel">
    <div class="rep-fstep"><div class="ffl">Viewed the listing<small>opened the page</small></div><div class="rep-ftrack"><div class="rep-ffill s1" style="width:${fw(d.funnel.viewed)}%"><span class="fn">${d.funnel.viewed}</span></div></div></div>
    <div class="rep-fstep"><div class="ffl">Engaged<small>opened your photos</small></div><div class="rep-ftrack"><div class="rep-ffill s2" style="width:${fw(d.funnel.engaged)}%"><span class="fn">${d.funnel.engaged}</span></div></div></div>
    <div class="rep-fstep"><div class="ffl">Enquired<small>tapped to message</small></div><div class="rep-ftrack"><div class="rep-ffill s3" style="width:${fw(d.funnel.enquired)}%"><span class="fn">${d.funnel.enquired}</span></div></div></div>
  </div><p class="rep-conv">A <b>${conv.toFixed(1)}%</b> view-to-enquiry rate this week. Guests who open your photos convert well — the opportunity is getting more of them past the first screen.</p>`;
  const reachCards=`<div class="rep-cols">
    <div class="rep-card fill"><h4>Agent network</h4><div class="rep-big">${ar.now} <small>agents</small></div><p style="margin:9px 0 14px;color:var(--text-2);font-size:0.8rem;line-height:1.5">saw or shared this villa this week — each selling to their own guest list.</p>
      <div class="rep-line"><span class="lk">Times shared onward</span><span class="lv">${m.shares.now}</span></div>
      <div class="rep-line"><span class="lk">New agents this week</span><span class="lv">${ar.now-ar.prev>=0?'+':''}${ar.now-ar.prev}</span></div>
      <div class="rep-line"><span class="lk">Maya's active network</span><span class="lv">${d.maya.networkAgents.toLocaleString()}</span></div>
      ${d.maya.broadcastEligible!=null?`<div class="rep-line"><span class="lk">Daily availability broadcast</span><span class="lv">${d.maya.broadcastEligible?'Included':'—'}</span></div>`:''}</div>
    <div class="rep-card"><h4>Photo engagement</h4><div class="rep-big">${m.photoViews.now.toLocaleString()} <small>photo views</small></div><p style="margin:9px 0 14px;color:var(--text-2);font-size:0.8rem;line-height:1.5">How hard your gallery is working to sell the villa.</p>
      <div class="rep-line"><span class="lk">vs last week</span><span class="lv">${repPctDelta(m.photoViews.now,m.photoViews.prev).txt}</span></div>
      <div class="rep-line"><span class="lk">Downloaded by agents</span><span class="lv">${m.downloads.now}</span></div></div>
  </div>`;
  let occSection='';
  if(occ){
    const off=Math.round(276*(1-occ.pct/100));
    const bookRows=[...occ.bookings.map(b=>`<div class="rep-book"><span class="bd"></span><span>Confirmed stay</span><span class="bt">${fmtRange(b.from,b.to)}</span></div>`),
      ...occ.openWindows.map(w=>`<div class="rep-book open"><span class="bd"></span><span style="color:var(--accent)"><b>Open window</b> · ${w.nights} nights</span><span class="bt">${fmtRange(w.from,w.to)}</span></div>`)].join('')||'<p style="font-size:0.78rem;color:var(--muted)">No upcoming stays on the calendar yet.</p>';
    occSection=`<div class="rep-pad"><div class="rep-sec-h">Occupancy &amp; upcoming stays</div><div class="rep-cols">
      <div class="rep-card"><h4>Next 30 nights</h4><div class="rep-ring">
        <svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--surface2)" stroke-width="11"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--green)" stroke-width="11" stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="${off}" transform="rotate(-90 52 52)"/><text x="52" y="50" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="var(--text)">${occ.pct}%</text><text x="52" y="67" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="var(--muted)">BOOKED</text></svg>
        <div style="font-size:0.8rem;color:var(--text-2);line-height:1.7"><div><b style="color:var(--text)">${occ.bookedNights}</b> nights booked</div><div><b style="color:var(--text)">${occ.openNights}</b> nights open</div><div style="margin-top:6px;color:var(--muted);font-size:0.7rem">Rolling 30-day window</div></div>
      </div></div>
      <div class="rep-card"><h4>On the calendar</h4>${bookRows}</div>
    </div></div>`;
  }
  let benchSection='';
  if(d.benchmark.percentile!=null){
    const p=d.benchmark.percentile;
    benchSection=`<div class="rep-pad"><div class="rep-sec-h">How you compare</div><div class="rep-bench">
      <div class="bh"><div class="bp">Top <b>${100-p}%</b> of villas on Samba</div><div class="bs">by weekly enquiries · ${d.benchmark.peerCount} active listings</div></div>
      <div class="rep-btrack"><span class="rep-bmark" style="left:${p}%"></span></div>
      <div class="rep-bscale"><span>Lower demand</span><span>You · ${p}th percentile</span><span>Higher demand</span></div>
    </div></div>`;
  }
  const recs=repRecs(d).map((r,i)=>`<div class="rep-rec"><span class="rn">${i+1}</span><p class="rt"><b>${escapeHtml(r[0])}.</b><span>${escapeHtml(r[1])}</span></p></div>`).join('');
  return `<div class="rep-sheet">
    <div class="rep-mast"><span class="rl">Samba · weekly owner report</span><span class="rr">Week of<b>${fmtRange(d.week.from,d.week.to)}</b></span></div>
    <div class="rep-pad">
      <div class="rep-eyebrow">Owner report</div>
      <div class="rep-title">${escapeHtml(d.name)}</div>
      <div class="rep-loc">${d.unitType?`<span>${escapeHtml(d.unitType)}</span><span class="rd"></span>`:''}${d.area?`<span>${escapeHtml(d.area)}</span>`:''}</div>
      ${d.ownerName?`<p class="rep-prep">Prepared for <b>${escapeHtml(d.ownerName)}</b> by <b>Maya</b>, your Samba listings agent.</p>`:''}
      <p class="rep-note">${repSummary(d)}</p>
    </div>
    <div class="rep-pad"><div class="rep-sec-h">This week at a glance</div>${kpis}</div>
    ${repBookings(d)}
    <div class="rep-pad"><div class="rep-sec-h">Views, day by day</div>${repChart(d.daily)}</div>
    <div class="rep-pad"><div class="rep-sec-h">From view to enquiry</div>${funnel}</div>
    <div class="rep-pad"><div class="rep-sec-h">Your reach across the network</div>${reachCards}</div>
    ${occSection}
    ${benchSection}
    <div class="rep-pad"><div class="rep-sec-h">Suggested next steps</div><div class="rep-recs">${recs}</div></div>
    ${d.strength&&d.strength.score<85?`<div class="rep-pad"><div class="rep-strength">Listing strength <b>${d.strength.score}%</b> — to reach more agents: ${escapeHtml(d.strength.tips.join(' · '))}. <a href="https://sambarentals.com/portal">Improve it in the portal →</a></div></div>`:''}
    <div class="rep-foot"><div class="rep-fmeta">Maya prepares this for you every week.<br>Numbers are live — this link always shows your latest.</div></div>
  </div>`;
}
function errCard(msg){ return `<div class="rep-empty"><h3>Report unavailable</h3><p>${escapeHtml(msg)}</p></div>`; }
function getToken(){
  const m = location.pathname.match(/\/r\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  const u = new URLSearchParams(location.search);
  return u.get('token') || u.get('t') || '';
}
(async function boot(){
  const el = document.getElementById('report');
  const token = getToken();
  if(!token){ el.innerHTML = errCard('This report link is incomplete.'); return; }
  try{
    const r = await fetch('/api/portal?action=public-report&token=' + encodeURIComponent(token));
    if(!r.ok){ const b = await r.json().catch(()=>({})); el.innerHTML = errCard(b.error || 'This report link is no longer valid.'); return; }
    el.innerHTML = renderReport(await r.json());
  }catch(e){ el.innerHTML = errCard('Could not load the report just now. Please try again shortly.'); }
})();
</script>
</body>
</html>
