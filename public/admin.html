<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Samba Rentals</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/brand.css">
<script src="/shared.js"></script>
<style>
/* Core tokens come from brand.css aliases; only page-specific extras live here. */
:root{--green:var(--sb-success-fg);--red:var(--sb-error-fg);--yellow:#B8860B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{width:100%;max-width:360px;padding:0 20px;}
.login-brand{font-family:'Satoshi',-apple-system,sans-serif;font-size:1.8rem;margin-bottom:6px;color:var(--accent);}
.login-sub{font-size:0.72rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:32px;}
.login-label{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block;}
.login-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.85rem;color:var(--text);outline:none;transition:border-color 0.2s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{margin-top:14px;width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;transition:opacity 0.2s;}
.login-btn:hover{opacity:0.88;}
.login-err{margin-top:10px;color:var(--red);font-size:0.78rem;text-align:center;}

/* APP */
#app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;gap:12px;}
.topbar-brand{font-family:'Satoshi',-apple-system,sans-serif;font-size:1rem;}
.topbar-sub{font-size:0.7rem;color:var(--muted);}
.spacer{flex:1;}
.logout-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:5px 12px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.72rem;cursor:pointer;}
.logout-btn:hover{color:var(--text);}

.content{padding:24px 28px 80px;max-width:900px;margin:0 auto;}
@media(max-width:640px){.content{padding:16px;}.topbar{padding:0 16px;}}
/* iOS auto-zoom guard — sub-16px inputs zoom the page on focus */
@media(max-width:640px){.field-input,.field-textarea,.login-input{font-size:16px;}}

/* LISTING CARDS */
.listing-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.card-title{font-family:'Satoshi',-apple-system,sans-serif;font-size:1.1rem;}
.card-slug{font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;}
.save-btn:hover{opacity:0.88;}
.save-btn:disabled{opacity:0.45;cursor:default;}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}
.field-row.full{grid-template-columns:1fr;}

.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.field-input,.field-textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.82rem;color:var(--text);outline:none;transition:border-color 0.2s;width:100%;resize:vertical;}
.field-input:focus,.field-textarea:focus{border-color:var(--accent);}
.field-textarea{line-height:1.5;}
.field-hint{font-size:0.65rem;color:var(--muted);}
.owner-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:4px;}
.owner-card.empty{color:var(--muted);font-size:0.78rem;}
.owner-who{font-size:0.86rem;font-weight:600;color:var(--text);}
.owner-meta{font-size:0.7rem;color:var(--muted);margin-top:3px;}

/* DRIVE PREVIEW / COVER PICKER */
.drive-row{display:flex;gap:12px;align-items:flex-start;}
.drive-input-wrap{flex:1;}
.drive-preview-placeholder{font-size:0.65rem;color:var(--muted);padding:8px 4px;}
.drive-grid{display:flex;gap:6px;flex-wrap:wrap;min-height:48px;align-items:center;}
.drive-thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:0.8;transition:all 0.15s;}
.drive-thumb:hover{opacity:1;}
.drive-thumb.selected{border-color:var(--accent);opacity:1;box-shadow:0 0 0 2px rgba(226,87,43,0.3);}
/* COVER FOCAL-POINT PICKER */
.cover-focus{position:relative;width:100%;max-width:340px;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);cursor:grab;touch-action:none;user-select:none;}
.cover-focus:active{cursor:grabbing;}
.cover-focus-img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.cover-focus-dot{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,0.3);box-shadow:0 0 0 1px rgba(0,0,0,0.5),0 1px 3px rgba(0,0,0,0.5);transform:translate(-50%,-50%);pointer-events:none;}
.cover-focus-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);font-size:0.78rem;}
.cover-focus-reset{margin-top:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.72rem;cursor:pointer;}
.ai-sort-row{margin-top:8px;display:flex;align-items:center;gap:10px;}
.ai-sort-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.72rem;cursor:pointer;}
.ai-sort-btn:disabled{opacity:0.5;cursor:default;}
/* HIDDEN (AI-flagged duplicate/similar) PHOTOS */
.drive-hidden-wrap{margin-top:10px;}
.drive-hidden-label{font-size:0.65rem;color:var(--muted);margin-bottom:5px;}
.drive-hidden-grid{display:flex;gap:6px;flex-wrap:wrap;}
.drive-hidden-item{position:relative;width:56px;height:56px;}
.drive-hidden-item img{width:56px;height:56px;border-radius:6px;object-fit:cover;opacity:0.4;filter:grayscale(0.4);}
.drive-restore-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);color:#fff;border:none;border-radius:6px;font-size:0.6rem;font-weight:600;cursor:pointer;opacity:0;transition:opacity 0.15s;}
.drive-hidden-item:hover .drive-restore-btn{opacity:1;}
/* Visible thumbs: click the photo to make it the cover, click the corner x to
   hide it from the gallery. Hiding never touches Google Drive. */
.drive-thumb-wrap{position:relative;width:56px;height:56px;}
.drive-hide-btn{position:absolute;top:-5px;right:-5px;width:17px;height:17px;padding:0;line-height:15px;text-align:center;
  border-radius:50%;border:1px solid #fff;background:rgba(20,20,20,0.82);color:#fff;font-size:0.7rem;font-weight:700;
  cursor:pointer;opacity:0;transition:opacity 0.15s;z-index:2;}
.drive-thumb-wrap:hover .drive-hide-btn{opacity:1;}
.drive-hide-btn:hover{background:#c5221f;}
/* Drop zone for adding photos straight into the listing's Drive folder */
.photo-drop{margin-top:8px;padding:12px;border:1.5px dashed var(--line,#d8d2c7);border-radius:8px;text-align:center;
  font-size:0.7rem;color:var(--muted);cursor:pointer;transition:all 0.15s;background:transparent;}
.photo-drop:hover{border-color:var(--accent);color:var(--ink,#333);}
.photo-drop.over{border-color:var(--accent);background:rgba(226,87,43,0.07);color:var(--ink,#333);}
.photo-drop.busy{cursor:progress;border-style:solid;}
/* Manual photo sorting: drag a thumb to move it. The number is its position
   in the gallery, so the effect of a drag is visible without saving first. */
.drive-thumb-wrap{cursor:grab;}
.drive-thumb-wrap.dragging{opacity:0.35;cursor:grabbing;}
.drive-thumb-wrap.drop-target{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px;}
.drive-pos{position:absolute;left:-4px;bottom:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:rgba(20,20,20,0.78);color:#fff;font-size:0.55rem;line-height:15px;text-align:center;pointer-events:none;}
.drive-thumb-wrap:first-child .drive-pos{background:var(--accent);}
.cover-focus-reset:hover{border-color:var(--muted);}

/* PRICING ROW */
.pricing-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
@media(max-width:500px){.pricing-row{grid-template-columns:1fr 1fr;}}

/* SECTION DIVIDER */
.section-label{font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 12px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* SECTIONS */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;}
.section-head h2{font-family:'Satoshi',-apple-system,sans-serif;font-size:1.2rem;font-weight:600;}
.section-head .hint{font-size:0.7rem;color:var(--muted);margin-top:3px;}
.add-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.78rem;font-weight:500;cursor:pointer;transition:opacity 0.2s;}
.add-btn:hover{opacity:0.88;}
.delete-btn{background:none;border:1px solid var(--red);border-radius:8px;color:var(--red);padding:8px 16px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.75rem;cursor:pointer;transition:all 0.2s;}
.delete-btn:hover{background:var(--red);color:#fff;}
.check-row{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--muted);cursor:pointer;user-select:none;}
.check-row input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
.custom-badge{font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;background:rgba(42,106,58,0.12);color:var(--green);border:1px solid rgba(42,106,58,0.3);border-radius:4px;padding:2px 7px;margin-left:8px;vertical-align:middle;}
.status-badge{font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;border:1px solid;border-radius:4px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
.status-badge.pending{background:rgba(184,134,11,0.12);color:#9a7012;border-color:rgba(184,134,11,0.3);}
.status-badge.approved{background:rgba(42,106,58,0.12);color:var(--green);border-color:rgba(42,106,58,0.3);}
.status-badge.rejected{background:rgba(181,69,58,0.12);color:var(--red);border-color:rgba(181,69,58,0.3);}
.owner-note{font-size:0.66rem;color:var(--muted);margin-top:4px;}
.review-btn{border-radius:7px;padding:7px 13px;font-family:inherit;font-size:0.74rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);}
.review-btn.approve{background:rgba(42,106,58,0.12);border-color:rgba(42,106,58,0.4);color:var(--green);}
.review-btn.reject{background:rgba(181,69,58,0.1);border-color:rgba(181,69,58,0.35);color:var(--red);}
.empty-hint{padding:24px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:0.8rem;text-align:center;margin-bottom:24px;}

/* AIRBNB/BOOKING IMPORT (new-property card) */
.import-block{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px;}
.import-brands{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:0.78rem;}
.brand-airbnb{font-weight:800;font-size:0.95rem;color:#FF5A5F;letter-spacing:-0.02em;}
.brand-booking{font-weight:800;font-size:0.9rem;letter-spacing:-0.01em;}
.brand-booking .b1{color:#003B95}.brand-booking .b2{color:#0096FF}
.import-row{display:flex;gap:8px;}
.import-row .field-input{flex:1;min-width:0;}

/* LISTINGS INDEX (compact rows + expand-on-click) */
.listing-toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;display:flex;flex-direction:column;gap:10px;}
.listing-search{max-width:420px;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-family:'Satoshi',-apple-system,sans-serif;font-size:0.72rem;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.chip:hover{color:var(--text);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.listing-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.listing-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;padding:10px 14px;cursor:pointer;text-align:left;font-family:'Satoshi',-apple-system,sans-serif;color:var(--text);}
.listing-row:hover{background:var(--surface2);}
.row-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface2);}
.row-thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.85rem;}
.row-main{flex:1;min-width:0;}
.row-name{font-size:0.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta{font-size:0.72rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-chevron{color:var(--muted);font-size:0.8rem;transition:transform 0.2s;flex-shrink:0;}
.listing-item.open .row-chevron{transform:rotate(180deg);}
.listing-detail{display:none;}
.listing-item.open .listing-detail{display:block;border-top:1px solid var(--border);}
.listing-detail .listing-card{border:none;border-radius:0;margin-bottom:0;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:10px;font-size:0.78rem;letter-spacing:0.04em;transition:transform 0.25s cubic-bezier(.2,.9,.3,1.2);z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}

.loading-state{padding:60px;text-align:center;color:var(--muted);}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TABS */
.admin-tabs{display:flex;gap:4px;overflow-x:auto;}
.admin-tabs::-webkit-scrollbar{display:none;}
.atab{background:none;border:none;color:var(--muted);font-family:'Satoshi',-apple-system,sans-serif;font-size:0.8rem;font-weight:500;padding:8px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.atab:hover{color:var(--text);background:var(--surface2);}
.atab.on{color:var(--accent);background:var(--surface2);}
.atab-count{background:var(--accent);color:#fff;border-radius:10px;font-size:0.62rem;font-weight:700;padding:1px 6px;min-width:16px;text-align:center;}
.atab-count:empty{display:none;}
.admin-frame{width:100%;height:calc(100vh - 130px);border:none;background:var(--bg);border-radius:12px;}
@media(max-width:640px){.admin-tabs{gap:0;}.atab{padding:7px 8px;font-size:0.72rem;}.topbar-sub{display:none;}}

/* Empty / errors */
.empty-state{padding:56px 24px;text-align:center;color:var(--muted);}
.empty-state h3{font-family:'Satoshi',-apple-system,sans-serif;color:var(--text);font-size:1.15rem;margin-bottom:8px;}
.empty-state p{font-size:0.85rem;max-width:420px;margin:0 auto;line-height:1.6;}
.err-list{display:flex;flex-direction:column;gap:10px;}
.err-row{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red,#a8331f);border-radius:10px;padding:12px 14px;}
.err-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;}
.err-ctx{font-family:'Satoshi',-apple-system,sans-serif;font-size:0.74rem;font-weight:600;color:var(--red,#a8331f);background:#f2ddd6;border-radius:5px;padding:2px 8px;}
.err-ts{font-size:0.7rem;color:var(--muted);white-space:nowrap;}
.err-msg{font-size:0.85rem;color:var(--text);line-height:1.5;}
.err-stack{margin-top:8px;font-family:'JetBrains Mono','SF Mono',monospace;font-size:0.68rem;color:var(--muted);white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:6px;padding:8px 10px;overflow-x:auto;}
</style>
</head>
<body>

<!-- Suggested marketing badges for the listing editors (free text allowed) -->
<datalist id="badge-suggestions">
  <option value="Price drop"></option>
  <option value="New"></option>
  <option value="Just renovated"></option>
  <option value="Last unit"></option>
  <option value="Available now"></option>
</datalist>

<div id="login">
  <div class="login-box">
    <div class="login-brand">Admin</div>
    <img src="/logo-samba.png" alt="Samba" style="height:100px;margin-bottom:8px">
    <div class="login-sub">Listings admin</div>
    <!-- Wrapped in a real form with a named field: without one, password
         managers won't reliably offer to save or fill this, which pushes
         whoever uses the console toward a weaker, memorable password. -->
    <form onsubmit="event.preventDefault();doLogin()">
      <label class="login-label" for="pwd">Password</label>
      <input class="login-input" id="pwd" name="password" type="password"
             autocomplete="current-password" placeholder="Enter password" />
      <button class="login-btn" type="submit">Enter</button>
    </form>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <span class="topbar-brand">Admin</span>
    <div class="admin-tabs">
      <button class="atab on" data-tab="approvals" onclick="showTab('approvals')">Approvals <span class="atab-count" id="approvals-count"></span></button>
      <button class="atab" data-tab="listings" onclick="showTab('listings')">Listings</button>
      <button class="atab" data-tab="analytics" onclick="showTab('analytics')">Analytics</button>
      <button class="atab" data-tab="campaigns" onclick="showTab('campaigns')">Campaigns</button>
      <button class="atab" data-tab="payouts" onclick="showTab('payouts')">Payouts</button>
      <button class="atab" data-tab="visits" onclick="showTab('visits')">Visits</button>
      <button class="atab" data-tab="promos" onclick="showTab('promos')">Promo codes</button>
      <button class="atab" data-tab="errors" onclick="showTab('errors')">Errors <span class="atab-count" id="errors-count"></span></button>
    </div>
    <div class="spacer"></div>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>
  <div class="content">
    <div id="tab-approvals" class="tabpane"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
    <div id="tab-listings" class="tabpane" style="display:none"></div>
    <div id="tab-analytics" class="tabpane" style="display:none"><iframe id="analytics-frame" class="admin-frame" title="Analytics"></iframe></div>
    <div id="tab-campaigns" class="tabpane" style="display:none"><iframe id="campaigns-frame" class="admin-frame" title="Campaigns"></iframe></div>
    <div id="tab-payouts" class="tabpane" style="display:none"><iframe id="payouts-frame" class="admin-frame" title="Payouts"></iframe></div>
    <div id="tab-visits" class="tabpane" style="display:none"></div>
    <div id="tab-promos" class="tabpane" style="display:none"></div>
    <div id="tab-errors" class="tabpane" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminPw = '';

function doLogin() {
  const pw = document.getElementById('pwd').value.trim();
  if (!pw) return;
  adminPw = pw;
  sessionStorage.setItem('admin_pw', pw);
  loadListings();
}

function logout() {
  sessionStorage.removeItem('admin_pw');
  adminPw = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwd').value = '';
  document.getElementById('login-err').textContent = '';
}

function showGate(errMsg) {
  sessionStorage.removeItem('admin_pw');
  adminPw = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  if (errMsg) document.getElementById('login-err').textContent = errMsg;
}

let toastTimer;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);

}

async function loadVisitsTab() {
  const pane = document.getElementById('tab-visits');

    pane.innerHTML = '<div class="loading-state">Could not load visits: ' + e.message + '</div>';

function renderVisitsTab(d) {
  const vs = d.viewings || [];
  const now = Date.now();
  const when = (v) => {
    if (!v.scheduled_at) return v.requested_window ? 'asked: ' + esc(v.requested_window) : '—';
    const t = new Date(Date.parse(v.scheduled_at) + 8 * 3600e3);
    return t.toISOString().slice(0, 10) + ' · ' + t.toISOString().slice(11, 16) + ' WITA';
  };
  const badge = (txt, color) => `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.68rem;background:${color}22;color:${color};font-weight:600">${txt}</span>`;
  const statusBadge = (v) => v.status === 'confirmed' ? badge('confirmed', '#1B7A44')
    : v.status === 'requested' ? badge('awaiting reply', '#B8860B')
    : v.status === 'completed' ? badge('completed', '#1B7A44')
    : v.status === 'no_show' ? badge('no-show', '#C0392B')
    : badge(v.status, '#8a8478');
  const upcoming = vs.filter(v => v.status === 'confirmed' && v.scheduled_at && Date.parse(v.scheduled_at) >= now - 3600e3)
    .sort((a, b) => Date.parse(a.scheduled_at) - Date.parse(b.scheduled_at));
  const awaiting = vs.filter(v => v.status === 'requested');
  const past = vs.filter(v => ['completed','no_show','cancelled','declined','expired'].includes(v.status)
      || (v.status === 'confirmed' && v.scheduled_at && Date.parse(v.scheduled_at) < now - 3600e3))
    .sort((a, b) => Date.parse(b.scheduled_at || b.updated_at || b.created_at || 0) - Date.parse(a.scheduled_at || a.updated_at || a.created_at || 0))
    .slice(0, 20);
  const rows = (list) => list.length
    ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.82rem">
        <thead><tr style="text-align:left;color:var(--muted);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em">
          <th style="padding:6px 10px 6px 0">Property</th><th style="padding:6px 10px 6px 0">Agent</th><th style="padding:6px 10px 6px 0">Villa contact</th><th style="padding:6px 10px 6px 0">When</th><th style="padding:6px 0">Status</th></tr></thead>
        <tbody>${list.map(v => `<tr style="border-top:1px solid var(--border)">
          <td style="padding:9px 10px 9px 0;font-weight:500">${esc(v.property_name || v.rental_slug || '?')}</td>
          <td style="padding:9px 10px 9px 0">${esc(v.agent_name || (v.agent_wa ? '+' + v.agent_wa : '—'))}</td>
          <td style="padding:9px 10px 9px 0">${esc(v.contact_name || (v.contact_wa ? '+' + v.contact_wa : '—'))}</td>
          <td style="padding:9px 10px 9px 0;white-space:nowrap">${when(v)}</td>
          <td style="padding:9px 0">${statusBadge(v)}${v.outcome_note ? ' <span style="color:var(--muted);font-size:0.72rem">' + esc(v.outcome_note) + '</span>' : ''}</td>
        </tr>`).join('')}</tbody></table></div>`
    : '<div style="color:var(--muted);font-size:0.8rem;padding:4px 0 2px">Nothing here yet.</div>';
  document.getElementById('tab-visits').innerHTML = `
    <div class="section-head">
      <div><h2>Visits</h2><div class="hint">Viewing appointments Maya coordinates — confirmed slots get calendar invites both ways and a reminder on the day</div></div>
      <div style="display:flex;gap:10px">
        ${d.ics_url ? `<button class="review-btn" onclick="navigator.clipboard.writeText('${d.ics_url}');showToast('Calendar URL copied. Google Calendar → Other calendars → + → From URL')">Copy calendar URL</button>` : ''}
        <button class="review-btn" onclick="loadVisitsTab()">↻ Refresh</button>
      </div>
    </div>
    <div class="listing-card"><div class="section-label" style="margin-top:0">Upcoming</div>${rows(upcoming)}</div>
    <div class="listing-card"><div class="section-label" style="margin-top:0">Awaiting confirmation</div>${rows(awaiting)}</div>
    <div class="listing-card"><div class="section-label" style="margin-top:0">Recent outcomes</div>${rows(past)}</div>`;
}

async function promoApi(body) {
  try {
    const r = await fetch('/api/listings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminPw }, body: JSON.stringify(body) });
    if (r.status === 401) { showGate('Session expired. Please log in again.'); return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    promosCache = d.promos || {};
    renderPromosTab(promosCache);
    showToast('Saved', 'success');
  } catch(e) { showToast('Failed: ' + e.message, 'error'); }
}
function createPromo() {
  const code = document.getElementById('promo-new-code').value.trim().toUpperCase();
  if (!/^[A-Z0-9]{3,24}$/.test(code)) { showToast('Code must be 3–24 letters or numbers.', 'error'); return; }
  promoApi({ action: 'promo-save', code, durationDays: document.getElementById('promo-new-days').value, maxRedemptions: document.getElementById('promo-new-max').value, active: true });
}
function togglePromo(code) {
  const p = promosCache[code] || {};
  promoApi({ action: 'promo-save', code, durationDays: p.durationDays, maxRedemptions: p.maxRedemptions == null ? '' : p.maxRedemptions, active: p.active === false });
}
function deletePromo(code) {
  if (!confirm('Delete code ' + code + '? Anyone holding it can no longer redeem.')) return;
  promoApi({ action: 'promo-delete', code });
}

function extractFolderId(url) {
  const m = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);

}

// ── Listings tab: compact searchable index; the full edit form only renders
// when a row is expanded (and Drive previews only load for open cards). ──
let listingQuery = '';
let listingChip = 'all';
const expandedSlugs = new Set();

function listingMatches(l) {
  const q = listingQuery.trim().toLowerCase();
  if (q && ![l.name, l.slug, l.tag, l.unitType].some(v => v && String(v).toLowerCase().includes(q))) return false;
  switch (listingChip) {
    case 'pending':  return isPendingReview(l);
    case 'custom':   return !!l.custom;
    case 'hostex':   return !l.custom;
    case 'owner':    return !!(l.ownerEmail || l.ownerSub);
    case 'nophotos': return !l.folder;
    default:         return true;
  }
}

function setListingChip(k) {
  listingChip = k;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.chip === k));
  renderListingsBody();
}

function renderListingsTab() {
  const pendingCount = allListings.filter(l => isPendingReview(l)).length;
  const chips = [
    ['all', 'All'],
    ['pending', 'Pending review' + (pendingCount ? ` (${pendingCount})` : '')],
    ['custom', 'Custom'],
    ['hostex', 'Hostex'],
    ['owner', 'Has owner'],
    ['nophotos', 'No photos'],
  ];
  document.getElementById('tab-listings').innerHTML = `
    <div class="listing-toolbar">
      <input class="field-input listing-search" id="listing-search" placeholder="Search name, slug, area, unit type…"
        value="${esc(listingQuery)}" oninput="listingQuery = this.value; renderListingsBody()" />
      <div class="filter-chips">${chips.map(([k, label]) =>
        `<button class="chip${listingChip === k ? ' on' : ''}" data-chip="${k}" onclick="setListingChip('${k}')">${label}</button>`).join('')}
      </div>
    </div>
    <div id="listings-body"></div>`;
  renderListingsBody();
}

function renderListingsBody() {
  const body = document.getElementById('listings-body');
  if (!body) return;
  const filtering = listingQuery.trim() || listingChip !== 'all';
  // Pending owner submissions float to the top so they're reviewed first.
  const rank = l => (isPendingReview(l)) ? 0 : 1;
  const customs = allListings.filter(l => l.custom && listingMatches(l)).sort((a, b) => rank(a) - rank(b));
  const defaults = allListings.filter(l => !l.custom && listingMatches(l));
  body.innerHTML =
    `<div class="section-head">
      <div><h2>Custom properties</h2><div class="hint">Properties not in Hostex, fully managed here</div></div>
      <button class="add-btn" onclick="addCustom()">+ Add Property</button>
    </div>
    <div id="new-custom-slot"></div>` +
    (customs.length ? customs.map(listingItem).join('') :
      `<div class="empty-hint">${filtering ? 'No custom properties match.' : 'No custom properties yet. Click "+ Add Property" to create one.'}</div>`) +
    `<div class="section-head" style="margin-top:36px"><div><h2>Hostex listings</h2><div class="hint">Synced from Hostex, details editable here</div></div></div>` +
    (defaults.length ? defaults.map(listingItem).join('') :
      '<div class="empty-hint">No Hostex listings match.</div>');
  // Re-mount editors that were open before this re-render (fresh data, no stale forms)
  expandedSlugs.forEach(slug => {
    const l = allListings.find(x => x.slug === slug);
    if (l && document.getElementById('detail-' + slug)) mountDetail(l);
  });
}

function listingItem(l) {
  const open = expandedSlugs.has(l.slug);
  const price = [l.monthly && l.monthly + '/mo', l.yearly && l.yearly + '/yr'].filter(Boolean).join(' · ');
  const meta = [l.unitType, l.tag, price].filter(Boolean).join(' · ');
  const thumb = l.coverPhotoId
    ? `<img class="row-thumb" src="https://lh3.googleusercontent.com/d/${esc(l.coverPhotoId)}=w112-h112" loading="lazy" alt="" onerror="this.remove()">`
    : `<div class="row-thumb empty">${l.folder ? '' : '–'}</div>`;
  // statusBadge only means something for custom listings — Hostex units can
  // carry ownerSub (claimed via the owner portal) but never have a status.
  const badges = (l.custom ? '<span class="custom-badge">custom</span>' + statusBadge(l) : '')
    + (l.hidden ? '<span class="status-badge rejected">hidden</span>' : '')
    + (!l.folder ? '<span class="status-badge pending">no photos</span>' : '');
  return `<div class="listing-item${open ? ' open' : ''}" id="item-${l.slug}">
    <button type="button" class="listing-row" onclick="toggleListing('${l.slug}')">
      ${thumb}
      <div class="row-main">
        <div class="row-name">${esc(l.name || l.slug)}${badges}</div>
        <div class="row-meta">${esc(meta) || '&nbsp;'}</div>
      </div>
      <span class="row-chevron">▾</span>
    </button>
    <div class="listing-detail" id="detail-${l.slug}"></div>
  </div>`;
}

function toggleListing(slug) {
  const l = allListings.find(x => x.slug === slug);
  if (!l) return;
  if (expandedSlugs.has(slug)) {
    expandedSlugs.delete(slug);
    const d = document.getElementById('detail-' + slug);
    if (d) d.innerHTML = '';
    const item = document.getElementById('item-' + slug);
    if (item) item.classList.remove('open');
  } else {
    expandedSlugs.add(slug);
    mountDetail(l);
  }
}

function mountDetail(l) {
  const d = document.getElementById('detail-' + l.slug);
  if (!d) return;
  d.innerHTML = l.custom ? customCard(l, false) : defaultCard(l);
  document.getElementById('item-' + l.slug).classList.add('open');

// ── Airbnb / Booking import (new-property card) ──
// Same backend as the owner portal's importer (api/portal.js), authed with
// the admin password instead of a Google session. Fills only empty fields;
// photos are copied into a fresh Drive folder and wired into the photo input.
async function adminImportListing(slug) {
  const url = (document.getElementById(slug + '-import-url') || {}).value?.trim();
  const hint = document.getElementById(slug + '-import-hint');
  const btn = document.getElementById(slug + '-import-btn');
  if (!url) { hint.textContent = 'Paste an Airbnb or Booking.com listing link first.'; return; }
  btn.disabled = true; btn.textContent = 'Importing…'; hint.textContent = 'Reading the listing…';
  const call = (action, body) => fetch('/api/portal?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminPw },
    body: JSON.stringify(body),
  }).then(async r => ({ ok: r.ok, body: await r.json().catch(() => ({})) }));
  try {
    const r = await call('import-listing', { url });
    if (!r.ok) throw new Error(r.body?.error || 'Import failed');
    const f = r.body?.fields || {};
    const set = (field, v) => { const el = document.getElementById(slug + '-' + field); if (el && v != null && v !== '' && !el.value) { el.value = v; return true; } return false; };
    const got = [];
    if (set('name', f.name)) got.push('name');
    if (set('tag', f.area)) got.push('area');
    if (set('unitType', f.unitType)) got.push('unit type');
    if (set('overview', f.overview)) got.push('overview');

    const photos = Array.isArray(f.photos) ? f.photos : [];
    const folderInput = document.getElementById(slug + '-folder-url');
    if (photos.length && r.body?.photosImportable && folderInput && !folderInput.value) {
      let folderId = '', folderLink = '', uploaded = 0, failed = 0;
      const CHUNK = 5;
      for (let i = 0; i < photos.length; i += CHUNK) {
        hint.textContent = 'Importing photos… ' + i + ' of ' + photos.length + ' done';
        const pr = await call('import-photos', { photos: photos.slice(i, i + CHUNK), startIndex: i, folderId, folderName: f.name || '' });
        if (!pr.ok) { failed += photos.length - i; break; }
        folderId = pr.body.folderId; folderLink = pr.body.folderLink;
        uploaded += pr.body.uploaded || 0; failed += pr.body.failed || 0;
      }
      if (uploaded && folderLink && !folderInput.value) {
        folderInput.value = folderLink;
        onFolderInput(slug, folderLink);
        got.push(uploaded + ' photos');
      }
      hint.textContent = got.length
        ? 'Imported: ' + got.join(', ') + (failed ? ' (' + failed + ' photos failed)' : '') + '. Review, add pricing, then Create.'
        : 'Nothing new to fill in.';
    } else {
      const note = (photos.length && !r.body?.photosImportable) ? ' Found ' + photos.length + ' photos but Drive import is not configured.' : '';
      hint.textContent = (got.length ? 'Imported: ' + got.join(', ') + '.' : 'Nothing new to fill in.') + note;
    }

function parseRanges(text) {
  const out = [];
  text.split('\n').forEach(line => {
    const m = line.match(/(\d{4}-\d{2}-\d{2})\s*(?:to|->|–|—|→|-)?\s*(\d{4}-\d{2}-\d{2})/);
    if (m) out.push({ from: m[1], to: m[2] });
  });
  return out;
}

// ── MANUAL PHOTO SORT ──
// Drag a thumb onto another to drop it in that position. The gallery, the
// share pages and Maya's cards all read the saved order. Hidden photos are
// untouched — reordering never un-hides anything.
let photoDragId = null;
function photoDragStart(ev, slug) {
  const wrap = ev.currentTarget;
  photoDragId = wrap.dataset.id;
  wrap.classList.add('dragging');
  ev.dataTransfer.effectAllowed = 'move';
  // Firefox needs data set for a drag to start at all.
  try { ev.dataTransfer.setData('text/plain', photoDragId); } catch (_) {}
}
function photoDragOver(ev) {
  if (!photoDragId) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  const wrap = ev.currentTarget;
  if (wrap.dataset.id !== photoDragId) wrap.classList.add('drop-target');
}
function photoDragEnd(ev) {
  photoDragId = null;
  const grid = ev.currentTarget.parentElement;
  if (grid) grid.querySelectorAll('.drive-thumb-wrap').forEach(w => w.classList.remove('dragging', 'drop-target'));
}
function photoDrop(ev, slug, folderId) {
  ev.preventDefault();
  const target = ev.currentTarget;
  target.classList.remove('drop-target');
  const grid = target.parentElement;
  if (!photoDragId || !grid) return;
  const moving = grid.querySelector(`.drive-thumb-wrap[data-id="${photoDragId}"]`);
  if (!moving || moving === target) return;
  // Dropping on a thumb that sits later in the list puts the dragged photo
  // after it; earlier, before it — which is what a drag visually implies.
  const wraps = [...grid.querySelectorAll('.drive-thumb-wrap')];
  const from = wraps.indexOf(moving), to = wraps.indexOf(target);
  target.insertAdjacentElement(from < to ? 'afterend' : 'beforebegin', moving);
  grid.querySelectorAll('.drive-thumb-wrap').forEach((w, i) => {
    const n = w.querySelector('.drive-pos'); if (n) n.textContent = i + 1;
  });
  savePhotoOrder(slug, folderId);
}

}

// ── ADD PHOTOS ──
// Drop files on the zone (or click to pick) and they upload into this listing's
// Drive folder. Downscaled in the browser first: the serverless body cap is
// ~4.5MB and base64 adds a third, so a raw phone photo would bounce. One
// request per photo, sequential, so progress is honest and one failure doesn't
// take the batch with it.
function downscaleForUpload(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.86).split(',')[1]);
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    const fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = () => reject(new Error('Could not read that file'));
    fr.readAsDataURL(file);
  });
}

async function uploadPhotos(slug, fileList, ev) {
  if (ev) ev.preventDefault();
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type));
  if (!files.length) { showToast('Drop image files (JPG, PNG, WEBP)'); return; }
  const folderId = extractFolderId((document.getElementById(slug + '-folder-url') || {}).value || '');
  if (!folderId) { showToast('Add a Drive folder link first'); return; }
  const zone = document.getElementById(slug + '-photo-drop');
  const label = document.getElementById(slug + '-photo-drop-text');
  const input = document.getElementById(slug + '-photo-input');
  zone.classList.add('busy');
  let done = 0; const failed = [];
  for (const f of files) {
    label.textContent = `Uploading ${done + 1} of ${files.length}…`;
    try {
      const data = await downscaleForUpload(f, 2400);
      const r = await fetch('/api/listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminPw },
        body: JSON.stringify({ action: 'upload-photo', folder: folderId, name: f.name, mime: 'image/jpeg', data }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Upload failed');
      done++;
    } catch (e) {
      failed.push(f.name + (e.message ? ' — ' + e.message : ''));
    }
  }
  zone.classList.remove('busy');
  if (input) input.value = '';
  label.textContent = "Drag photos here, or click to choose — they upload straight into this listing's Drive folder";
  if (done) showToast(`${done} photo${done === 1 ? '' : 's'} added to the folder`, 'success');
  if (failed.length) showToast(`${failed.length} failed: ${failed[0]}`);
  // Drive needs a beat before the new files list; then refresh the grid.
  if (done) setTimeout(() => loadDrivePreview(slug, folderId), 1200);
}

// ── AI PHOTO SORT ──
// The server scores ~20 photos per request (serverless time limits), so we
// keep calling until it reports done, showing progress along the way.
async function aiSortPhotos(slug) {
  const btn = document.getElementById(slug + '-ai-sort-btn');
  const status = document.getElementById(slug + '-ai-sort-status');
  const folderId = extractFolderId((document.getElementById(slug + '-folder-url') || {}).value || '');
  if (!folderId) { showToast('Add a Drive folder link first'); return; }
  btn.disabled = true;
  status.textContent = 'Looking at the photos…';
  try {
    for (let i = 0; i < 40; i++) {
      const r = await fetch('/api/listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminPw },
        body: JSON.stringify({ action: 'rank', folder: folderId }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Sorting failed');
      if (d.status === 'up_to_date') {
        status.textContent = 'Already sorted ✓ (re-runs automatically when photos change)';
        showToast('Photos are already AI-sorted', 'success');
        return;
      }
      if (d.status === 'empty') { status.textContent = 'No photos in this folder'; return; }
      if (d.status === 'done') {
        const bits = [];
        if (d.removed) bits.push(`${d.removed} duplicate/similar hidden`);
        if (d.junk) bits.push(`${d.junk} weak shot${d.junk === 1 ? '' : 's'} moved to the end`);
        status.textContent = `Sorted ${d.total} photos ✓${bits.length ? ' · ' + bits.join(', ') : ''}`;
        showToast('Photos sorted. Galleries update within the hour', 'success');
        loadDrivePreview(slug, folderId);
        return;
      }
      if (d.status === 'deduping') {
        status.textContent = `Checking for duplicates… ${d.deduped} of ${d.groups} groups${d.removed ? ` (${d.removed} hidden so far)` : ''}`;
      } else {
        status.textContent = `Scoring photos… ${d.scored} of ${d.total}`;
      }
    }
    throw new Error('Took too long. Click again to continue');
  } catch (e) {
    status.textContent = e.message;
    showToast(e.message);
  } finally {
    btn.disabled = false;
  }
}

function pickCover(slug, id, el) {

// ── COVER FOCAL-POINT PICKER ──
// The card hero crops the cover to 3:2 with object-fit:cover. The focal
// point (object-position, stored as "X% Y%") decides which part survives
// the crop. The preview box mirrors that exact crop so dragging here = the
// live card framing.
let coverDrag = null;
function renderCoverFocus(slug) {
  const id = (document.getElementById(slug + '-coverPhotoId') || {}).value || '';
  const img = document.getElementById(slug + '-cover-focus-img');
  const empty = document.getElementById(slug + '-cover-empty');
  const dot = document.getElementById(slug + '-cover-dot');
  if (!img) return;
  if (id) {
    img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w800';
    img.style.display = ''; if (empty) empty.style.display = 'none'; if (dot) dot.style.display = '';
    applyCoverFocus(slug);
  } else {
    img.style.display = 'none'; if (empty) empty.style.display = 'flex'; if (dot) dot.style.display = 'none';
  }
}
function applyCoverFocus(slug) {
  const pos = (document.getElementById(slug + '-coverPosition') || {}).value || '50% 50%';
  const img = document.getElementById(slug + '-cover-focus-img');
  const dot = document.getElementById(slug + '-cover-dot');
  if (img) img.style.objectPosition = pos;
  if (dot) { const [x, y] = pos.split(' '); dot.style.left = x; dot.style.top = y; }
}
function setCoverFocusFromEvent(slug, e) {
  const box = document.getElementById(slug + '-cover-focus');
  const r = box.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, Math.round(((e.clientX - r.left) / r.width) * 100)));
  const y = Math.max(0, Math.min(100, Math.round(((e.clientY - r.top) / r.height) * 100)));
  document.getElementById(slug + '-coverPosition').value = x + '% ' + y + '%';
  applyCoverFocus(slug);
}
function startCoverDrag(slug, e) {
  if (!((document.getElementById(slug + '-coverPhotoId') || {}).value)) return;
  coverDrag = slug; e.preventDefault();
  setCoverFocusFromEvent(slug, e);
}
function resetCoverFocus(slug) {
  document.getElementById(slug + '-coverPosition').value = '50% 50%';
  applyCoverFocus(slug);
}
document.addEventListener('pointermove', e => { if (coverDrag) setCoverFocusFromEvent(coverDrag, e); });
document.addEventListener('pointerup', () => { coverDrag = null; });

}
async function releaseOwner(slug) {
  if (!confirm('Unassign this owner? The listing goes back to unclaimed and their invite will work again.')) return;
  try {
    const r = await fetch(`/api/statements?action=admin-release&slug=${encodeURIComponent(slug)}`, {
      headers: { Authorization: 'Bearer ' + adminPw },
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    showToast('Owner unassigned', 'success');
    loadListings();
  } catch (e) { showToast(e.message, 'error'); }
}

async function assignOwner(slug) {
  const ownerEmail = document.getElementById(slug + '-ownerEmail').value.trim();
  try {
    const r = await fetch('/api/listings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminPw },
      body: JSON.stringify({ action: 'assign-owner', slug, ownerEmail }),
    });
    if (r.status === 401) { showGate('Session expired. Please log in again.'); return; }
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || 'HTTP ' + r.status);
    }
    showToast(ownerEmail ? `Owner set: ${ownerEmail}` : 'Owner cleared', 'success');
  } catch (e) {
    showToast('Assign failed: ' + e.message, 'error');
  }
}

async function saveListing(slug) {
  const btn = document.getElementById('save-' + slug);
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const folderUrl = document.getElementById(slug + '-folder-url').value;
  const folderId = extractFolderId(folderUrl) || folderUrl.trim();

  const data = {
    folder: folderId,
    monthly: document.getElementById(slug + '-monthly').value,
    yearly: document.getElementById(slug + '-yearly').value,
    yearly2: document.getElementById(slug + '-yearly2').value,
    badge: document.getElementById(slug + '-badge').value,
    overview: document.getElementById(slug + '-overview').value,
    features: lines(document.getElementById(slug + '-features').value),
    inclusions: lines(document.getElementById(slug + '-inclusions').value),
    yearlyInclusions: lines(document.getElementById(slug + '-yearlyInclusions').value),
    locationHighlights: lines(document.getElementById(slug + '-locationHighlights').value),
    waContactName: document.getElementById(slug + '-waContactName').value,
    waNumber: document.getElementById(slug + '-waNumber').value,
    reportContactName: document.getElementById(slug + '-reportContactName').value,
    reportWaNumber: document.getElementById(slug + '-reportWaNumber').value,
    unitType: document.getElementById(slug + '-unitType').value,
    tag: document.getElementById(slug + '-tag').value,
    coverPhotoId: document.getElementById(slug + '-coverPhotoId').value,
    coverPosition: document.getElementById(slug + '-coverPosition').value,
    deposit: document.getElementById(slug + '-deposit').value,
    electricity: document.getElementById(slug + '-electricity').value,
    wifi: document.getElementById(slug + '-wifi').value,
    pool: document.getElementById(slug + '-pool').value,
    minStay: document.getElementById(slug + '-minStay').value,
    petFriendly: document.getElementById(slug + '-petfriendly').checked,
  };

  try {
    const r = await fetch('/api/listings', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + adminPw,
      },
      body: JSON.stringify({ slug, data }),
    });
    if (r.status === 401) {
      showGate('Session expired. Please log in again.');
      return;
    }
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || 'HTTP ' + r.status);
    }
    showToast('Saved ' + slug, 'success');
  } catch(e) {
    showToast('Save failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

function lines(str) {
  return str.split('\n').map(s => s.trim()).filter(Boolean);
}

/* esc() comes from /shared.js */

// Embedded pages (analytics dashboard, campaign center) deep-link between
// tabs via postMessage — e.g. the dashboard's campaign summary card opens
// the Campaigns tab without leaving /admin.
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && typeof e.data.tab === 'string') showTab(e.data.tab);
});

// Boot
const saved = sessionStorage.getItem('admin_pw');
if (saved) {
  adminPw = saved;
  loadListings();
}
</script>
