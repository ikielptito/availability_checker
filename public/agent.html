<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samba Rentals</title>
<!-- OG tags are injected server-side by api/listing-page.js for /a and /s. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F4F1ED">
<link rel="stylesheet" href="/brand.css">
<style>
/* Core tokens come from brand.css aliases; only page-specific extras live here. */
:root{--green:var(--sb-success-fg);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Satoshi',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:rgba(244,241,237,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px}
.brand-mark{display:flex;align-items:center;text-decoration:none}
.brand-mark img{height:64px}
.spacer{flex:1}
.wrap{max-width:1080px;margin:0 auto;padding:30px 24px 60px}
/* Agent header */
.agent-head{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:10px}
.agent-av{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Satoshi',-apple-system,sans-serif;font-size:1.6rem;overflow:hidden;flex-shrink:0}
.agent-av img{width:100%;height:100%;object-fit:cover}
.agent-name{font-family:'Satoshi',-apple-system,sans-serif;font-size:1.5rem;line-height:1.1}
.agent-agency{color:var(--muted);font-size:.9rem;margin-top:3px}
.agent-wa{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-size:.85rem;font-weight:500;white-space:nowrap}
.agent-wa:hover{opacity:.92}
.agent-sub{color:var(--muted);font-size:.9rem;margin:0 4px 22px}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px}
.vcard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(19,26,23,.12)}
.vhero{width:100%;aspect-ratio:3/2;background:var(--surface2);overflow:hidden;position:relative}
.vhero img{width:100%;height:100%;object-fit:cover;display:block}
.vhero-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--subtle)}
.vbody{padding:14px 16px 16px}
.vname{font-weight:600;font-size:1rem;color:var(--text)}
.vmeta{color:var(--muted);font-size:.82rem;margin-top:3px}
.vprice{margin-top:10px;font-size:.92rem}
.vprice b{font-size:1.05rem}
.vprice span{color:var(--muted)}
.vcta{margin-top:12px;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:.82rem;font-weight:500}
.state{text-align:center;padding:70px 24px;color:var(--muted)}
.state h2{font-family:'Satoshi',-apple-system,sans-serif;color:var(--text);font-size:1.3rem;margin-bottom:10px}
.foot{text-align:center;padding:30px 24px;color:var(--muted);font-size:.8rem}
.foot a{color:var(--accent);text-decoration:none}
@media(max-width:600px){.brand-mark img{height:50px}.agent-head{flex-wrap:wrap}.agent-wa{margin-left:0;width:100%;justify-content:center}}
</style>
</head>
<body>
<!-- Client-facing share page: Samba branding is intentionally NOT a link, and
     the app nav is omitted, so renters can't navigate into the agent portal and
     reach owners directly. The agent is the only contact path here. -->
<div class="topbar">
  <span class="brand-mark" aria-label="Samba"><img src="/logo-samba.png" alt="Samba"></span>
</div>

<div class="wrap">
  <div id="content"><div class="state">Loading…</div></div>
</div>

<div class="foot">Powered by Samba Rentals · Bali's villa rental network</div>

<script>
(function(){
  var path = location.pathname.split('/').filter(Boolean); // ['a','handle'] or ['s','shareId']
  var mode = path[0]==='s' ? 'share' : 'handle';
  var key = path[1] || '';
  var content = document.getElementById('content');

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtPrice(p){ if(!p) return ''; var m=String(p).match(/(\d+(?:\.\d+)?)\s*jt/i); if(m) return 'IDR '+m[1]+'M'; return /^\d/.test(p)?'IDR '+p:p; }
  function photoUrl(l){ return l.coverPhotoId ? 'https://lh3.googleusercontent.com/d/'+l.coverPhotoId+'=w800' : ''; }
  function initials(n){ return (n||'A').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

  if(!key){ renderError('This link looks incomplete.'); return; }

  Promise.all([
    fetch('/api/portal?action=agent-public&'+(mode==='share'?'share=':'handle=')+encodeURIComponent(key)).then(function(r){return r.ok?r.json():null;}),
    fetch('/api/listings').then(function(r){return r.json();}).catch(function(){return {listings:[]};})
  ]).then(function(res){
    var data=res[0];
    if(!data){ renderError('This profile isn’t available.'); return; }
    var bySlug={}; (res[1].listings||[]).forEach(function(l){ bySlug[l.slug]=l; });
    var villas=(data.slugs||[]).map(function(s){return bySlug[s];}).filter(Boolean);
    renderProfile(data.profile||{}, data.listName, villas);
  }).catch(function(){ renderError('Something went wrong loading this page.'); });

  function renderError(msg){
    document.title='Samba Rentals';
    content.innerHTML='<div class="state"><h2>'+esc(msg)+'</h2></div>';
  }

  function renderProfile(p, listName, villas){
    var name=esc(p.displayName||'Agent');
    document.title=(listName?esc(listName)+' — ':name+' — ')+'Samba Rentals';
    var wa=p.waNumber?('<a class="agent-wa" href="https://wa.me/'+encodeURIComponent(p.waNumber)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.9.9-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-5.6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7.9-.1.2-.3.2-.5.1-.7-.3-1.4-.6-2-1.5-.2-.3.2-.3.5-.9.1-.1 0-.3 0-.4 0-.1-.5-1.3-.7-1.7-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 4 3.4.6.3 1 .4 1.4.5.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.1-.4-.2z"/></svg> WhatsApp</a>'):'';
    var avatar=p.picture?'<img src="'+esc(p.picture)+'" alt="">':esc(initials(p.displayName));
    var head='<div class="agent-head">'
      +'<div class="agent-av">'+avatar+'</div>'
      +'<div><div class="agent-name">'+name+'</div>'+(p.agency?'<div class="agent-agency">'+esc(p.agency)+'</div>':'')+'</div>'
      +wa+'</div>';
    var sub='<p class="agent-sub">'+(listName?esc(listName)+' — ':'')+villas.length+' villa'+(villas.length===1?'':'s')+(mode==='share'?' hand-picked for you':' saved by '+name)+'</p>';
    if(!villas.length){ content.innerHTML=head+'<div class="state"><h2>No villas yet</h2><p>Check back soon.</p></div>'; return; }
    // Carry the agent handle onto each villa link so the listing page keeps this
    // agent as the only contact (never exposes the owner).
    var handle=p.handle||(mode==='handle'?key:'');
    var aParam=handle?('?a='+encodeURIComponent(handle)):'';
    var cards=villas.map(function(l){
      var ph=photoUrl(l);
      var hero=ph?'<div class="vhero"><img src="'+ph+'" alt="'+esc(l.name)+'" loading="lazy" onerror="this.style.display=\'none\'"></div>':'<div class="vhero"><div class="vhero-ph">Photo coming soon</div></div>';
      var price=l.monthly?'<div class="vprice"><b>'+fmtPrice(l.monthly)+'</b> <span>/ mo</span></div>':'';
      return '<a class="vcard" href="/l/'+encodeURIComponent(l.slug)+aParam+'">'
        +hero
        +'<div class="vbody"><div class="vname">'+esc(l.name)+'</div>'
        +(l.tag?'<div class="vmeta">'+esc(l.tag)+'</div>':'')
        +price
        +'<div class="vcta">View details →</div>'
        +'</div></a>';
    }).join('');
    content.innerHTML=head+sub+'<div class="grid">'+cards+'</div>';
  }
})();
</script>
  <script src="/i18n.js"></script>
</body>
</html>
