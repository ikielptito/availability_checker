<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Management · Samba Rentals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23E2572B'/><text x='50' y='72' font-size='60' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'>S</text></svg>">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/brand.css">
<style>
/* Owner Payouts — page-local styles only. Core colour/type tokens come from
   brand.css (do NOT redeclare). */
:root{
  --green:var(--sb-success-fg); --red:var(--sb-error-fg);
  --live-bg:var(--sb-success-bg);
  --paused-bg:#F1EDE4; --paused-fg:#6E756F;
  --amber-bg:#FCF3E3; --amber-fg:#8A5A0B;
  --red-bg:var(--sb-error-bg); --red-fg:var(--sb-error-fg);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font:var(--sb-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
@media(max-width:640px){input,textarea,select{font-size:16px !important;}}

#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
#login .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:min(360px,90vw);box-shadow:var(--sb-shadow-md);}
#login h1{font:var(--sb-h4);margin-bottom:6px;}
#login p{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
#login input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);margin-bottom:10px;}
#login button{width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
#login .err{color:var(--red);font-size:.75rem;min-height:16px;margin-top:8px;}

#app{display:none;min-height:100vh;}
.cmdbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:color-mix(in srgb,var(--bg) 86%, transparent);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  border-bottom:1px solid var(--sb-hairline);}
.cmdbar .word{font:900 17px/1 var(--sb-font-display);letter-spacing:-.01em;white-space:nowrap;}
.cmdbar .word small{font:600 10px/1 var(--sb-font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-top:3px;}
body.embed .cmdbar .word{display:none;}
body:not(.view-payouts) #outbanner,body:not(.view-payouts) #syncbtn{display:none;}
.outbanner{display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1.35 var(--sb-font-ui);padding:7px 13px;border-radius:999px;background:var(--red-bg);color:var(--red-fg);border:1px solid transparent;font-family:var(--sb-font-ui);}
.outbanner.tappable{cursor:pointer;}
.outbanner.tappable:hover{border-color:var(--red-fg);}
.outbanner.on{background:var(--red-fg);color:#fff;}
.fltclear{background:none;border:none;color:var(--accent);font:600 12.5px/1 var(--sb-font-ui);cursor:pointer;padding:6px 2px;}
.fltclear:hover{text-decoration:underline;}
.outbanner.clear{background:var(--live-bg);color:var(--green);}
.btn-sync{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 15px;font:600 13px/1 var(--sb-font-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--sb-shadow-accent);}
.btn-sync:hover{background:var(--sb-terracotta-600);}
.btn-sync[disabled]{opacity:.55;cursor:wait;}

.shell{display:flex;align-items:flex-start;max-width:1240px;margin:0 auto;}
.rail{width:184px;flex:none;position:sticky;top:64px;padding:18px 10px 18px 18px;display:flex;flex-direction:column;gap:2px;}
.rail a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font:500 13.5px/1 var(--sb-font-ui);}
.railbadge{margin-left:auto;background:var(--sb-terracotta-600,#C05621);color:#fff;font:700 10px/1 var(--sb-font-ui);padding:3px 7px;border-radius:999px;}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.mhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.mtitle{font:600 15px/1.3 var(--sb-font-ui);color:var(--text);}
.mwhere{font:500 12px/1.4 var(--sb-font-ui);color:var(--muted);margin-top:3px;}
.mpill{font:700 10px/1 var(--sb-font-ui);letter-spacing:.04em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap;}
.mpill.new{background:var(--amber-bg);color:var(--amber-fg);}
.mpill.wait{background:var(--sb-terracotta-050,#FDF1EC);color:var(--sb-terracotta-700,#9C4221);}
.mpill.ok{background:#e2ede0;color:var(--sb-success-fg,#3f6d43);}
.mpill.done{background:var(--surface2);color:var(--muted);}
.mpill.no{background:var(--red-bg);color:var(--red-fg);}
.mpill.urgent{background:#FCF3E3;color:#8A5A0B;}
.mshots{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;}
.mshots img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--border);cursor:pointer;display:block;}
.mshot{position:relative;display:inline-block;}
.mshot-x{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;line-height:1;cursor:pointer;padding:0;}
.mshot-x:hover{background:var(--red-bg);color:var(--red-fg);border-color:var(--red-fg);}
.mrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.mrow input,.mrow select{padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:.82rem;}
.mmeta{font:500 11.5px/1.6 var(--sb-font-ui);color:var(--muted);margin-top:9px;}
.mdesc{font:400 13px/1.6 var(--sb-font-ui);color:var(--text-2);margin-top:9px;}
.rail a:hover{background:var(--surface2);color:var(--text);}
.rail a.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--sb-shadow-xs);border:1px solid var(--sb-hairline);}
.rail svg.ico{width:17px;height:17px;flex:none;opacity:.85;}
.rail a.on svg.ico{opacity:1;}
.rail .ico{width:16px;text-align:center;}
.content{flex:1;min-width:0;padding:18px 18px 80px;}
@media(max-width:900px){
  .shell{flex-direction:column;}
  .rail{position:static;width:100%;flex-direction:row;overflow-x:auto;padding:10px 14px 2px;gap:4px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .rail a{white-space:nowrap;}
  .cmdbar{gap:10px;padding:10px 12px;flex-wrap:wrap;}
}

.loading-state{display:flex;align-items:center;justify-content:center;gap:10px;padding:44px 0;color:var(--muted);font-size:.85rem;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;color:var(--muted);padding:34px 12px;font-size:.85rem;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--sb-green);color:var(--sb-on-green);
  padding:11px 20px;border-radius:11px;font:500 13px/1.3 var(--sb-font-ui);opacity:0;transition:all .25s var(--sb-ease);z-index:120;max-width:88vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red-fg);color:#fff;}
.toast.success{background:var(--sb-success-fg);color:#fff;}
.crumb{font:500 12px/1 var(--sb-font-ui);color:var(--muted);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer;}
.banner{border-radius:12px;padding:11px 14px;font-size:.8rem;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start;line-height:1.45;}
.banner.amber{background:var(--amber-bg);color:var(--amber-fg);}
.banner.red{background:var(--red-bg);color:var(--red-fg);}
.banner.calm{background:var(--surface2,#f1efe9);color:var(--text-2,#555);border:1px solid var(--border,#e4e0d6);}

.pill{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--sb-font-ui);letter-spacing:.05em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none;}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.draft{background:var(--surface2);color:var(--muted);}
.pill.review{background:var(--amber-bg);color:var(--amber-fg);}
.pill.outstanding{background:var(--red-bg);color:var(--red-fg);}
.pill.paid{background:var(--live-bg);color:var(--green);}
.pill.changed{background:var(--amber-bg);color:var(--amber-fg);}
.pill.void{background:var(--paused-bg);color:var(--paused-fg);}

.periodhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;}
.periodhead h2{font:700 15px/1 var(--sb-font-display);letter-spacing:-.01em;}
.strow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:box-shadow var(--sb-t),transform var(--sb-t);}
.strow:hover{box-shadow:var(--sb-shadow-md);transform:translateY(-1px);}
.strow .nm{font:700 14px/1.3 var(--sb-font-display);letter-spacing:-.01em;flex:1;min-width:0;}
.strow .nm small{display:block;font:500 11px/1.4 var(--sb-font-ui);color:var(--muted);margin-top:2px;}
.strow .amt{font:700 15px/1 var(--sb-font-display);font-variant-numeric:tabular-nums;white-space:nowrap;}
.strow .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
select.flt{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:500 12.5px/1 var(--sb-font-ui);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:17px 18px;margin-bottom:14px;}
.card h3{font:700 14px/1 var(--sb-font-display);margin-bottom:12px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.totgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:4px;}
.tot{background:var(--surface2);border-radius:11px;padding:11px 13px;}
.tot .lab{font:600 10px/1 var(--sb-font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tot .val{font:700 17px/1.2 var(--sb-font-display);margin-top:6px;font-variant-numeric:tabular-nums;}
.tot.big{background:var(--sb-terracotta-050);}
.tot.big .val{color:var(--sb-terracotta-700);}
.rc{display:flex;align-items:baseline;gap:8px;font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--sb-hairline);}
.rc:last-child{border-bottom:none;}
.rc .ok{color:var(--green);font-weight:700;}
.rc .bad{color:var(--red-fg);font-weight:700;}
.rc .nums{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

table.lines{width:100%;border-collapse:collapse;font-size:.78rem;}
table.lines th{font:600 10px/1 var(--sb-font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);}
table.lines td{padding:5px 8px;border-bottom:1px solid var(--sb-hairline);vertical-align:middle;}
table.lines td.num,table.lines th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
table.lines tr.totrow td{font-weight:700;border-top:2px solid var(--border);background:var(--surface2);}
table.lines input{width:100%;min-width:60px;padding:5px 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);font:inherit;}
table.lines input:hover{border-color:var(--border);}
table.lines input:focus{border-color:var(--accent);background:var(--surface);outline:none;}
table.lines input.num{text-align:right;font-variant-numeric:tabular-nums;}
table.lines .rowflag{font-size:.62rem;color:var(--amber-fg);background:var(--amber-bg);border-radius:6px;padding:2px 6px;margin-left:4px;white-space:nowrap;}
table.lines .del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:3px 6px;border-radius:6px;}
table.lines .del:hover{background:var(--red-bg);color:var(--red-fg);}
.tblwrap{overflow-x:auto;}
.addrow{margin-top:9px;}
.btn{border:none;border-radius:10px;padding:9px 15px;font:600 12.5px/1 var(--sb-font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.btn.primary{background:var(--accent);color:#fff;box-shadow:var(--sb-shadow-accent);}
.btn.primary:hover{background:var(--sb-terracotta-600);}
.btn.ghost{background:var(--surface2);color:var(--text);}
.btn.ghost:hover{background:var(--border);}
.btn.danger{background:var(--red-bg);color:var(--red-fg);}
.btn.green{background:var(--sb-success-fg);color:#fff;}
.btn[disabled]{opacity:.55;cursor:wait;}
.actionsrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.proofimg{max-width:280px;border-radius:11px;border:1px solid var(--border);display:block;margin-top:10px;}
.hx{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;}
.hx .cell{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.72rem;color:var(--muted);}
.hx .cell b{display:block;font:700 15px/1.2 var(--sb-font-display);color:var(--text);margin-bottom:3px;}

.grouprow{display:grid;grid-template-columns:1.3fr 1fr 1.4fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--sb-hairline);font-size:.8rem;}
.grouprow:last-child{border-bottom:none;}
.grouprow input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:500 12.5px/1.3 var(--sb-font-ui);}
.grouprow .key{font:700 12.5px/1.3 var(--sb-font-display);}
.grouprow .key small{display:block;font:500 10.5px/1.4 var(--sb-font-ui);color:var(--muted);}
.grouprow label{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--sb-font-ui);color:var(--muted);white-space:nowrap;cursor:pointer;}
@media(max-width:800px){.grouprow{grid-template-columns:1fr 1fr;} }

.modal-back{position:fixed;inset:0;background:rgba(28,25,23,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:18px;}
.modal-back.show{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:min(440px,94vw);box-shadow:var(--sb-shadow-lg);}
.modal h3{font:700 16px/1.2 var(--sb-font-display);margin-bottom:10px;}
.modal p{font-size:.82rem;color:var(--text-2);line-height:1.55;margin-bottom:14px;}
.modal .row{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;}
.modal label.chk{display:flex;align-items:center;gap:8px;font-size:.8rem;margin:10px 0;}

/* Team — people as cards, because the person is the unit of interest and a
   row per villa was fourteen lines to say five things. */
.grouphead{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--sb-font-ui);letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}
.grouphead span{background:var(--surface2);border-radius:999px;padding:3px 8px;letter-spacing:0;font-size:10px;}
.grouphead:first-of-type{margin-top:4px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:9px;
  transition:box-shadow var(--sb-t),transform var(--sb-t);}
.pcard:hover{box-shadow:var(--sb-shadow-md);transform:translateY(-1px);}
.pcard.off{opacity:.55;}
.pcard .ph{display:flex;align-items:flex-start;gap:8px;}
.pcard .pn{flex:1;min-width:0;font:700 14px/1.25 var(--sb-font-display);letter-spacing:-.01em;}
.pcard .pn small{display:block;font:500 11px/1.5 var(--sb-font-ui);color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;}
.pcard .pr,.pcard .pv{display:flex;flex-wrap:wrap;gap:4px;}
.pcard .pnote{font:500 11.5px/1.5 var(--sb-font-ui);color:var(--muted);}
.pcard .pa{display:flex;gap:6px;margin-top:auto;padding-top:4px;}
.pcard .pa .btn{padding:6px 11px;font-size:11.5px;}
.vtag{display:inline-flex;align-items:baseline;gap:5px;font:500 11px/1.4 var(--sb-font-ui);color:var(--text-2);
  background:var(--surface2);border-radius:7px;padding:4px 8px;}
.vtag b{font:700 11px/1.4 var(--sb-font-ui);color:var(--text);letter-spacing:.04em;}
.vtag.all{background:var(--live-bg);color:var(--green);}
.pload{border-top:1px solid var(--sb-hairline);padding-top:10px;}
.pload .lab{font:500 11px/1 var(--sb-font-ui);color:var(--muted);margin-bottom:7px;}
.pload .lab b{color:var(--text);font-weight:700;}
.pload .bars,.pload .dl{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.pload .bars{align-items:end;height:26px;}
.pload .bars i{border-radius:2px 2px 0 0;background:var(--accent);display:block;width:100%;}
.pload .bars i.nil{background:var(--border);height:2px;}
.pload .bars i.hot{background:var(--sb-terracotta-700,#9C3A16);}
.pload .dl{margin-top:5px;}
.pload .dl span{font:600 8.5px/1 var(--sb-font-ui);color:var(--muted);text-align:center;letter-spacing:.04em;}
.tag{display:inline-block;font:600 10.5px/1 var(--sb-font-ui);padding:4px 8px;border-radius:7px;background:var(--surface2);color:var(--text-2);margin:0 4px 4px 0;white-space:nowrap;}
.tag.role{background:var(--sb-terracotta-050);color:var(--sb-terracotta-700);}
.tag.job{background:var(--amber-bg);color:var(--amber-fg);}
.tag.all{background:var(--live-bg);color:var(--green);}
.stfnone{font-size:.74rem;color:var(--muted);}
.stfacts{display:flex;gap:6px;justify-content:flex-end;}
.stfacts .btn{padding:7px 11px;font-size:11.5px;}
@media(max-width:860px){.stfrow{grid-template-columns:1fr;gap:6px;}.stfacts{justify-content:flex-start;}}
.fld{margin-bottom:12px;}
.fld label{display:block;font:600 10px/1 var(--sb-font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.fld input[type=text],.fld select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:500 13px/1.3 var(--sb-font-ui);}
.fld .hint{font:500 11px/1.5 var(--sb-font-ui);color:var(--muted);margin-top:5px;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opts label{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--sb-font-ui);color:var(--text-2);
  background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer;text-transform:none;letter-spacing:0;margin:0;}
.opts label:has(input:checked){background:var(--sb-terracotta-050);border-color:var(--sb-terracotta-200,#f0cdbd);color:var(--sb-terracotta-700);font-weight:600;}
.opts input{accent-color:var(--accent);}
.modal.wide{width:min(560px,94vw);max-height:88vh;overflow-y:auto;}
.carewrap{margin:4px 0 8px;}
.careline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--sb-hairline);}
.careline:last-child{border-bottom:none;}
.careline .cn{flex:1;min-width:0;font:600 12.5px/1.3 var(--sb-font-ui);}
.careline .cd{display:flex;gap:3px;flex:none;}
.daybox{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;
  background:var(--surface2);color:var(--muted);font:600 10.5px/1 var(--sb-font-ui);cursor:pointer;user-select:none;}
.daybox input{position:absolute;opacity:0;width:0;height:0;}
.daybox:has(input:checked){background:var(--accent);color:#fff;}
@media(max-width:520px){.careline{flex-direction:column;align-items:flex-start;gap:5px;}}

/* Fourteen villas and seven trades make this form taller than the screen.
   Keep Save reachable without scrolling to the end of the villa list. */
.modal.wide .row{position:sticky;bottom:-24px;background:var(--surface);padding:14px 0;margin-top:6px;border-top:1px solid var(--sb-hairline);}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Owner Payouts</h1>
    <p>Enter the admin password to continue.</p>
    <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Open</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="cmdbar">
    <div class="word">SAMBA<small>Management</small></div>
    <button class="outbanner clear" id="outbanner" type="button" onclick="toggleOutstanding()">…</button>
    <button class="btn-sync" id="syncbtn" onclick="syncNow()">⟳ Sync from Era's sheets</button>
  </div>
  <div class="shell">
    <nav class="rail" id="rail">
      <a href="#/" data-view="list"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.8h7l3 3v11.4H5z"/><path d="M12 2.8v3h3"/><path d="M7.6 9.5h4.8M7.6 12.4h4.8"/></svg>Payouts</a>
      <a href="#/maintenance" data-view="maintenance"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.6a3.6 3.6 0 0 0-4.9 4.4l-4.2 4.2a1.4 1.4 0 0 0 0 2l1.9 1.9a1.4 1.4 0 0 0 2 0l4.2-4.2a3.6 3.6 0 0 0 4.4-4.9l-2.2 2.2-2-.6-.6-2z"/></svg>Maintenance<span class="railbadge" id="maint-badge" style="display:none"></span></a>
      <a href="#/earnings" data-view="earnings"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16.2h14"/><path d="M4.6 12.4l3.6-4 3 2.6 4.2-5.2"/></svg>Earnings</a>
      <a href="#/groups" data-view="groups"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 8.6L10 3.2l6.8 5.4"/><path d="M5 10v6.8h10V10"/><path d="M8.4 16.8v-4h3.2v4"/></svg>Properties</a>
      <a href="#/cleaning" data-view="cleaning"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.2" width="14" height="12.6" rx="2"/><path d="M3 8h14M7 2.8v2.8M13 2.8v2.8"/><path d="M7.4 11.6l1.5 1.5 3.2-3.2"/></svg>Cleaning<span class="railbadge" id="hk-badge" style="display:none"></span></a>
      <a href="#/staff" data-view="staff"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.6" cy="6.6" r="2.6"/><path d="M2.6 16.4c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><path d="M13.4 4.4a2.6 2.6 0 0 1 0 4.9"/><path d="M14.6 12.2c1.7.5 2.8 1.9 2.8 4.2"/></svg>Team</a>
    </nav>
    <main class="content" id="content">
      <div class="loading-state"><div class="spinner"></div>Loading statements…</div>
    </main>
  </div>
</div>

<div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="/shared.js"></script>
<script>
/* esc() comes from /shared.js */
'use strict';

// ── Auth (shared with /admin via same-origin sessionStorage) ─────────
const IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (IS_EMBED) document.body.classList.add('embed');
let adminPw = sessionStorage.getItem('admin_pw') || sessionStorage.getItem('dash_pwd') || '';

function showGate(msg) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  if (msg) document.getElementById('login-err').textContent = msg;
}
async function doLogin() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  adminPw = pw;
  try { await api('statement_groups', {}); } catch (e) {
    if (e.message === 'unauthorized') { document.getElementById('login-err').textContent = 'Wrong password.'; return; }
  }
  sessionStorage.setItem('admin_pw', pw);
  boot();
}

let toastTimer;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
}

// ── API ──────────────────────────────────────────────────────────────
async function api(action, payload) {
  const r = await fetch('/api/statements', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

const IDR = (n) => 'IDR ' + Math.round(Number(n) || 0).toLocaleString('en-US');
// Property names carry an en-dash in the catalog and in Era's sheets; the
// brand keeps dashes out of copy, so render them with a middle dot.
const pname = (n) => String(n == null ? '' : n).replace(/\s*[–—]\s*/g, ' · ');
const monthLabel = (period) => {
  const [y, m] = String(period).split('-').map(Number);
  return y && m ? new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }) : period;
};
const dstr = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '–';

// ── Router ───────────────────────────────────────────────────────────
let listData = null;      // statement_list payload
let groupsData = null;    // statement_groups payload
let groupFilter = '';
let outstandingOnly = false;   // banner acts as a filter for what's still owed

function go(h) { location.hash = h; }
function route() {
  const h = location.hash || '#/';
  const view = h.startsWith('#/statement/') ? 'detail'
    : h.startsWith('#/maintenance') ? 'maintenance'
    : h === '#/groups' ? 'groups' : h === '#/earnings' ? 'earnings' : h === '#/staff' ? 'staff'
    : h === '#/cleaning' ? 'cleaning' : 'list';
  document.querySelectorAll('.rail a').forEach(a => a.classList.toggle('on', a.dataset.view === (view === 'detail' ? 'list' : view)));
  // The outstanding banner and the sheet sync are payouts controls; on the
  // cleaning schedule or the team register they were noise about money.
  document.body.classList.toggle('view-payouts', view === 'list' || view === 'detail');
  if (view === 'list') renderList();
  else if (view === 'groups') renderGroups();
  else if (view === 'earnings') renderEarnings();
  else if (view === 'maintenance') renderMaintenance();
  else if (view === 'staff') renderStaff();
  else if (view === 'cleaning') renderCleaning();
  else renderDetail(parseInt(h.slice('#/statement/'.length), 10));
}
window.addEventListener('hashchange', route);

async function boot() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await refreshList();
  refreshMaint().catch(() => {});   // badge only — never blocks the first paint
  route();
}
async function refreshList() {
  try {
    [listData, groupsData] = await Promise.all([api('statement_list'), groupsData ? Promise.resolve(groupsData) : api('statement_groups')]);
    renderOutBanner();
  } catch (e) {
    if (e.message === 'unauthorized') return;
    document.getElementById('content').innerHTML =
      `<div class="banner red"><div>Could not reach the statements engine: ${esc(e.message)}. The CRM may be redeploying. <a style="cursor:pointer;text-decoration:underline" onclick="refreshList().then(route)">retry</a>.</div></div>`;
    throw e;
  }
}
function renderOutBanner() {
  const el = document.getElementById('outbanner');
  const o = listData?.outstanding || { count: 0, total: 0 };
  if (o.count > 0) {
    el.className = 'outbanner tappable' + (outstandingOnly ? ' on' : '');
    el.textContent = `Outstanding: ${o.count} payout${o.count > 1 ? 's' : ''} · ${IDR(o.total)}`;
    el.title = outstandingOnly ? 'Showing only what is still owed. Tap to show everything' : 'Show only what is still owed';
    el.disabled = false;
  } else {
    el.className = 'outbanner clear';
    el.textContent = 'All payouts settled';
    el.title = '';
    el.disabled = true;
    outstandingOnly = false;
  }
}
// The banner doubles as the filter: tap it to see exactly what it counts.
function toggleOutstanding() {
  if (!(listData?.outstanding?.count > 0)) return;
  outstandingOnly = !outstandingOnly;
  if (outstandingOnly) groupFilter = '';
  renderOutBanner();
  if (location.hash && location.hash !== '#/') go('#/'); else renderList();
}
// What the banner counts: still owed, and only where we track settlement.
const isOutstanding = (s) => ['published', 'partial'].includes(s.status)
  && tracksPayments(s) && balanceOf(s) > 0;

async function syncNow() {
  const btn = document.getElementById('syncbtn');
  btn.disabled = true; btn.textContent = '⟳ Syncing…';
  try {
    const out = await api('statement_sync', {});
    const c = (out.groups || []).reduce((a, g) => ({ created: a.created + (g.created || 0), updated: a.updated + (g.updated || 0), disc: a.disc + (g.discrepancies || 0), kept: a.kept + (g.kept_edits || 0) }), { created: 0, updated: 0, disc: 0, kept: 0 });
    const errs = (out.groups || []).filter(g => g.error);
    showToast(`Sync done: ${c.created} new, ${c.updated} updated${c.kept ? `, ${c.kept} kept your edits` : ''}${c.disc ? `, ${c.disc} changed after publish` : ''}${errs.length ? ` · ${errs.length} error(s)` : ''}`, errs.length || c.disc ? 'error' : 'success');
    await refreshList(); route();
  } catch (e) { if (e.message !== 'unauthorized') showToast('Sync failed: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = "⟳ Sync from Era's sheets";
}

// ── Statement list ───────────────────────────────────────────────────
const balanceOf = (s) => Math.max(0, (Number(s.payout_total) || 0) - (Number(s.paid_total) || 0));
// Some properties aren't settled month to month (LaneHAUS — privately
// arranged between Ikiel and Guy). Their statements record the numbers and
// say nothing about payment.
const tracksPayments = (s) => (s.statement_groups?.tracks_payments) !== false;
function pillsFor(s) {
  const pills = [];
  if (s.status === 'draft' && s.needs_review) pills.push('<span class="pill review"><span class="d"></span>Needs review</span>');
  else if (s.status === 'draft') pills.push('<span class="pill draft">Draft</span>');
  if (s.status !== 'draft' && !tracksPayments(s)) pills.push('<span class="pill draft">Internal · settled privately</span>');
  else if (s.status === 'published' && Number(s.payout_total) < 0) pills.push('<span class="pill void">Deficit · carries forward</span>');
  else if (s.status === 'published') pills.push('<span class="pill outstanding"><span class="d"></span>Unpaid</span>');
  if (tracksPayments(s) && s.status === 'partial') pills.push(`<span class="pill review"><span class="d"></span>Partial · ${IDR(balanceOf(s))} due</span>`);
  if (tracksPayments(s) && s.status === 'paid') pills.push('<span class="pill paid">Paid</span>');
  if (s.status === 'void') pills.push('<span class="pill void">Void</span>');
  if (s.source_changed) pills.push('<span class="pill changed">Sheet changed</span>');
  return pills.join('');
}
function renderList() {
  const c = document.getElementById('content');
  if (!listData) { c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>'; return; }
  const groups = groupsData?.groups || [];
  const rows = (listData.statements || [])
    .filter(s => !groupFilter || s.group_key === groupFilter)
    .filter(s => !outstandingOnly || isOutstanding(s));
  const byPeriod = {};
  for (const s of rows) (byPeriod[s.period] ||= []).push(s);
  const periods = Object.keys(byPeriod).sort().reverse();

  let html = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
    <select class="flt" onchange="groupFilter=this.value;renderList()">
      <option value="">All properties</option>
      ${groups.map(g => `<option value="${esc(g.key)}"${g.key === groupFilter ? ' selected' : ''}>${esc(pname(g.name))}</option>`).join('')}
    </select>
    ${outstandingOnly ? `<span class="pill outstanding"><span class="d"></span>Outstanding only</span>
      <button class="fltclear" onclick="toggleOutstanding()">Show all statements</button>` : ''}
  </div>`;
  if (!rows.length) {
    html += outstandingOnly
      ? `<div class="empty-state">Nothing outstanding for this filter. <button class="fltclear" onclick="toggleOutstanding()">Show all statements</button></div>`
      : `<div class="empty-state">No statements yet. Hit <b>Sync from Era's sheets</b> to import the monthly reports${groups.length ? '' : ' (set up properties first)'}.</div>`;
  }
  for (const p of periods) {
    html += `<div class="periodhead"><h2>${esc(monthLabel(p))}</h2></div>`;
    for (const s of byPeriod[p]) {
      html += `<div class="strow" onclick="go('#/statement/${s.id}')">
        <div class="nm">${esc(pname(s.statement_groups?.name || s.group_key))}
          <small>${s.status === 'paid' ? 'paid ' + dstr(s.paid_at) : s.status === 'partial' ? IDR(s.paid_total) + ' paid of ' + IDR(s.payout_total) : s.status === 'published' ? 'published ' + dstr(s.published_at) + (s.notified_at ? ' · owner notified' : ' · not announced yet') : 'parsed ' + dstr(s.parsed_at)}</small>
        </div>
        <div class="amt">${IDR(s.payout_total)}</div>
        <div class="pills">${pillsFor(s)}</div>
      </div>`;
    }
  }
  c.innerHTML = html;
}

// ── Statement detail ─────────────────────────────────────────────────
let det = null;   // {statement, lines, token, period_label}
async function renderDetail(id) {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading statement…</div>';
  try { det = await api('statement_detail', { id }); }
  catch (e) { if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red"><div>${esc(e.message)}</div></div>`; return; }
  drawDetail();
}
function drawDetail() {
  const c = document.getElementById('content');
  const s = det.statement, g = s.statement_groups || {};
  const amending = Array.isArray(s.revisions) && s.revisions.some(r => r && r.open);
  const editable = s.status === 'draft' || amending;
  const bookings = det.lines.filter(l => l.kind === 'booking');
  const expenses = det.lines.filter(l => l.kind === 'expense');
  const adjustments = det.lines.filter(l => l.kind === 'adjustment');
  const units = [...new Set(bookings.map(b => b.unit_name || ''))];
  const checks = s.reconciliation?.checks || [];
  const unparsed = s.reconciliation?.unparsed_rows || [];

  let html = `<div class="crumb"><a onclick="go('#/')">Payouts</a> ›
    ${esc(pname(g.name || s.group_key))} · ${esc(det.period_label)}</div>`;

  if (amending) html += `<div class="banner amber"><div><b>Amending this published statement.</b> The owner can still open it while you edit, so finish promptly: correct the lines below, then <b>Save amendment</b> (they'll see a note of what changed), or <b>Cancel</b> to restore everything exactly as it was.</div></div>`;

  if (s.source_changed) html += `<div class="banner amber"><div><b>Era's sheet changed</b> after ${s.status === 'draft' ? 'you edited this draft' : 'this statement was published'}.
    ${s.discrepancy ? esc(s.discrepancy.note || '') + (s.discrepancy.new_era_payout != null ? ` Sheet now says ${IDR(s.discrepancy.new_era_payout)}.` : '') : ''}
    ${s.status === 'draft' ? '<a style="cursor:pointer;text-decoration:underline" onclick="reparse()">Re-parse from sheet (discards your edits)</a>' : 'The published numbers are frozen. Add a corrected statement next month, or contact the owner.'}</div></div>`;

  // Totals
  const eraDelta = s.era_payout_total != null && Math.abs(s.era_payout_total - s.payout_total) > 1;
  // When the gap is exactly the carry-forward adjustment, nothing is wrong —
  // Era's sheet shows the month on its own; the system nets off earlier
  // deficit months Ikiel fronted. Say so calmly instead of crying wolf.
  const carryExplains = eraDelta && Number(s.adjustments_total)
    && Math.abs((Number(s.era_payout_total) || 0) + (Number(s.adjustments_total) || 0) - (Number(s.payout_total) || 0)) <= 1;
  html += `<div class="card"><h3>${esc(pname(g.name || s.group_key))} · ${esc(det.period_label)} ${pillsFor(s)}</h3>
    <div class="totgrid">
      <div class="tot"><div class="lab">Gross revenue</div><div class="val">${IDR(s.gross_total)}</div></div>
      <div class="tot"><div class="lab">Mgmt fee (yours)</div><div class="val">${IDR(s.commission_total)}</div></div>
      <div class="tot"><div class="lab">Nett to owner</div><div class="val">${IDR(s.nett_total)}</div></div>
      <div class="tot"><div class="lab">Expenses</div><div class="val">− ${IDR(s.expenses_total)}</div></div>
      ${Number(s.adjustments_total) ? `<div class="tot"><div class="lab">Adjustments</div><div class="val">${IDR(s.adjustments_total)}</div></div>` : ''}
      <div class="tot big"><div class="lab">Total payout</div><div class="val">${IDR(s.payout_total)}</div></div>
      ${s.status !== 'draft' && tracksPayments(s) ? `
      <div class="tot"><div class="lab">Paid to date</div><div class="val">${IDR(s.paid_total)}</div></div>
      <div class="tot" style="${balanceOf(s) > 0 ? 'background:var(--red-bg)' : ''}"><div class="lab">Balance due</div><div class="val" style="${balanceOf(s) > 0 ? 'color:var(--red-fg)' : ''}">${IDR(balanceOf(s))}</div></div>` : ''}
    </div>
    ${carryExplains ? `<div class="banner calm" style="margin:10px 0 0"><div>Era's sheet shows <b>${IDR(s.era_payout_total)}</b> for the month on its own. A carry-over of <b>${IDR(s.adjustments_total)}</b> from earlier deficit months (fronted by you) brings the actual payout to <b>${IDR(s.payout_total)}</b>. Nothing to fix: the sheet doesn't track carry-overs, this system does.</div></div>`
      : eraDelta ? `<div class="banner amber" style="margin:10px 0 0"><div>Era's sheet says <b>${IDR(s.era_payout_total)}</b>, but the parsed lines compute <b>${IDR(s.payout_total)}</b>. Fix the lines below or trust the computed number.</div></div>` : ''}
  </div>`;

  // Reconciliation
  if (checks.length || unparsed.length) {
    html += `<div class="card"><h3>Reconciliation</h3>` +
      checks.map(ch => `<div class="rc"><span class="${ch.ok ? 'ok' : 'bad'}">${ch.ok ? '✓' : '✗'}</span>
        <span>${esc(ch.name.replace(/_/g, ' '))}</span>
        <span class="nums">${ch.expected != null ? Number(ch.expected).toLocaleString() : '–'} vs ${ch.actual != null ? Number(ch.actual).toLocaleString() : '–'}</span></div>`).join('') +
      unparsed.map(u => `<div class="rc"><span class="bad">?</span><span>Row ${u.row} not understood: ${esc((u.cells || []).join(' | '))}</span></div>`).join('') +
      `</div>`;
  }

  // Booking tables per unit
  for (const u of units) {
    const rows = bookings.filter(b => (b.unit_name || '') === u);
    html += `<div class="card"><h3>Bookings${u ? ' · ' + esc(pname(u)) : ''}</h3><div class="tblwrap"><table class="lines">
      <tr><th>Guest</th><th>Dates</th><th>Platform</th><th class="num">Nights</th><th class="num">Amount</th><th class="num">Mgmt fee</th><th class="num">Nett</th>${editable ? '<th></th>' : ''}</tr>
      ${rows.map(l => lineRow(l, editable, ['guest_name', 'stay_dates', 'platform', 'nights', 'amount', 'commission', 'nett'])).join('')}
      <tr class="totrow"><td colspan="3">Total</td><td class="num">${rows.reduce((a, l) => a + (Number(l.nights) || 0), 0)}</td>
        <td class="num">${IDR(rows.reduce((a, l) => a + (Number(l.amount) || 0), 0))}</td>
        <td class="num">${IDR(rows.reduce((a, l) => a + (Number(l.commission) || 0), 0))}</td>
        <td class="num">${IDR(rows.reduce((a, l) => a + (Number(l.nett) || 0), 0))}</td>${editable ? '<td></td>' : ''}</tr>
    </table></div>
    ${editable ? `<div class="addrow"><button class="btn ghost" onclick="addLine('booking', ${JSON.stringify(u).replace(/"/g, '&quot;')})">+ Add booking</button></div>` : ''}</div>`;
  }
  if (!units.length && editable) {
    html += `<div class="card"><h3>Bookings</h3><div class="empty-state">No bookings parsed.</div>
      <div class="addrow"><button class="btn ghost" onclick="addLine('booking','')">+ Add booking</button></div></div>`;
  }

  // Expenses
  html += `<div class="card"><h3>Expenses</h3><div class="tblwrap"><table class="lines">
    <tr><th>Date</th><th>Description</th><th class="num">Amount</th>${editable ? '<th></th>' : ''}</tr>
    ${expenses.map(l => lineRow(l, editable, ['expense_date', 'description', 'amount'])).join('')}
    <tr class="totrow"><td colspan="2">Total expenses</td><td class="num">${IDR(expenses.reduce((a, l) => a + (Number(l.amount) || 0), 0))}</td>${editable ? '<td></td>' : ''}</tr>
  </table></div>
  ${editable ? `<div class="addrow"><button class="btn ghost" onclick="addLine('expense','')">+ Add expense</button></div>` : ''}</div>`;

  // Adjustments
  if (adjustments.length || editable) {
    html += `<div class="card"><h3>Adjustments <span style="font:500 11px/1 var(--sb-font-ui);color:var(--muted)">signed: positive increases the payout</span></h3>
      ${adjustments.length ? `<div class="tblwrap"><table class="lines">
        <tr><th>Description</th><th class="num">Amount</th>${editable ? '<th></th>' : ''}</tr>
        ${adjustments.map(l => lineRow(l, editable, ['description', 'amount'])).join('')}
      </table></div>` : '<div class="empty-state" style="padding:8px">None.</div>'}
      ${editable ? `<div class="addrow"><button class="btn ghost" onclick="addLine('adjustment','')">+ Add adjustment</button></div>` : ''}</div>`;
  }

  // Hostex snapshot (frozen at publish)
  const hx = s.hostex_snapshot;
  if (hx?.group) {
    html += `<div class="card"><h3>Hostex · ${esc(det.period_label)} <span style="font:500 11px/1 var(--sb-font-ui);color:var(--muted)">frozen at publish</span></h3>
      <div class="hx">
        <div class="cell"><b>${hx.group.occupancy_pct}%</b>occupancy</div>
        <div class="cell"><b>${hx.group.nights_sold}</b>nights sold</div>
        <div class="cell"><b>${hx.group.reservations}</b>reservations</div>
        ${hx.group.adr ? `<div class="cell"><b>${IDR(hx.group.adr)}</b>net ADR</div>` : ''}
        ${Object.entries(hx.group.channels || {}).map(([k, v]) => `<div class="cell"><b>${v}</b>${esc(k)} nights</div>`).join('')}
      </div></div>`;
  }

  // Payments ledger (published/partial/paid)
  const pays = det.payments || [];
  if (s.status !== 'draft' && tracksPayments(s)) {
    html += `<div class="card"><h3>Payments</h3>`;
    if (!pays.length) html += `<div class="empty-state" style="padding:8px">No payments recorded yet.</div>`;
    else html += `<div class="tblwrap"><table class="lines">
      <tr><th>Date</th><th class="num">Amount</th><th>Note</th><th>Proof</th><th></th><th></th></tr>
      ${pays.map(p => {
        const returned = p.status === 'returned';
        return `<tr${returned ? ' style="opacity:.6"' : ''}>
        <td style="white-space:nowrap">${dstr(p.paid_at)}</td>
        <td class="num"${returned ? ' style="text-decoration:line-through"' : ''}>${IDR(p.amount)}</td>
        <td>${esc(p.note || '–')}${returned ? ` <span class="rowflag">↩ returned by bank${p.return_note ? ': ' + esc(p.return_note) : ''}</span>` : ''}</td>
        <td>${p.proof_url ? `<a href="${esc(p.proof_url)}" target="_blank">view ↗</a>` : '–'}</td>
        <td>${returned
          ? `<button class="btn ghost" style="padding:5px 9px;font-size:.68rem" onclick="paymentReturned(${p.id}, true)">undo</button>`
          : `<button class="btn ghost" style="padding:5px 9px;font-size:.68rem" title="The bank bounced this transfer. Keep it in the ledger but restore the owed balance" onclick="paymentReturned(${p.id}, false)">↩ Returned</button>`}</td>
        <td><button class="del" title="Delete payment" onclick="deletePayment(${p.id})">✕</button></td>
      </tr>`; }).join('')}
      <tr class="totrow"><td>Paid to date</td><td class="num">${IDR(s.paid_total)}</td><td colspan="4">${balanceOf(s) > 0 ? 'Balance due ' + IDR(balanceOf(s)) : 'Settled in full'}</td></tr>
    </table></div>`;
    html += `</div>`;
  }

  // Payout account on file
  const acct = g.payout_account;
  if (s.status !== 'draft' && tracksPayments(s)) {
    html += `<div class="card"><h3>Payout account</h3>` + (acct && (acct.bank || acct.account_number)
      ? `<div style="font-size:.82rem;line-height:1.7">${esc(acct.bank || '')} · ${esc(acct.account_name || '')} · <b>${esc(acct.account_number || '')}</b>${acct.note ? `<br><span style="color:var(--muted)">${esc(acct.note)}</span>` : ''}<br><span style="font-size:.7rem;color:var(--muted)">entered by ${esc(acct.updated_by || 'admin')} · edit under Properties</span></div>`
      : `<div class="empty-state" style="padding:8px">None on file. The owner can add it in their portal, or you can under Properties.</div>`) + `</div>`;
  }

  // Amendment history — every closed revision, owner-visible note included.
  const closedRevs = (Array.isArray(s.revisions) ? s.revisions : []).filter(r => r && !r.open && r.at);
  if (closedRevs.length) {
    html += `<div class="card"><h3>Amendment history</h3>` + closedRevs.map(r =>
      `<div style="font-size:.8rem;line-height:1.6;padding:6px 0;border-bottom:1px dashed var(--border)"><b>${dstr(r.at)}</b> by ${esc(r.by || 'admin')} · ${esc(r.note || 'no note')}<br>
       <span style="color:var(--muted)">payout ${IDR(r.prev?.payout_total)} → ${IDR(r.new?.payout_total)}</span></div>`
    ).join('') + `</div>`;
  }

  // Actions
  html += `<div class="card"><h3>Actions</h3><div class="actionsrow">`;
  if (s.status === 'draft') {
    html += `<button class="btn primary" onclick="askPublish()">Publish statement</button>`;
    if (s.has_manual_edits) html += `<button class="btn ghost" onclick="reparse()">⟳ Re-parse from sheet</button>`;
  }
  if (amending) {
    html += `<button class="btn primary" onclick="amendSave()">Save amendment</button>`;
    html += `<button class="btn ghost" onclick="amendCancel()">Cancel amendment</button>`;
  }
  if ((s.status === 'published' || s.status === 'partial') && tracksPayments(s)) {
    html += `<button class="btn green" onclick="askRecordPayment()">+ Record payment</button>`;
    if (s.status === 'published' && !s.notified_at && !pays.length) html += `<button class="btn ghost" onclick="unpublish()">Unpublish</button>`;
  }
  if (['published', 'partial', 'paid'].includes(s.status) && !amending) {
    html += `<button class="btn ghost" onclick="amendStart()">Amend</button>`;
  }
  if (s.status !== 'draft') {
    html += `<a class="btn ghost" href="/st/${esc(det.token)}" target="_blank">Preview owner view ↗</a>`;
    html += `<a class="btn ghost" href="/api/statements?action=export&token=${esc(det.token)}">Excel</a>`;
  }
  html += `</div>`;
  if (s.status === 'published' || s.status === 'partial') {
    html += `<p style="font-size:.75rem;color:var(--muted);margin-top:10px">${s.notified_at ? 'Owner notified via Maya on ' + dstr(s.notified_at) + '.' : (g.notify ? 'Owner will be notified by Maya on the next daily pass (or arm/run the owner_statements campaign).' : 'Notifications are off for this property.')}</p>`;
  }
  html += `</div>`;

  c.innerHTML = html;
}
function lineRow(l, editable, fields) {
  const flags = (l.flags || []).filter(f => f !== 'manual');
  const cells = fields.map(f => {
    const num = ['nights', 'amount', 'commission', 'nett'].includes(f);
    const val = l[f] == null ? '' : l[f];
    if (!editable) return `<td class="${num ? 'num' : ''}">${num && val !== '' ? Number(val).toLocaleString() : esc(String(val))}${f === fields[0] && flags.length ? flags.map(x => `<span class="rowflag">${esc(x.replace(/_/g, ' '))}</span>`).join('') : ''}</td>`;
    return `<td class="${num ? 'num' : ''}"><input class="${num ? 'num' : ''}" value="${esc(String(val))}" onchange="patchLine(${l.id}, '${f}', this.value, ${num})">${f === fields[0] && flags.length ? flags.map(x => `<span class="rowflag">${esc(x.replace(/_/g, ' '))}</span>`).join('') : ''}</td>`;

// Downscale to ≤1600px JPEG so the upload stays well under the body cap.
function downscale(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      resolve({ base64: cv.toDataURL('image/jpeg', 0.88), type: 'image/jpeg' });
    };
    img.onerror = () => reject(new Error('Could not read image'));
    img.src = URL.createObjectURL(file);
  });
}
// ── Earnings: monthly management-commission income ───────────────────
// Commission comes from the statements themselves (Era's commission column),
// summed per month across groups that charge a management fee. Own units
// (charges_commission=false, e.g. LaneHAUS) are internal money and excluded
// from the total — shown separately for context.
async function renderEarnings() {
  const c = document.getElementById('content');
  if (!listData || !groupsData) { c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>'; return; }
  const groups = groupsData.groups || [];
  const chargeable = new Set(groups.filter(g => g.charges_commission !== false).map(g => g.key));
  const mlab = (p) => { const [y, m] = String(p).split('-').map(Number); return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }); };

  const months = {};   // period → {total, own, byGroup:{name:amt}}
  for (const s of (listData.statements || [])) {
    if (s.status === 'void') continue;
    const m = (months[s.period] ||= { total: 0, own: 0, byGroup: {} });
    const amt = Number(s.commission_total) || 0;
    if (chargeable.has(s.group_key)) {
      m.total += amt;
      m.byGroup[s.statement_groups?.name || s.group_key] = (m.byGroup[s.statement_groups?.name || s.group_key] || 0) + amt;
    } else {
      m.own += amt;
    }
  }
  const periods = Object.keys(months).sort().reverse();
  const ytd = periods.reduce((a, p) => a + months[p].total, 0);
  const best = periods.reduce((a, p) => months[p].total > (months[a]?.total ?? -1) ? p : a, periods[0]);
  const maxV = Math.max(...periods.map(p => months[p].total), 1);

  let html = `<div class="card"><h3>Management commission earnings</h3>
    <div class="totgrid">
      <div class="tot big"><div class="lab">2026 to date</div><div class="val">${IDR(ytd)}</div></div>
      <div class="tot"><div class="lab">Average / month</div><div class="val">${IDR(periods.length ? ytd / periods.length : 0)}</div></div>
      ${best ? `<div class="tot"><div class="lab">Best month</div><div class="val">${IDR(months[best].total)}</div><div style="font-size:.66rem;color:var(--muted);margin-top:3px">${esc(mlab(best))}</div></div>` : ''}
    </div>
    <p style="font-size:.72rem;color:var(--muted);margin-top:8px">From the commission column of every statement (drafts included: the fee is earned whether or not the statement is published yet). LaneHAUS is excluded: your own units, no management fee charged.</p>
  </div>`;

  html += `<div class="card"><h3>By month</h3><div class="tblwrap"><table class="lines">
    <tr><th>Month</th><th></th><th class="num">Commission</th><th>Breakdown</th></tr>
    ${periods.map(p => `<tr>
      <td style="white-space:nowrap;font-weight:600">${esc(mlab(p))}</td>
      <td style="width:34%;min-width:120px"><div style="height:9px;border-radius:5px;background:var(--surface2);overflow:hidden"><div style="height:100%;width:${Math.round(months[p].total / maxV * 100)}%;background:var(--accent);border-radius:5px"></div></div></td>
      <td class="num" style="font-weight:700">${IDR(months[p].total)}</td>
      <td style="font-size:.68rem;color:var(--muted)">${Object.entries(months[p].byGroup).sort((a, b) => b[1] - a[1]).map(([n, v]) => `${esc(pname(n).replace(/HAUS Canggu · |Tropicana Valley · /, ''))} ${Math.round(v / 1e6 * 10) / 10}M`).join(' · ') || '–'}${months[p].own ? ` <span style="color:var(--paused-fg)">(+ LaneHAUS internal ${Math.round(months[p].own / 1e6 * 10) / 10}M)</span>` : ''}</td>
    </tr>`).join('')}
    <tr class="totrow"><td>Total</td><td></td><td class="num">${IDR(ytd)}</td><td></td></tr>
  </table></div></div>`;

  c.innerHTML = html;
}

async function renderGroups() {
  const c = document.getElementById('content');

// Fetch with the admin bearer header, then hand the browser a blob download
// (a bare <a href> can't carry the Authorization header).
async function downloadGroupExcel(key) {
  try {
    const r = await fetch(`/api/statements?action=export-group&group=${encodeURIComponent(key)}`, {
      headers: { Authorization: 'Bearer ' + adminPw },
    });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || 'HTTP ' + r.status); }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Samba-Financials-${key}.xlsx`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { showToast('Export failed: ' + e.message, 'error'); }
}

// Owner-onboarding invite: one URL to WhatsApp the owner. They open it,
// sign in with any Google account, and the group's units claim themselves.
// Open the owner portal exactly as this owner will see it — read-only.

  try {

    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);

async function copyInviteLink(key) {

// Era's working surface: the review pile at the top (things Maya filed from
// her photos, waiting on a cost estimate), then everything in flight.
let maintData = null;

async function maintApi(action, payload) {
  const r = await fetch('/api/maintenance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

const MSTATUS = {
  new:              { cls: 'new',  label: 'Needs your review' },
  pending_approval: { cls: 'wait', label: 'Waiting on owner' },
  scheduled:        { cls: 'ok',   label: 'Scheduled' },
  approved:         { cls: 'ok',   label: 'Approved · do the work' },
  declined:         { cls: 'no',   label: 'Owner declined' },
  done:             { cls: 'done', label: 'Done' },
};

async function renderMaintenance() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading maintenance…</div>';
  try {
    // The team register feeds the "send this to" dropdown on approved work.
    // A failure there must not hide the tickets, so it is allowed to fail.
    await Promise.all([refreshMaint(), refreshStaff().catch(() => {})]);
  }
  catch (e) { if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red">${esc(e.message)}</div>`; return; }

  const items = maintData.items || [];
  const order = ['new', 'approved', 'scheduled', 'pending_approval', 'declined', 'done'];
  const sorted = [...items].sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || new Date(b.created_at) - new Date(a.created_at));

  let html = `<div class="crumb">Maintenance</div>`;
  html += `<div class="banner ${maintData.needsReview ? 'amber' : 'calm'}" style="margin-bottom:14px"><div>
    <b>${maintData.needsReview || 0}</b> waiting for your review ·
    <b>${maintData.awaitingOwner || 0}</b> with the owner ·
    <b>${maintData.openWork || 0}</b> approved and not yet done
    <div style="margin-top:5px;font-size:.76rem">Send Maya a photo on WhatsApp with the villa and what's wrong. It appears here automatically.</div>
  </div></div>`;

  if (!sorted.length) {
    html += `<div class="empty-state" style="padding:34px">Nothing logged yet. Send Maya a photo of an issue and it lands here.</div>`;
    c.innerHTML = html; return;
  }

  for (const it of sorted) {
    const st = MSTATUS[it.status] || { cls: 'done', label: it.status };
    const g = it.statement_groups || {};
    const where = it.unit_label ? `${pname(g.name || it.group_key)} · ${it.unit_label}` : pname(g.name || it.group_key);
    html += `<div class="mcard">
      <div class="mhead">
        <div style="flex:1;min-width:200px">
          <div class="mtitle">${esc(it.title)}</div>
          <div class="mwhere">${esc(where)} · reported ${esc(dstr(it.reported_at))}${it.reported_by_name ? ' by ' + esc(it.reported_by_name) : ''}</div>
        </div>
        ${it.urgency === 'urgent' ? '<span class="mpill urgent">Urgent</span>' : ''}
        <span class="mpill ${st.cls}">${esc(st.label)}</span>
      </div>
      ${it.description ? `<div class="mdesc">${esc(it.description)}</div>` : ''}
      <div class="mshots" id="shots-${it.id}"></div>
      <div class="mrow" style="margin-top:8px">
        <label class="btn ghost" style="cursor:pointer;font-size:.75rem">+ Add photo
          <input type="file" accept="image/*" style="display:none" onchange="maintAddPhoto(${it.id}, this)">
        </label>
      </div>`;

    if (it.status === 'new') {
      html += `<div class="mrow">
        <span style="font-size:.76rem;color:var(--muted)">Estimated cost</span>
        <input type="text" id="mcost-${it.id}" placeholder="e.g. 850000" value="${it.estimated_cost ?? ''}" style="width:130px">
        <select id="mmode-${it.id}">
          <option value="1">Ask the owner to approve</option>
          <option value="0">Routine: just tell them</option>
        </select>
        <button class="btn primary" onclick="maintPublish(${it.id})">Publish &amp; notify</button>
        <button class="btn ghost" onclick="maintDelete(${it.id})">Not an issue</button>
      </div>`;
    }
    if (it.status === 'approved' || it.status === 'scheduled') {
      html += dispatchRow(it);
      html += `<div class="mrow">
        <button class="btn green" onclick="maintComplete(${it.id})">Mark done</button>
        <span style="font-size:.76rem;color:var(--muted)">Next check-in ${it.next_followup_at ? esc(dstr(it.next_followup_at)) : '–'}${it.promised_date ? ` (you said ${esc(dstr(it.promised_date))})` : ''}</span>
      </div>`;
    }
    if (it.status === 'pending_approval') {
      html += `<div class="mrow">
        <a class="btn ghost" href="/m/${esc(it.token || '')}" target="_blank">Preview owner view ↗</a>
        <button class="btn ghost" onclick="maintApproveFor(${it.id})">Owner approved (by phone)</button>
      </div>`;
    }
    if (it.status === 'declined') {
      html += `<div class="mmeta">Declined ${esc(dstr(it.declined_at))}${it.decline_note ? ` · “${esc(it.decline_note)}”` : ''}</div>`;
    }
    if (it.status === 'done') {
      html += `<div class="mmeta">Completed ${esc(dstr(it.completed_at))}${it.actual_cost != null ? ` · ${IDR(it.actual_cost)}` : ''}${it.completion_note ? ` · ${esc(it.completion_note)}` : ''}</div>`;
    }
    const cost = it.actual_cost ?? it.estimated_cost;
    if (cost != null && it.status !== 'new') {
      html += `<div class="mmeta">${it.actual_cost != null ? 'Final' : 'Estimate'}: <b>${IDR(cost)}</b> · ${it.requires_approval ? 'owner approval required' : 'routine, no approval needed'}</div>`;
    }
    if ((it.thread || []).length) {
      const last = it.thread[it.thread.length - 1];
      html += `<div class="mmeta">${esc(last.who || 'Era')}: “${esc(last.text)}”</div>`;
    }
    html += `</div>`;
  }
  c.innerHTML = html;
  wireDispatchPickers(sorted);
  // Photos need signed URLs — fetch each item's detail lazily so the list
  // isn't blocked on signing every image.
  for (const it of sorted) {
    if (!(it.photos || []).length) continue;
    maintApi('maint_detail', { id: it.id }).then(d => {
      const box = document.getElementById('shots-' + it.id);
      if (box && d.item?.photo_urls?.length) {
        const paths = d.item.photos || [];
        box.innerHTML = d.item.photo_urls.map((u, n) => `<span class="mshot">
          <img src="${esc(u)}" onclick="window.open('${esc(u)}','_blank')" alt="">
          <button class="mshot-x" title="Remove from this ticket" onclick="maintRemovePhoto(${it.id}, '${esc(paths[n] || '')}')">✕</button>
        </span>`).join('');
      }
    }).catch(() => {});
  }
}

// ── Tukang dispatch ──────────────────────────────────────────────────
// The row that turns an approved repair into someone's morning. Era picks a
// tradesman; Maya sends him the job with the photos and chases him from
// there, telling Era what happened at each step so she never has to ask.
const VISIT_STATE = {
  offered:   ['wait', 'Sent · waiting for his reply'],
  confirmed: ['ok',   'Confirmed'],
  arrived:   ['ok',   'He is at the property'],
  done:      ['ok',   'He says it is finished'],
  declined:  ['no',   'He cannot take it · reassign'],
};
// What kind of tradesman this repair needs, from the words in the ticket.
// Only used to order the dropdown, so a wrong guess costs a scroll.
const TRADE_HINTS = [
  ['aircon',     /\b(ac|a\/c|aircon|air con|air-con|pendingin|kulkas|fridge|freezer)\b/i],
  ['plumbing',   /\b(leak|leaking|bocor|pipe|pipa|drain|saluran|tap|kran|faucet|shower|toilet|wc|sink|wastafel|water heater|pemanas|clog|mampet)\b/i],
  ['electrical', /\b(electric\w*|listrik|wiring|kabel|socket|stopkontak|switch|saklar|light|lampu|bulb|breaker|mcb|short|korslet)\b/i],
  ['pool',       /\b(pool|kolam|pump|pompa|filter|chlorine|kaporit)\b/i],
  ['paint',      /\b(paint|painting|cat|touch[- ]?up|repaint|mould|mold|jamur|damp|lembab)\b/i],
  ['carpentry',  /\b(door|pintu|window|jendela|wardrobe|lemari|cabinet|kabinet|chair|kursi|table|meja|shelf|rak|wood|kayu|hinge|engsel|lock|kunci)\b/i],
];
// Scored, not first-match. A paint job described as "flaking above the
// shower" mentions plumbing words without being plumbing, so the title (what
// the job IS) counts double and the description (where it is) counts once.
// A tie falls to the earlier entry above, and no match at all just leaves
// the dropdown alphabetical.
function tradeFor(it) {
  const title = String(it.title || ''), desc = String(it.description || '');
  let best = null, bestScore = 0;
  for (const [trade, re] of TRADE_HINTS) {
    const score = (re.test(title) ? 2 : 0) + (re.test(desc) ? 1 : 0);
    if (score > bestScore) { best = trade; bestScore = score; }
  }
  return best;
}

function dispatchRow(it) {
  const st = it.visit_status ? VISIT_STATE[it.visit_status] : null;
  if (it.assigned_staff_id && st) {
    const who = it.staff?.name || 'the tukang';
    const when = it.visit_at ? visitLabel(it.visit_at) : null;
    return `<div class="mrow" style="align-items:baseline">
      <span class="mpill ${st[0]}">${esc(st[1])}</span>
      <span style="font-size:.78rem">${esc(who)}${when ? ' · ' + esc(when) : ''}</span>
      ${it.job_token ? `<a class="btn ghost" href="/j/${esc(it.job_token)}" target="_blank">His job sheet</a>` : ''}
      ${it.visit_status === 'offered' || it.visit_status === 'confirmed'
        ? `<button class="btn ghost" onclick="dispatchSetTime(${it.id})">${it.visit_at ? 'Change the time' : 'Set a time'}</button>` : ''}
      <button class="btn ghost" onclick="dispatchClear(${it.id})">Reassign</button>
    </div>`;
  }
  const trade = tradeFor(it);
  return `<div class="mrow" style="align-items:baseline">
    <span style="font-size:.76rem;color:var(--muted)">Send this to</span>
    ${staffPickerHtml('tk-' + it.id, { role: 'tukang', trade, slug: it.slug, itemId: it.id, placeholder: 'Choose a tukang…' })}
    <span style="font-size:.72rem;color:var(--muted)">${trade ? 'Looks like ' + esc(TRADE_LABEL[trade].toLowerCase()) + ' work' : ''}</span>
  </div>`;
}

const visitLabel = (iso) => {
  const d = new Date(Date.parse(iso) + 8 * 3600e3);
  const day = new Date(d.toISOString().slice(0, 10) + 'T00:00:00Z')
    .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  return `${day}, ${d.toISOString().slice(11, 16)} WITA`;
};

// Fill every dispatch picker after the list paints, and dispatch on choice.
function wireDispatchPickers(items) {
  for (const it of items) {
    const sel = document.getElementById('tk-' + it.id);
    if (!sel) continue;
    const opts = { role: 'tukang', trade: tradeFor(it), slug: it.slug, itemId: it.id, placeholder: 'Choose a tukang…' };
    staffFillPicker(sel, opts);
    sel.addEventListener('change', () => {
      if (!sel.value || sel.value === '__new__') return;    // quick-add handles its own case
      dispatchAssign(it.id, sel.value);
    });
  }
}

async function maintAddPhoto(id, input) {

  if (!f) return;
  try {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej; r.readAsDataURL(f);
    });
    await maintApi('maint_photo', { id, fileBase64: b64, contentType: f.type || 'image/jpeg' });
    showToast('Photo added.', 'success');
    renderMaintenance();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
  finally { input.value = ''; }
