const MSTATUS = {
  new:              { cls: 'new',  label: 'Needs your review' },
  pending_approval: { cls: 'wait', label: 'Waiting on owner' },
  scheduled:        { cls: 'ok',   label: 'Scheduled' },
  approved:         { cls: 'ok',   label: 'Approved · do the work' },
  declined:         { cls: 'no',   label: 'Owner declined' },
  done:             { cls: 'done', label: 'Done' },
};

async function renderMaintenance() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading maintenance…</div>';
  try {
    // The team register feeds the "send this to" dropdown on approved work.
    // A failure there must not hide the tickets, so it is allowed to fail.
    await Promise.all([refreshMaint(), refreshStaff().catch(() => {})]);
  }
  catch (e) { if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red">${esc(e.message)}</div>`; return; }

  const items = maintData.items || [];
  const order = ['new', 'approved', 'scheduled', 'pending_approval', 'declined', 'done'];
  const sorted = [...items].sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || new Date(b.created_at) - new Date(a.created_at));

  let html = `<div class="crumb">Maintenance</div>`;
  html += `<div class="banner ${maintData.needsReview ? 'amber' : 'calm'}" style="margin-bottom:14px"><div>
    <b>${maintData.needsReview || 0}</b> waiting for your review ·
    <b>${maintData.awaitingOwner || 0}</b> with the owner ·
    <b>${maintData.openWork || 0}</b> approved and not yet done
    <div style="margin-top:5px;font-size:.76rem">Send Maya a photo on WhatsApp with the villa and what's wrong. It appears here automatically.</div>
  </div></div>`;

  if (!sorted.length) {
    html += `<div class="empty-state" style="padding:34px">Nothing logged yet. Send Maya a photo of an issue and it lands here.</div>`;
    c.innerHTML = html; return;
  }

  for (const it of sorted) {
    const st = MSTATUS[it.status] || { cls: 'done', label: it.status };
    const g = it.statement_groups || {};
    const where = it.unit_label ? `${pname(g.name || it.group_key)} · ${it.unit_label}` : pname(g.name || it.group_key);
    html += `<div class="mcard">
      <div class="mhead">
        <div style="flex:1;min-width:200px">
          <div class="mtitle">${esc(it.title)}</div>
          <div class="mwhere">${esc(where)} · reported ${esc(dstr(it.reported_at))}${it.reported_by_name ? ' by ' + esc(it.reported_by_name) : ''}</div>
        </div>
        ${it.urgency === 'urgent' ? '<span class="mpill urgent">Urgent</span>' : ''}
        <span class="mpill ${st.cls}">${esc(st.label)}</span>
      </div>
      ${it.description ? `<div class="mdesc">${esc(it.description)}</div>` : ''}
      <div class="mshots" id="shots-${it.id}"></div>
      <div class="mrow" style="margin-top:8px">
        <label class="btn ghost" style="cursor:pointer;font-size:.75rem">+ Add photo
          <input type="file" accept="image/*" style="display:none" onchange="maintAddPhoto(${it.id}, this)">
        </label>
      </div>`;

    if (it.status === 'new') {
      html += `<div class="mrow">
        <span style="font-size:.76rem;color:var(--muted)">Estimated cost</span>
        <input type="text" id="mcost-${it.id}" placeholder="e.g. 850000" value="${it.estimated_cost ?? ''}" style="width:130px">
        <select id="mmode-${it.id}">
          <option value="1">Ask the owner to approve</option>
          <option value="0">Routine: just tell them</option>
        </select>
        <button class="btn primary" onclick="maintPublish(${it.id})">Publish &amp; notify</button>
        <button class="btn ghost" onclick="maintDelete(${it.id})">Not an issue</button>
      </div>`;
    }
    if (it.status === 'approved' || it.status === 'scheduled') {
      html += dispatchRow(it);
      html += `<div class="mrow">
        <button class="btn green" onclick="maintComplete(${it.id})">Mark done</button>
        <span style="font-size:.76rem;color:var(--muted)">Next check-in ${it.next_followup_at ? esc(dstr(it.next_followup_at)) : '–'}${it.promised_date ? ` (you said ${esc(dstr(it.promised_date))})` : ''}</span>
      </div>`;
    }
    if (it.status === 'pending_approval') {
      html += `<div class="mrow">
        <a class="btn ghost" href="/m/${esc(it.token || '')}" target="_blank">Preview owner view ↗</a>
        <button class="btn ghost" onclick="maintApproveFor(${it.id})">Owner approved (by phone)</button>
      </div>`;
    }
    if (it.status === 'declined') {
      html += `<div class="mmeta">Declined ${esc(dstr(it.declined_at))}${it.decline_note ? ` · “${esc(it.decline_note)}”` : ''}</div>`;
    }
    if (it.status === 'done') {
      html += `<div class="mmeta">Completed ${esc(dstr(it.completed_at))}${it.actual_cost != null ? ` · ${IDR(it.actual_cost)}` : ''}${it.completion_note ? ` · ${esc(it.completion_note)}` : ''}</div>`;
    }
    const cost = it.actual_cost ?? it.estimated_cost;
    if (cost != null && it.status !== 'new') {
      html += `<div class="mmeta">${it.actual_cost != null ? 'Final' : 'Estimate'}: <b>${IDR(cost)}</b> · ${it.requires_approval ? 'owner approval required' : 'routine, no approval needed'}</div>`;
    }
    if ((it.thread || []).length) {
      const last = it.thread[it.thread.length - 1];
      html += `<div class="mmeta">${esc(last.who || 'Era')}: “${esc(last.text)}”</div>`;
    }
    html += `</div>`;
  }
  c.innerHTML = html;
  wireDispatchPickers(sorted);
  // Photos need signed URLs — fetch each item's detail lazily so the list
  // isn't blocked on signing every image.
  for (const it of sorted) {
    if (!(it.photos || []).length) continue;
    maintApi('maint_detail', { id: it.id }).then(d => {
      const box = document.getElementById('shots-' + it.id);
      if (box && d.item?.photo_urls?.length) {
        const paths = d.item.photos || [];
        box.innerHTML = d.item.photo_urls.map((u, n) => `<span class="mshot">
          <img src="${esc(u)}" onclick="window.open('${esc(u)}','_blank')" alt="">
          <button class="mshot-x" title="Remove from this ticket" onclick="maintRemovePhoto(${it.id}, '${esc(paths[n] || '')}')">✕</button>
        </span>`).join('');
      }
    }).catch(() => {});
  }
}

// ── Tukang dispatch ──────────────────────────────────────────────────
// The row that turns an approved repair into someone's morning. Era picks a
// tradesman; Maya sends him the job with the photos and chases him from
// there, telling Era what happened at each step so she never has to ask.
const VISIT_STATE = {
  offered:   ['wait', 'Sent · waiting for his reply'],
  confirmed: ['ok',   'Confirmed'],
  arrived:   ['ok',   'He is at the property'],
  done:      ['ok',   'He says it is finished'],
  declined:  ['no',   'He cannot take it · reassign'],
};
// What kind of tradesman this repair needs, from the words in the ticket.
// Only used to order the dropdown, so a wrong guess costs a scroll.
const TRADE_HINTS = [
  ['aircon',     /\b(ac|a\/c|aircon|air con|air-con|pendingin|kulkas|fridge|freezer)\b/i],
  ['plumbing',   /\b(leak|leaking|bocor|pipe|pipa|drain|saluran|tap|kran|faucet|shower|toilet|wc|sink|wastafel|water heater|pemanas|clog|mampet)\b/i],
  ['electrical', /\b(electric\w*|listrik|wiring|kabel|socket|stopkontak|switch|saklar|light|lampu|bulb|breaker|mcb|short|korslet)\b/i],
  ['pool',       /\b(pool|kolam|pump|pompa|filter|chlorine|kaporit)\b/i],
  ['paint',      /\b(paint|painting|cat|touch[- ]?up|repaint|mould|mold|jamur|damp|lembab)\b/i],
  ['carpentry',  /\b(door|pintu|window|jendela|wardrobe|lemari|cabinet|kabinet|chair|kursi|table|meja|shelf|rak|wood|kayu|hinge|engsel|lock|kunci)\b/i],
];
// Scored, not first-match. A paint job described as "flaking above the
// shower" mentions plumbing words without being plumbing, so the title (what
// the job IS) counts double and the description (where it is) counts once.
// A tie falls to the earlier entry above, and no match at all just leaves
// the dropdown alphabetical.
function tradeFor(it) {
  const title = String(it.title || ''), desc = String(it.description || '');
  let best = null, bestScore = 0;
  for (const [trade, re] of TRADE_HINTS) {
    const score = (re.test(title) ? 2 : 0) + (re.test(desc) ? 1 : 0);
    if (score > bestScore) { best = trade; bestScore = score; }
  }
  return best;
}

function dispatchRow(it) {
  const st = it.visit_status ? VISIT_STATE[it.visit_status] : null;
  if (it.assigned_staff_id && st) {
    const who = it.staff?.name || 'the tukang';
    const when = it.visit_at ? visitLabel(it.visit_at) : null;
    return `<div class="mrow" style="align-items:baseline">
      <span class="mpill ${st[0]}">${esc(st[1])}</span>
      <span style="font-size:.78rem">${esc(who)}${when ? ' · ' + esc(when) : ''}</span>
      ${it.job_token ? `<a class="btn ghost" href="/j/${esc(it.job_token)}" target="_blank">His job sheet</a>` : ''}
      ${it.visit_status === 'offered' || it.visit_status === 'confirmed'
        ? `<button class="btn ghost" onclick="dispatchSetTime(${it.id})">${it.visit_at ? 'Change the time' : 'Set a time'}</button>` : ''}
      <button class="btn ghost" onclick="dispatchClear(${it.id})">Reassign</button>
    </div>`;
  }
  const trade = tradeFor(it);
  return `<div class="mrow" style="align-items:baseline">
    <span style="font-size:.76rem;color:var(--muted)">Send this to</span>
    ${staffPickerHtml('tk-' + it.id, { role: 'tukang', trade, slug: it.slug, itemId: it.id, placeholder: 'Choose a tukang…' })}
    <span style="font-size:.72rem;color:var(--muted)">${trade ? 'Looks like ' + esc(TRADE_LABEL[trade].toLowerCase()) + ' work' : ''}</span>
  </div>`;
}

const visitLabel = (iso) => {
  const d = new Date(Date.parse(iso) + 8 * 3600e3);
  const day = new Date(d.toISOString().slice(0, 10) + 'T00:00:00Z')
    .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  return `${day}, ${d.toISOString().slice(11, 16)} WITA`;
};

// Fill every dispatch picker after the list paints, and dispatch on choice.
function wireDispatchPickers(items) {
  for (const it of items) {
    const sel = document.getElementById('tk-' + it.id);
    if (!sel) continue;
    const opts = { role: 'tukang', trade: tradeFor(it), slug: it.slug, itemId: it.id, placeholder: 'Choose a tukang…' };
    staffFillPicker(sel, opts);
    sel.addEventListener('change', () => {
      if (!sel.value || sel.value === '__new__') return;    // quick-add handles its own case
      dispatchAssign(it.id, sel.value);
    });
  }
}

async function dispatchAssign(id, staffId) {

    renderMaintenance();

}
async function dispatchClear(id) {

}

async function maintRemovePhoto(id, path) {

    await maintApi('maint_photo_remove', { id, path });

async function maintAddPhoto(id, input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej; r.readAsDataURL(f);
    });
    await maintApi('maint_photo', { id, fileBase64: b64, contentType: f.type || 'image/jpeg' });
    showToast('Photo added.', 'success');
    renderMaintenance();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
  finally { input.value = ''; }
}
async function maintPublish(id) {

  try {
    await maintApi('maint_publish', { id, requires_approval: needs, estimated_cost: cost ? Number(cost) : null });
    showToast(needs ? 'Published. Maya will ask the owner to approve.' : 'Published. Maya will let the owner know.', 'success');

// ── Schedule ─────────────────────────────────────────────────────────
// Era's page. The same day list she gets on WhatsApp every morning, with
// the guests and the tukang visits in it, a week strip to move around, and
// one button to add a clean. Built phone-first: she reads it on her phone,
// standing in a villa. Nothing here needs a legend; if it does, it is wrong.
let hkData = null;        // hk_schedule payload for the 30-day window
let hkStays = null;       // hk_stays payload (the Hostex calendar) — optional
let schedSel = null;      // the day the list starts on
let schedWeek = null;     // Monday of the week strip
let schedFilter = 'all';  // all | clean | guest | maint | who:<staff id>
let schedVilla = null;    // a slug, when looking at one villa's 30 days
let hkAdd = {};           // the add-a-clean draft

const HK_KIND = {
  turnover:      ['Turnover clean', 'the guest left'],
  regular:       ['Regular clean', 'twice a week'],
  pre_arrival:   ['Prepare the villa', 'a guest arrives'],
  inspection:    ['Inspection with photos', 'for the owner report'],
};
const HK_STATUS = {
  planned:   ['wait', 'Planned'],
  notified:  ['ok',   'Sent'],
  confirmed: ['ok',   'Confirmed'],
  done:      ['done', 'Done'],
  skipped:   ['no',   'Skipped'],
};
const HK_LETTER = { turnover: 'T', regular: 'R', pre_arrival: 'P', inspection: 'I' };

async function hkApi(action, payload) {
  const r = await fetch('/api/housekeeping', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

const witaToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dPlus = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const dFmt = (d, o) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { timeZone: 'UTC', ...o });
const dMonday = (d) => dPlus(d, -((new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7));
const hkName = (slug) => (hkData?.names || {})[slug] || unitName(slug);
const hkShort = (slug) => hkName(slug).replace(/\s[–-]\s/, ' · ');
const hkToday = () => hkData?.today || witaToday();
const hkStayList = (slug) => ((hkStays?.units || []).find(u => u.slug === slug)?.stays || []).filter(s => s.status !== 'cancelled');
const hkInResidence = (slug, d) => hkStayList(slug).some(s => s.check_in < d && s.check_out > d);
const hkWho = (t) => t.staff?.name || (staffData?.staff || []).find(p => p.id === t.assigned_staff_id)?.name || '';
const ICO_HOUSE = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 9L10 3.6 16.8 9"/><path d="M5 8.4V16h10V8.4"/><path d="M8.5 16v-4h3v4"/></svg>';
const ICO_TOOL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3.6a3.6 3.6 0 0 0-4.9 4.4l-4.2 4.2a1.4 1.4 0 0 0 0 2l1.9 1.9a1.4 1.4 0 0 0 2 0l4.2-4.2a3.6 3.6 0 0 0 4.4-4.9l-2.2 2.2-2-.6-.6-2z"/></svg>';

// Everything that happens on one day, in the order Era reads it: the guest
// movements that create the work, the cleans, then any tukang visit.
function schedEvents(d) {
  const out = [];
  for (const u of (hkStays?.units || [])) {
    for (const s of hkStayList(u.slug)) {
      if (s.check_out === d) out.push({ type: 'guest', slug: u.slug, text: 'Guest checks out', sub: `${s.nights || '?'} nights · ${s.channel || 'booking'}` });
      if (s.check_in === d) out.push({ type: 'guest', slug: u.slug, text: 'Guest checks in', sub: `${s.nights || '?'} nights · ${s.channel || 'booking'}` });
    }
  }
  for (const t of (hkData?.tasks || [])) {
    if (t.task_date !== d) continue;
    const k = HK_KIND[t.kind] || [t.kind, ''];
    const who = hkWho(t);
    out.push({ type: 'clean', slug: t.slug, id: t.id, kind: t.kind, staffId: t.assigned_staff_id, text: k[0], status: t.status, sameDay: !!t.same_day,
      sub: [who || 'nobody assigned', k[1], t.same_day ? 'next guest arrives the same day' : (hkInResidence(t.slug, d) ? 'guest in residence' : ''), t.moved_by ? 'moved by hand' : ''].filter(Boolean).join(' · ') });
  }
  for (const it of (maintData?.items || [])) {
    if (!it.visit_at || ['done', 'declined'].includes(it.status)) continue;
    const vd = new Date(new Date(it.visit_at).getTime() + 8 * 3600e3).toISOString().slice(0, 10);
    if (vd !== d) continue;
    const slug = it.unit_label || it.group_key;
    out.push({ type: 'maint', slug, maintId: it.id, text: 'Tukang visit', sub: `${it.title}${it.staff?.name ? ' · ' + it.staff.name : ''}` });
  }
  const order = { guest: 0, clean: 1, maint: 2 };
  return out
    .filter(e => !schedVilla || e.slug === schedVilla)
    .filter(e => schedFilter === 'all' || schedFilter === e.type || (schedFilter.startsWith('who:') && String(e.staffId) === schedFilter.slice(4)))
    .sort((a, b) => order[a.type] - order[b.type] || hkName(a.slug).localeCompare(hkName(b.slug), undefined, { numeric: true }));
}

async function renderCleaning() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading the schedule…</div>';
  const from = witaToday(), to = dPlus(from, 30);
  try {
    // The stays and the maintenance list are context; the schedule itself is
    // the page. Either of them failing must not hide the cleans.
    const [sched, stays] = await Promise.all([
      hkApi('hk_schedule', { from, to }),
      hkApi('hk_stays', { from, to }).catch(() => null),
      refreshStaff().catch(() => {}),
      refreshMaint().catch(() => {}),
    ]);
    hkData = sched; hkStays = stays;
  } catch (e) { if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red"><div>${esc(e.message)}</div></div>`; return; }

  const today = hkToday();
  if (!schedSel || schedSel < today || schedSel > to) schedSel = today;
  schedWeek = dMonday(schedSel);
  const tasks = hkData.tasks || [];
  const todayCount = tasks.filter(t => t.task_date === today && t.status !== 'done' && t.status !== 'skipped').length;
  const badge = document.getElementById('hk-badge');
  if (badge) { badge.textContent = todayCount; badge.style.display = todayCount ? '' : 'none'; }

  c.innerHTML = `<div class="crumb" id="sched-crumb"></div>
    <div class="sched">
      <div class="sched-top">
        <div class="sched-sub" id="sched-sub"></div>
        <div class="week" id="sched-week"></div>
        <div class="weeknav"><button type="button" onclick="schedShift(-7)">‹ Last week</button><span id="sched-weeklabel"></span><button type="button" onclick="schedShift(7)">Next week ›</button></div>
      </div>
      <div class="chips" id="sched-chips"></div>
      <div class="actionsrow" style="margin:12px 0 6px">
        <button class="btn primary" onclick="hkAddSheet(1)">+ Add a clean</button>
        <button class="btn ghost" onclick="hkCareEdit()">Cleaning days</button>
        <button class="btn ghost" onclick="hkGenerate()">Rebuild from the calendar</button>
      </div>
      <div class="sched-list" id="sched-list"></div>
    </div>`;
  schedRender();
}

function schedRender() {
  const today = hkToday();
  const tasks = hkData?.tasks || [];
  // Crumb: the page, or the page › one villa.
  document.getElementById('sched-crumb').innerHTML = schedVilla
    ? `<a onclick="schedShowVilla(null)">Schedule</a> › ${esc(hkShort(schedVilla))}`
    : 'Schedule';
  const todayCount = tasks.filter(t => t.task_date === today && t.status !== 'done' && t.status !== 'skipped').length;
  document.getElementById('sched-sub').innerHTML = schedVilla
    ? `The next 30 days at this villa. Tap a clean to change who does it or move it.`
    : `<b>${todayCount}</b> clean${todayCount === 1 ? '' : 's'} today · <b>${tasks.length}</b> in the next 30 days${hkData.unassigned ? ` · <b>${hkData.unassigned}</b> with nobody assigned` : ''}${hkStays ? '' : ' · guest calendar unavailable right now'}`;

  // Week strip.
  let w = '';
  for (let i = 0; i < 7; i++) {
    const d = dPlus(schedWeek, i);
    const n = d >= today ? schedEvents(d).length : 0;
    const wd = new Date(d + 'T00:00:00Z').getUTCDay();
    w += `<button type="button" class="dayp${d === today ? ' today' : ''}${d === schedSel ? ' sel' : ''}${wd === 0 || wd === 6 ? ' wk' : ''}${d < today ? ' past' : ''}" onclick="schedPick('${d}')"><small>${dFmt(d, { weekday: 'short' }).slice(0, 2).toUpperCase()}</small><b>${new Date(d + 'T00:00:00Z').getUTCDate()}</b><i>${n || ''}</i></button>`;
  }
  document.getElementById('sched-week').innerHTML = w;
  document.getElementById('sched-weeklabel').textContent = `${dFmt(schedWeek, { day: 'numeric', month: 'short' })} – ${dFmt(dPlus(schedWeek, 6), { day: 'numeric', month: 'short' })}`;

  // Chips: the three kinds of thing, then one per housekeeper.
  const keepers = (staffData?.staff || []).filter(p => p.active && (p.roles || []).includes('housekeeper'));
  const chips = [['all', 'Everything'], ['clean', 'Cleaning'], ['guest', 'Guests'], ['maint', 'Maintenance'], ...keepers.map(p => ['who:' + p.id, p.name])];
  document.getElementById('sched-chips').innerHTML = chips.map(([k, l]) =>
    `<button type="button" class="chip${schedFilter === k ? ' on' : ''}" onclick="schedSetFilter('${k}')">${esc(l)}</button>`).join('');

  // The list: a week from the chosen day, or a villa's whole 30 days.
  const from = schedVilla ? today : schedSel;
  const to = schedVilla ? dPlus(today, 30) : dPlus(schedSel, 6);
  let h = '';
  if (schedVilla) {
    const cur = hkStayList(schedVilla).find(s => s.check_in <= today && s.check_out > today);
    const next = hkStayList(schedVilla).filter(s => s.check_in > today).sort((a, b) => a.check_in.localeCompare(b.check_in))[0];
    h += `<div class="sitem sitem-banner"><div class="sic guest">${ICO_HOUSE}</div><div class="stxt"><div class="t">${cur ? `Guest in residence until ${dFmt(cur.check_out, { weekday: 'short', day: 'numeric', month: 'short' })}` : 'Empty right now'}</div><div class="s">${cur ? `${cur.nights || '?'} nights · ${cur.channel || 'booking'}` : next ? `next guest arrives ${dFmt(next.check_in, { weekday: 'short', day: 'numeric', month: 'short' })}` : (hkStays ? 'no booking in the next 30 days' : 'guest calendar unavailable')}</div></div></div>`;
  }
  for (let d = from; d <= to; d = dPlus(d, 1)) {
    const ev = schedEvents(d);
    if (schedVilla && !ev.length) continue;
    h += `<div class="dayhead${d === today ? ' today' : ''}"><span>${dFmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${d === today ? ' · today' : ''}</span><span>${ev.length || ''}</span></div>`;
    if (!ev.length) { h += `<div class="sempty">Nothing planned. Tap <b>Add a clean</b> if a villa needs one.</div>`; continue; }
    for (const e of ev) {
      const pill = e.type === 'clean'
        ? (e.sameDay && e.status !== 'done' && e.status !== 'skipped' ? ['hot', 'Same day'] : (HK_STATUS[e.status] || ['wait', e.status]))
        : null;
      const icon = e.type === 'clean' ? (HK_LETTER[e.kind] || 'C') : e.type === 'guest' ? ICO_HOUSE : ICO_TOOL;
      const onclick = e.type === 'clean' ? `hkTaskSheet(${e.id})` : e.type === 'maint' ? `go('#/maintenance')` : (schedVilla ? '' : `schedShowVilla('${esc(e.slug)}')`);
      h += `<div class="sitem" ${onclick ? `onclick="${onclick}" role="button" tabindex="0"` : ''}>
        <div class="sic ${e.type}">${icon}</div>
        <div class="stxt">
          <div class="t">${schedVilla ? esc(e.text) : `<a class="vlink" onclick="event.stopPropagation();schedShowVilla('${esc(e.slug)}')">${esc(hkShort(e.slug))}</a>`}</div>
          <div class="s">${schedVilla ? '' : `<b>${esc(e.text)}</b> · `}${esc(e.sub)}</div>
        </div>
        ${pill ? `<span class="pill ${pill[0]}">${esc(pill[1])}</span>` : ''}
      </div>`;
    }
  }
  document.getElementById('sched-list').innerHTML = h || '<div class="sempty">Nothing here.</div>';
}
function schedPick(d) { schedSel = d; schedVilla = null; schedRender(); }
function schedShift(n) { schedWeek = dPlus(schedWeek, n); schedRender(); }
function schedSetFilter(k) { schedFilter = k; schedRender(); }
function schedShowVilla(slug) { schedVilla = slug; schedRender(); if (slug) document.getElementById('content').scrollIntoView({ block: 'start' }); }

// ── One clean: who, when, done, skip ──
function hkTaskSheet(id) {
  const t = (hkData?.tasks || []).find(x => x.id === id);
  if (!t) return;
  const k = HK_KIND[t.kind] || [t.kind, ''];
  const st = HK_STATUS[t.status] || ['wait', t.status];
  modal(`<h3>${esc(k[0])}</h3>
    <p>${esc(hkShort(t.slug))} · ${dFmt(t.task_date, { weekday: 'long', day: 'numeric', month: 'long' })} · <span class="pill ${st[0]}">${esc(st[1])}</span>${t.same_day ? '<br>The next guest arrives the same day, so this one cannot slip.' : ''}</p>
    <label class="flab">Who does it</label>
    <select class="flt" id="hk-sheet-who" style="width:100%" onchange="staffPickerChanged(this,{role:'housekeeper'})"></select>
    <label class="flab">Move it to</label>
    <input type="date" id="hk-sheet-date" value="${t.task_date}" min="${hkToday()}" style="width:100%">
    <div class="row" style="justify-content:space-between">
      <span style="display:flex;gap:6px">
        ${t.status !== 'skipped' ? `<button class="btn ghost" onclick="hkStatus(${t.id},'skipped')">Skip</button>` : ''}
        ${t.status !== 'done' ? `<button class="btn ghost" onclick="hkStatus(${t.id},'done')">Done</button>` : ''}
      </span>
      <span style="display:flex;gap:6px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="hkTaskSave(${t.id})">Save</button></span>
    </div>`);
  const sel = document.getElementById('hk-sheet-who');
  staffFillPicker(sel, { role: 'housekeeper', slug: t.slug, placeholder: 'Nobody assigned' });
  if (t.assigned_staff_id) sel.value = String(t.assigned_staff_id);
}
async function hkTaskSave(id) {
  const t = (hkData?.tasks || []).find(x => x.id === id);
  const who = document.getElementById('hk-sheet-who').value;
  const date = document.getElementById('hk-sheet-date').value;
  const fields = {};
  if (String(t.assigned_staff_id || '') !== who) fields.assigned_staff_id = who ? Number(who) : null;
  if (date && date !== t.task_date) fields.task_date = date;
  if (!Object.keys(fields).length) { closeModal(); return; }
  try {
    await hkApi('hk_patch', { id, fields });
    closeModal();
    showToast(fields.task_date ? 'Moved. She will be told again on the new day.' : 'Saved.', 'success');
    if (fields.task_date) schedSel = fields.task_date;
    renderCleaning();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}
async function hkStatus(id, status) {
  try { await hkApi('hk_status', { id, status }); closeModal(); renderCleaning(); }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// ── Add a clean: villa, day, who. Three taps. ──
function hkAddSheet(step) {
  if (step === 1) {
    hkAdd = {};
    const slugs = [...new Set([...(staffData?.units || []).map(u => u.slug), ...(hkStays?.units || []).map(u => u.slug), ...(hkData?.tasks || []).map(t => t.slug)])]
      .sort((a, b) => hkName(a).localeCompare(hkName(b), undefined, { numeric: true }));
    modal(`<h3>Add a clean</h3><p>Which villa?</p>
      ${slugs.map(s => `<div class="opt" onclick="hkAddPick('slug','${esc(s)}')">${esc(hkShort(s))}</div>`).join('')}
      <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`, { wide: true });
  }
  if (step === 2) {
    const today = hkToday();
    let rows = '';
    for (let i = 0; i < 14; i++) {
      const d = dPlus(today, i);
      const out = hkStayList(hkAdd.slug).some(s => s.check_out === d), inn = hkStayList(hkAdd.slug).some(s => s.check_in === d);
      const inRes = hkInResidence(hkAdd.slug, d);
      const already = (hkData?.tasks || []).filter(t => t.slug === hkAdd.slug && t.task_date === d).map(t => (HK_KIND[t.kind] || [t.kind])[0].toLowerCase());
      const why = [out ? 'guest leaves' : '', inn ? 'guest arrives' : '', !out && !inn && inRes ? 'guest in' : '', !out && !inn && !inRes ? 'empty' : '', already.length ? 'already: ' + already.join(', ') : ''].filter(Boolean).join(' · ');
      rows += `<div class="opt" onclick="hkAddPick('date','${d}')">${dFmt(d, { weekday: 'short', day: 'numeric', month: 'short' })}${d === today ? ' · today' : ''}<small>${esc(why)}</small></div>`;
    }
    modal(`<h3>Add a clean</h3><p>${esc(hkShort(hkAdd.slug))} · which day?</p>${rows}
      <div class="row"><button class="btn ghost" onclick="hkAddSheet(1)">Back</button></div>`, { wide: true });
  }
  if (step === 3) {
    const out = hkStayList(hkAdd.slug).some(s => s.check_out === hkAdd.date);
    const inn = hkStayList(hkAdd.slug).some(s => s.check_in === dPlus(hkAdd.date, 1)) || hkStayList(hkAdd.slug).some(s => s.check_in === hkAdd.date);
    hkAdd.kind = hkAdd.kind || (out ? 'turnover' : inn ? 'pre_arrival' : 'regular');
    modal(`<h3>Add a clean</h3><p>${esc(hkShort(hkAdd.slug))} · ${dFmt(hkAdd.date, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
      <label class="flab">Who</label>
      <select class="flt" id="hk-add-who" style="width:100%" onchange="staffPickerChanged(this,{role:'housekeeper'})"></select>
      <label class="flab">What kind</label>
      ${Object.entries(HK_KIND).map(([k, v]) => `<div class="opt${hkAdd.kind === k ? ' on' : ''}" onclick="hkAddPick('kind','${k}')">${esc(v[0])}<small>${esc(v[1])}</small></div>`).join('')}
      <div class="row"><button class="btn ghost" onclick="hkAddSheet(2)">Back</button><button class="btn primary" id="hk-add-save" onclick="hkAddSave()">Add</button></div>`, { wide: true });
    const sel = document.getElementById('hk-add-who');
    staffFillPicker(sel, { role: 'housekeeper', slug: hkAdd.slug, placeholder: 'Nobody yet' });
    if (hkAdd.who) sel.value = String(hkAdd.who);
  }
}
function hkAddPick(key, value) {
  if (key === 'kind') { hkAdd.who = document.getElementById('hk-add-who')?.value || hkAdd.who; }
  hkAdd[key] = value;
  hkAddSheet(key === 'slug' ? 2 : 3);
}
async function hkAddSave() {
  const who = document.getElementById('hk-add-who').value;
  const btn = document.getElementById('hk-add-save'); if (btn) btn.disabled = true;
  try {
    await hkApi('hk_create', { slug: hkAdd.slug, task_date: hkAdd.date, kind: hkAdd.kind, assigned_staff_id: who ? Number(who) : null });
    closeModal();
    const name = (staffData?.staff || []).find(p => String(p.id) === who)?.name;
    showToast(name ? `Added. ${name} gets it in her morning message.` : 'Added. Assign someone so it goes out.', 'success');
    schedSel = hkAdd.date; schedVilla = null;
    renderCleaning();
  } catch (e) { if (btn) btn.disabled = false; if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// Postgres weekday numbering, 0 = Sunday, the same as property_care.clean_days.
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

async function hkCareEdit() {
  let care = [];
  try { care = (await hkApi('hk_care', {})).care || []; }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); return; }

  const byslug = Object.fromEntries(care.map(c => [c.slug, c]));
  const units = (staffData?.units || []).map(u => u.slug);
  const rows = (units.length ? units : care.map(c => c.slug)).map(slug => {
    const days = byslug[slug]?.clean_days || [];
    const toggles = DOW.map((d, i) =>
      `<label class="daybox"><input type="checkbox" data-slug="${esc(slug)}" value="${i}"${days.includes(i) ? ' checked' : ''}>${d[0]}</label>`).join('');
    return `<div class="careline"><span class="cn">${esc(hkName(slug))}</span><span class="cd">${toggles}</span></div>`;
  }).join('');

  modal(`<h3>Cleaning days</h3>
    <p>The twice-weekly clean each villa gets, whether or not anyone is staying. Spread the days so one housekeeper is not doing four villas on one morning.</p>
    <div class="carewrap">${rows}</div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="care-save" onclick="hkCareSave()">Save</button></div>`, { wide: true });
}

async function hkCareSave() {
  const bySlug = {};
  document.querySelectorAll('.carewrap input[type=checkbox]').forEach(el => {
    (bySlug[el.dataset.slug] ||= []);
    if (el.checked) bySlug[el.dataset.slug].push(Number(el.value));
  });
  const btn = document.getElementById('care-save');
  if (btn) btn.disabled = true;
  try {
    for (const [slug, clean_days] of Object.entries(bySlug)) {
      await hkApi('hk_care_patch', { slug, clean_days });
    }
    closeModal();
    // Changing the days only alters visits nobody has been told about, so a
    // rebuild here is safe and makes the effect immediately visible.
    const out = await hkApi('hk_replan', {});
    showToast(`Saved. Schedule rebuilt: ${out.created || 0} visits.`, 'success');
    renderCleaning();
  } catch (e) {
    if (btn) btn.disabled = false;
    if (e.message !== 'unauthorized') showToast(e.message, 'error');
  }
}

async function hkGenerate() {
  try {
    const out = await hkApi('hk_generate', {});
    showToast(out.skipped ? out.skipped
      : `${out.created || 0} new task${out.created === 1 ? '' : 's'} from ${out.planned || 0} planned visits.`,
      out.skipped || out.error ? 'error' : 'success');
    renderCleaning();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// ── How to use: one short guide per page, opened from the crumb ───────
// Era should never have to ask what a page is for. Each guide says what the
// page shows, what she is expected to do on it, and what happens when she
// does — in that order, in plain words, and short enough to read on a phone.
const HELP = {
  list: { title: 'Payouts', html: `
    <p>One card per villa per month, built from the statement sheets. The amount is what the owner is owed after our fee and any costs.</p>
    <h4>What you do here</h4>
    <ol>

function mountHelp(view) {
  const key = HELP[view] ? view : null;
  if (!key) return;
  const crumb = document.querySelector('#content .crumb');
  if (!crumb || crumb.querySelector('.helpbtn')) return;
  crumb.insertAdjacentHTML('beforeend', `<button type="button" class="helpbtn" onclick="showHelp('${key}')" aria-label="How to use this page">? How to use</button>`);
}
function showHelp(key) {
  const h = HELP[key]; if (!h) return;
  modal(`<div class="help"><h3>How to use · ${esc(h.title)}</h3>${h.html}<div class="row"><button class="btn primary" onclick="closeModal()">Got it</button></div></div>`, { wide: true });
}

// ── Team ─────────────────────────────────────────────────────────────
// The staff registry. Maintenance dispatch, housekeeping schedules and
// payroll all read this one list, so a person is corrected here once
// instead of in three places that quietly drift apart.
let staffData = null;   // { staff: [], units: [] }

const ROLES  = ['housekeeper', 'pool', 'gardener', 'tukang', 'manager'];
const TRADES = ['aircon', 'electrical', 'plumbing', 'carpentry', 'pool', 'paint', 'general'];
const ROLE_LABEL = { housekeeper: 'Housekeeper', pool: 'Pool', gardener: 'Gardener', tukang: 'Tukang', manager: 'Manager' };
const TRADE_LABEL = { aircon: 'AC', electrical: 'Electrical', plumbing: 'Plumbing', carpentry: 'Carpentry', pool: 'Pool', paint: 'Paint', general: 'General' };

async function staffApi(action, payload) {
  const r = await fetch('/api/staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

async function refreshStaff(force) {
  if (staffData && !force) return staffData;
  staffData = await staffApi('staff_list', {});
  return staffData;
}

// Not every slug is a catalog unit: Astanine is Ikiel's own villa, it carries
// staff but has no listing, so it is stored as a plain slug.
const unitName = (slug) => {
  const u = (staffData?.units || []).find(x => x.slug === slug);
  if (u) return pname(u.name);
  return String(slug || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
};
// A trade that just restates the role ("Pool" on the pool man) is noise.
const realTrades = (p) => (p.trades || []).filter(t => !(p.roles || []).includes(t));
// Era reads numbers off her phone, where they are spaced. Showing 11 bare
// digits makes checking one against a contact card needlessly hard.
function waPretty(n) {
  const d = String(n || '').replace(/\D/g, '');
  if (!d.startsWith('62') || d.length < 9) return d;
  const rest = d.slice(2);
  const parts = [rest.slice(0, 3)];
  for (let i = 3; i < rest.length; i += 4) parts.push(rest.slice(i, i + 4));
  return '+62 ' + parts.join('-');
}

async function renderStaff() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading the team…</div>';
  let load = {};
  try {
    await refreshStaff(true);
    // This week's visit count per person. Without it the page is inert
    // reference data; with it, it answers the question Era actually has,
    // which is whether anyone's week is unmanageable.
    const sched = await hkApi('hk_schedule', {}).catch(() => null);
    if (sched?.tasks) {
      const end = new Date(Date.parse(sched.today) + 7 * 86400e3).toISOString().slice(0, 10);
      for (const t of sched.tasks) {
        if (t.task_date >= sched.today && t.task_date < end && t.assigned_staff_id) {
          (load[t.assigned_staff_id] ||= { total: 0, days: {} });
          load[t.assigned_staff_id].total++;
          load[t.assigned_staff_id].days[t.task_date] = (load[t.assigned_staff_id].days[t.task_date] || 0) + 1;
        }
      }
      load.__from = sched.today;
    }
  } catch (e) {
    if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red"><div>${esc(e.message)}</div></div>`;
    return;
  }

  const people = staffData.staff || [];
  const units = staffData.units || [];
  const live = people.filter(p => p.active);
  const hk = (p) => (p.roles || []).includes('housekeeper');
  const gaps = units.filter(u => !live.some(p => hk(p) && (p.slugs || []).includes(u.slug)));

  let html = `<div class="crumb">Team</div>`;

  // Coverage as an EXCEPTION, not a list. Fourteen rows to report that
  // nothing is wrong is fourteen rows of noise; the only state worth space
  // on the page is the one that needs acting on.
  html += gaps.length
    ? `<div class="banner amber"><div><b>${gaps.length} villa${gaps.length > 1 ? 's have' : ' has'} no housekeeper.</b>
        ${gaps.map(u => esc(pname(u.name))).join(', ')} — cleaning tasks there will have nobody to notify.</div></div>`
    : `<div class="banner calm"><div><b>${live.length} on the team.</b> Every villa has a housekeeper.
        <div style="margin-top:5px;font-size:.76rem">Everyone Maya can message: they can send her maintenance photos, be assigned a repair, and appear on the cleaning schedule.</div></div></div>`;

  html += `<div class="actionsrow" style="margin-bottom:16px">
    <button class="btn primary" onclick="staffEdit(null)">Add someone</button></div>`;

  if (!people.length) {
    html += `<div class="empty-state" style="padding:34px">Nobody in the register yet. Add Era's housekeepers and the tukang you call, and Maya can start messaging them.</div>`;
    c.innerHTML = html; return;
  }

  // Grouped by what someone is FOR, because that is how Era looks for them:
  // she needs a cleaner, or she needs someone to fix a tap.
  const groups = [
    ['Housekeeping', live.filter(hk)],
    ['Repairs and pool', live.filter(p => !hk(p) && ((p.roles || []).includes('tukang') || (p.roles || []).includes('pool') || (p.roles || []).includes('gardener')))],
    ['Office', live.filter(p => !hk(p) && (p.roles || []).includes('manager'))],
  ];
  const placed = new Set(groups.flatMap(([, arr]) => arr.map(p => p.id)));
  const rest = live.filter(p => !placed.has(p.id));
  if (rest.length) groups.push(['Everyone else', rest]);
  const inactive = people.filter(p => !p.active);
  if (inactive.length) groups.push(['No longer with us', inactive]);

  for (const [label, arr] of groups) {
    if (!arr.length) continue;
    html += `<div class="grouphead">${esc(label)}<span>${arr.length}</span></div><div class="pgrid">`;
    html += arr.sort((a, b) => String(a.name).localeCompare(String(b.name))).map(p => personCard(p, load, hk(p))).join('');
    html += `</div>`;
  }
  c.innerHTML = html;
}

// "HAUS Canggu · Unit 1", "· Unit 2", "· Unit 4"… repeated down a page is
// almost all redundancy. Collapsing to "HAUS Canggu 1 2 4" says the same
// thing in a quarter of the space and is easier to scan.
function groupedVillas(slugs) {
  const out = new Map();
  for (const slug of slugs) {
    const full = unitName(slug);
    const m = full.match(/^(.*?)\s*·\s*Unit\s*(.+)$/i);
    const [head, unit] = m ? [m[1].trim(), m[2].trim()] : [full, null];
    if (!out.has(head)) out.set(head, []);
    if (unit) out.get(head).push(unit);
  }
  return [...out.entries()].map(([head, list]) =>
    `<span class="vtag">${esc(head)}${list.length ? ' <b>' + list.map(esc).join(' ') + '</b>' : ''}</span>`).join('');
}

// Seven bars, one per day. A flat number hides the shape of a week; three
// visits on Thursday and none otherwise is the thing worth seeing.
//
// Housekeepers only. This counts cleaning tasks, so on a tukang's card "No
// visits this week" would imply he is idle when he simply does a different
// kind of work — his jobs live on maintenance tickets.
function loadBars(entry, from) {
  if (!from) return '';
  const e = entry || { total: 0, days: {} };
  const days = [];
  for (let i = 0; i < 7; i++) days.push(new Date(Date.parse(from) + i * 86400e3).toISOString().slice(0, 10));
  // Scaled against three visits, not against this person's own maximum, so
  // the bars mean the same thing on every card. A relative scale would make
  // one quiet visit look identical to a brutal day.
  const busy = 3;
  const bars = days.map(d => {
    const n = e.days[d] || 0;
    const h = n ? Math.max(6, Math.round(Math.min(n, busy) / busy * 26)) : 2;
    return `<i style="height:${h}px" class="${n ? (n >= busy ? 'hot' : '') : 'nil'}" title="${d}: ${n} visit${n === 1 ? '' : 's'}"></i>`;
  }).join('');
  const dl = days.map(d => `<span>${['S', 'M', 'T', 'W', 'T', 'F', 'S'][new Date(d + 'T00:00:00Z').getUTCDay()]}</span>`).join('');
  return `<div class="pload">
    <div class="lab">${e.total ? `<b>${e.total}</b> visit${e.total === 1 ? '' : 's'} this week` : 'No visits this week'}</div>
    <div class="bars">${bars}</div><div class="dl">${dl}</div>
  </div>`;
}

function personCard(p, load, showLoad) {
  const roles = (p.roles || []).map(r => `<span class="tag role">${esc(ROLE_LABEL[r] || r)}</span>`).join('');
  const trades = realTrades(p).map(t => `<span class="tag job">${esc(TRADE_LABEL[t] || t)}</span>`).join('');
  const villas = (p.slugs || []).length ? groupedVillas(p.slugs) : `<span class="vtag all">Every villa</span>`;
  return `<div class="pcard${p.active ? '' : ' off'}">
    <div class="ph">
      <div class="pn">${esc(p.name)}<small>${esc(waPretty(p.wa_num))}</small></div>
      ${p.pay_type === 'per_job' ? '<span class="tag job">Vendor</span>' : ''}
    </div>
    <div class="pr">${roles}${trades}</div>
    <div class="pv">${villas}</div>
    ${showLoad ? loadBars(load[p.id], load.__from) : ''}
    ${p.notes ? `<div class="pnote">${esc(p.notes)}</div>` : ''}
    <div class="pa">
      <button class="btn ghost" onclick="staffEdit(${p.id})">Edit</button>
      ${p.active ? `<button class="btn ghost" onclick="staffDeactivate(${p.id})">Remove</button>` : ''}
    </div>
  </div>`;
}

// The one form, used by the Team tab and by quick-add from any picker.
function staffFormHtml(p, opts) {
  const o = opts || {};
  const sel = p || {};
  const roles = sel.roles || (o.role ? [o.role] : []);
  const trades = sel.trades || [];
  const slugs = sel.slugs || (o.slug ? [o.slug] : []);
  const units = staffData?.units || [];
  const box = (name, val, label, checked) =>
    `<label><input type="checkbox" name="${name}" value="${esc(val)}"${checked ? ' checked' : ''}>${esc(label)}</label>`;
  return `<h3>${p ? 'Edit ' + esc(p.name) : 'Add someone to the team'}</h3>
    <p>${p ? 'Changes apply the next time Maya messages them.' : 'Only a name and a WhatsApp number are needed. The rest can wait.'}</p>
    <div class="fld"><label>Name</label>
      <input type="text" id="sf-name" value="${esc(sel.name || '')}" placeholder="e.g. Gede"></div>
    <div class="fld"><label>WhatsApp number</label>
      <input type="text" id="sf-wa" value="${esc(sel.wa_num ? waPretty(sel.wa_num) : '')}" placeholder="+62 858-4716-3053">
      <div class="hint">Any format. Maya matches on the digits.</div></div>
    <div class="fld"><label>What they do</label>
      <div class="opts">${ROLES.map(r => box('sf-role', r, ROLE_LABEL[r], roles.includes(r))).join('')}</div></div>
    <div class="fld"><label>Repairs they handle</label>
      <div class="opts">${TRADES.map(t => box('sf-trade', t, TRADE_LABEL[t], trades.includes(t))).join('')}</div>
      <div class="hint">Only for a tukang. It decides who is suggested first on a repair.</div></div>
    <div class="fld"><label>Villas they cover</label>
      <div class="opts">${units.map(u => box('sf-slug', u.slug, pname(u.name), slugs.includes(u.slug))).join('')}</div>
      <div class="hint">Leave all unticked for someone who works across every villa, like the pool man or a tukang.</div></div>
    <div class="fld"><label>How they are paid</label>
      <select id="sf-pay">
        <option value="salaried"${sel.pay_type !== 'per_job' ? ' selected' : ''}>Monthly salary · appears on payroll</option>
        <option value="per_job"${sel.pay_type === 'per_job' ? ' selected' : ''}>Per job · invoices as a maintenance cost</option>
      </select>
      <div class="hint">A per-job vendor never reaches the payroll run: their bills are already charged to the villa as a repair.</div></div>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="sf-save" onclick="staffSave(${sel.id || 'null'}, ${o.pickerId ? `'${esc(o.pickerId)}'` : 'null'})">${p ? 'Save' : 'Add'}</button>
    </div>`;
}

function staffEdit(id) {
  const p = id ? (staffData?.staff || []).find(x => x.id === id) : null;
  modal(staffFormHtml(p, {}), { wide: true });
}

async function staffSave(id, pickerId) {
  const picked = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
  const body = {
    id: id || undefined,
    name: document.getElementById('sf-name').value.trim(),
    wa_num: document.getElementById('sf-wa').value.trim(),
    roles: picked('sf-role'),
    trades: picked('sf-trade'),
    slugs: picked('sf-slug'),
    pay_type: document.getElementById('sf-pay').value,
  };
  if (!body.name) { showToast('A name is needed.', 'error'); return; }
  if (!body.wa_num.replace(/\D/g, '')) { showToast('A WhatsApp number is needed.', 'error'); return; }
  const btn = document.getElementById('sf-save');
  if (btn) btn.disabled = true;
  try {
    const out = await staffApi('staff_upsert', body);
    closeModal();
    showToast(out.merged ? `That number was already ${out.previous_name || 'someone'}'s, so their record was updated instead of adding a second one.`
      : out.created ? 'Added to the team.' : 'Saved.', 'success');
    await refreshStaff(true);
    // Quick-add from a picker: select the new person there rather than
    // making Era find them in a list she has just left.
    if (pickerId && out.staff) {
      const sel = document.getElementById(pickerId);
      if (sel) { staffFillPicker(sel); sel.value = String(out.staff.id); sel.dispatchEvent(new Event('change', { bubbles: true })); }
      return;
    }
    if ((location.hash || '') === '#/staff') renderStaff();
  } catch (e) {
    if (btn) btn.disabled = false;
    if (e.message !== 'unauthorized') showToast(e.message, 'error');
  }
}

async function staffDeactivate(id) {
  const p = (staffData?.staff || []).find(x => x.id === id);
  modal(`<h3>Remove ${esc(p?.name || 'this person')} from the team?</h3>
    <p>They stop appearing on schedules and Maya stops messaging them. Their name stays on past repairs and payroll runs, and you can add them back at any time.</p>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Keep them</button>
    <button class="btn primary" onclick="doStaffDeactivate(${id})">Remove</button></div>`);
}
async function doStaffDeactivate(id) {
  closeModal();
  try { await staffApi('staff_deactivate', { id }); await refreshStaff(true); renderStaff(); }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// ── Staff picker ─────────────────────────────────────────────────────
// Anywhere a person is chosen, the list ends with "Add someone new" so Era
// can register the man standing in front of her without leaving the ticket.
// Used by the Team tab today; tukang dispatch and the cleaning schedule
// call the same helper.
function staffPickerHtml(pickerId, opts) {
  const o = opts || {};
  return `<select id="${esc(pickerId)}" class="flt" onchange="staffPickerChanged(this, ${JSON.stringify(o).replace(/"/g, '&quot;')})">
    <option value="">${esc(o.placeholder || 'Choose someone…')}</option>
  </select>`;
}
// Filled from staffData so the caller does not have to wait on a fetch to
// paint its row.
function staffFillPicker(sel, opts) {
  const o = opts || (sel._staffOpts || {});
  sel._staffOpts = o;
  const keep = sel.value;
  const people = (staffData?.staff || []).filter(p =>
    p.active && (!o.role || (p.roles || []).includes(o.role)));
  // Coverage and trade are a SORT, never a filter. Filtering by villa would
  // empty the dropdown for a unit nobody covers, and hide every possible
  // stand-in on the morning a housekeeper calls in sick — precisely when
  // Era needs the list most.
  const covers = (p) => !!(o.slug && (p.slugs || []).includes(o.slug));
  const score = (p) => (covers(p) ? -2 : 0) + (o.trade && (p.trades || []).includes(o.trade) ? -1 : 0);
  people.sort((a, b) => score(a) - score(b) || String(a.name).localeCompare(String(b.name)));
  sel.innerHTML = `<option value="">${o.placeholder || 'Choose someone…'}</option>`
    // Full trade list here, including one that repeats the role: in the
    // roster "Pool · Pool" is noise, but in a dropdown for a pool repair it
    // is the reason this person is at the top. And when a villa is not
    // normally theirs, say so, so a stand-in is a deliberate choice rather
    // than a mis-click.
    + people.map(p => {
        const t = p.trades || [];
        const why = t.length ? ' · ' + t.map(x => TRADE_LABEL[x] || x).join(', ')
          : (o.slug && !covers(p) ? ' · not their villa' : '');
        return `<option value="${p.id}">${esc(p.name)}${esc(why)}</option>`;
      }).join('')
    + `<option value="__new__">+ Add someone new…</option>`;
  if (keep) sel.value = keep;
}
function staffPickerChanged(sel, opts) {
  if (sel.value !== '__new__') return;
  sel.value = '';
  modal(staffFormHtml(null, { ...(opts || {}), pickerId: sel.id }), { wide: true });
}

// ── Boot ─────────────────────────────────────────────────────────────
if (adminPw) boot(); else showGate();
