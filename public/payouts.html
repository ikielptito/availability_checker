// ── Cleaning ─────────────────────────────────────────────────────────
// The schedule, derived from the booking calendar every hour and sent to the
// housekeepers each morning. Era's job here is exceptions: reassign when
// someone is off, move a visit, mark one done or skipped.
let hkData = null;

const HK_KIND = {
  turnover:      ['Turnover', 'a tenant left'],
  regular:       ['Regular clean', 'twice a week'],
  pre_arrival:   ['Before arrival', 'after a vacancy'],
  inspection:    ['Inspection', 'photos for the owner report'],
};
const HK_STATUS = {
  planned:   ['wait', 'Planned'],
  notified:  ['ok',   'Sent'],
  confirmed: ['ok',   'Confirmed'],
  done:      ['done', 'Done'],
  skipped:   ['no',   'Skipped'],
};

async function hkApi(action, payload) {
  const r = await fetch('/api/housekeeping', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

const hkName = (slug) => (hkData?.names || {})[slug] || unitName(slug);
const hkDay = (d) => new Date(d + 'T00:00:00Z')
  .toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });

async function renderCleaning() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading the schedule…</div>';
  try { [hkData] = await Promise.all([hkApi('hk_schedule', {}), refreshStaff().catch(() => {})]); }
  catch (e) { if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red"><div>${esc(e.message)}</div></div>`; return; }

  // Sorted here as well as in the query: the view groups consecutive dates
  // under one heading, so anything out of order silently prints the same day
  // twice and reads as two different days.
  const tasks = [...(hkData.tasks || [])].sort((a, b) =>
    a.task_date.localeCompare(b.task_date) || String(a.slug).localeCompare(String(b.slug)));
  const today = hkData.today;
  const badge = document.getElementById('hk-badge');
  const todayCount = tasks.filter(t => t.task_date === today && t.status !== 'done' && t.status !== 'skipped').length;
  if (badge) { badge.textContent = todayCount; badge.style.display = todayCount ? '' : 'none'; }

  let html = `<div class="crumb">Cleaning</div>`;
  html += `<div class="banner ${hkData.unassigned ? 'amber' : 'calm'}"><div>
    <b>${todayCount}</b> today · <b>${tasks.length}</b> in the next three weeks${hkData.unassigned ? ` · <b>${hkData.unassigned}</b> with nobody assigned` : ''}
    <div style="margin-top:5px;font-size:.76rem">Built from the booking calendar every hour. Each housekeeper gets her day in the morning and her week on Monday.</div>
  </div></div>`;
  html += `<div class="actionsrow" style="margin-bottom:14px">
    <button class="btn ghost" onclick="hkCareEdit()">Cleaning days</button>
    <button class="btn ghost" onclick="hkGenerate()">Rebuild from the calendar</button>
  </div>`;

  if (!tasks.length) {
    html += `<div class="empty-state" style="padding:34px">Nothing scheduled. If this looks wrong, rebuild from the calendar: the villas may have no bookings, or the Hostex feed may be unreachable.</div>`;
    c.innerHTML = html; return;
  }

  let lastDate = null;
  for (const t of tasks) {
    if (t.task_date !== lastDate) {
      lastDate = t.task_date;
      const rel = t.task_date === today ? ' · today' : '';
      html += `<div class="periodhead"><h2>${esc(hkDay(t.task_date))}${rel}</h2></div>`;
    }
    const [kindCls, kindWhy] = [HK_KIND[t.kind]?.[0] || t.kind, HK_KIND[t.kind]?.[1] || ''];
    const [stCls, stLabel] = HK_STATUS[t.status] || ['wait', t.status];
    html += `<div class="strow" style="cursor:default">
      <div class="nm">${esc(hkName(t.slug))}
        <small>${esc(kindCls)}${kindWhy ? ' · ' + esc(kindWhy) : ''}${t.same_day ? ' · next tenant arrives the same day' : ''}</small></div>
      <div style="min-width:150px">
        <select class="flt" id="hk-who-${t.id}" onchange="hkReassign(${t.id}, this.value)"></select>
      </div>
      <span class="pill ${stCls}">${esc(stLabel)}</span>
      <div class="stfacts">
        ${t.status !== 'done' ? `<button class="btn ghost" onclick="hkStatus(${t.id}, 'done')">Done</button>` : ''}
        ${t.status !== 'skipped' ? `<button class="btn ghost" onclick="hkStatus(${t.id}, 'skipped')">Skip</button>` : ''}
      </div>
    </div>`;
  }
  c.innerHTML = html;

  // The same picker as everywhere else, so a stand-in cleaner can be added
  // without leaving the schedule.
  for (const t of tasks) {
    const sel = document.getElementById('hk-who-' + t.id);
    if (!sel) continue;
    staffFillPicker(sel, { role: 'housekeeper', slug: t.slug, placeholder: 'Nobody assigned' });
    if (t.assigned_staff_id) sel.value = String(t.assigned_staff_id);
  }
}

// Which weekdays each villa is cleaned on. Two a week is the service, but
// the DAYS differ per villa deliberately: putting all four Tropicanas on
// Monday and Thursday would give Gede two impossible mornings and four idle
// days. Postgres day numbering, 0 = Sunday.
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

async function hkCareEdit() {
  let care = [];
  try { care = (await hkApi('hk_care', {})).care || []; }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); return; }

  const byslug = Object.fromEntries(care.map(c => [c.slug, c]));
  const units = (staffData?.units || []).map(u => u.slug);
  const rows = (units.length ? units : care.map(c => c.slug)).map(slug => {
    const days = byslug[slug]?.clean_days || [];
    const toggles = DOW.map((d, i) =>
      `<label class="daybox"><input type="checkbox" data-slug="${esc(slug)}" value="${i}"${days.includes(i) ? ' checked' : ''}>${d[0]}</label>`).join('');
    return `<div class="careline"><span class="cn">${esc(hkName(slug))}</span><span class="cd">${toggles}</span></div>`;
  }).join('');

  modal(`<h3>Cleaning days</h3>
    <p>The twice-weekly clean each villa gets, whether or not anyone is staying. Spread the days so one housekeeper is not doing four villas on one morning.</p>
    <div class="carewrap">${rows}</div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="care-save" onclick="hkCareSave()">Save</button></div>`, { wide: true });
}

async function hkCareSave() {
  const bySlug = {};
  document.querySelectorAll('.carewrap input[type=checkbox]').forEach(el => {
    (bySlug[el.dataset.slug] ||= []);
    if (el.checked) bySlug[el.dataset.slug].push(Number(el.value));
  });
  const btn = document.getElementById('care-save');
  if (btn) btn.disabled = true;
  try {
    for (const [slug, clean_days] of Object.entries(bySlug)) {
      await hkApi('hk_care_patch', { slug, clean_days });
    }
    closeModal();
    // Changing the days only alters visits nobody has been told about, so a
    // rebuild here is safe and makes the effect immediately visible.
    const out = await hkApi('hk_replan', {});
    showToast(`Saved. Schedule rebuilt: ${out.created || 0} visits.`, 'success');
    renderCleaning();
  } catch (e) {
    if (btn) btn.disabled = false;
    if (e.message !== 'unauthorized') showToast(e.message, 'error');
  }
}

async function hkGenerate() {
  try {
    const out = await hkApi('hk_generate', {});
    showToast(out.skipped ? out.skipped
      : `${out.created || 0} new task${out.created === 1 ? '' : 's'} from ${out.planned || 0} planned visits.`,
      out.skipped || out.error ? 'error' : 'success');
    renderCleaning();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}
async function hkReassign(id, staffId) {
  if (staffId === '__new__') return;    // the quick-add form handles this
  try {
    await hkApi('hk_patch', { id, fields: { assigned_staff_id: staffId ? Number(staffId) : null } });
    showToast('Reassigned.', 'success');
    renderCleaning();
  } catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}
async function hkStatus(id, status) {
  try { await hkApi('hk_status', { id, status }); renderCleaning(); }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// ── Team ─────────────────────────────────────────────────────────────
// The staff registry. Maintenance dispatch, housekeeping schedules and
// payroll all read this one list, so a person is corrected here once
// instead of in three places that quietly drift apart.
let staffData = null;   // { staff: [], units: [] }

const ROLES  = ['housekeeper', 'pool', 'gardener', 'tukang', 'manager'];
const TRADES = ['aircon', 'electrical', 'plumbing', 'carpentry', 'pool', 'paint', 'general'];
const ROLE_LABEL = { housekeeper: 'Housekeeper', pool: 'Pool', gardener: 'Gardener', tukang: 'Tukang', manager: 'Manager' };
const TRADE_LABEL = { aircon: 'AC', electrical: 'Electrical', plumbing: 'Plumbing', carpentry: 'Carpentry', pool: 'Pool', paint: 'Paint', general: 'General' };

async function staffApi(action, payload) {
  const r = await fetch('/api/staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminPw },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  if (r.status === 401) { showGate('Session expired. Please log in again.'); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

async function refreshStaff(force) {
  if (staffData && !force) return staffData;
  staffData = await staffApi('staff_list', {});
  return staffData;
}

// Not every slug is a catalog unit: Astanine is Ikiel's own villa, it carries
// staff but has no listing, so it is stored as a plain slug.
const unitName = (slug) => {
  const u = (staffData?.units || []).find(x => x.slug === slug);
  if (u) return pname(u.name);
  return String(slug || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
};
// A trade that just restates the role ("Pool" on the pool man) is noise.
const realTrades = (p) => (p.trades || []).filter(t => !(p.roles || []).includes(t));
// Era reads numbers off her phone, where they are spaced. Showing 11 bare
// digits makes checking one against a contact card needlessly hard.
function waPretty(n) {
  const d = String(n || '').replace(/\D/g, '');
  if (!d.startsWith('62') || d.length < 9) return d;
  const rest = d.slice(2);
  const parts = [rest.slice(0, 3)];
  for (let i = 3; i < rest.length; i += 4) parts.push(rest.slice(i, i + 4));
  return '+62 ' + parts.join('-');
}

async function renderStaff() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading the team…</div>';
  let load = {};
  try {
    await refreshStaff(true);
    // This week's visit count per person. Without it the page is inert
    // reference data; with it, it answers the question Era actually has,
    // which is whether anyone's week is unmanageable.
    const sched = await hkApi('hk_schedule', {}).catch(() => null);
    if (sched?.tasks) {
      const end = new Date(Date.parse(sched.today) + 7 * 86400e3).toISOString().slice(0, 10);
      for (const t of sched.tasks) {
        if (t.task_date >= sched.today && t.task_date < end && t.assigned_staff_id) {
          (load[t.assigned_staff_id] ||= { total: 0, days: {} });
          load[t.assigned_staff_id].total++;
          load[t.assigned_staff_id].days[t.task_date] = (load[t.assigned_staff_id].days[t.task_date] || 0) + 1;
        }
      }
      load.__from = sched.today;
    }
  } catch (e) {
    if (e.message !== 'unauthorized') c.innerHTML = `<div class="banner red"><div>${esc(e.message)}</div></div>`;
    return;
  }

  const people = staffData.staff || [];
  const units = staffData.units || [];
  const live = people.filter(p => p.active);
  const hk = (p) => (p.roles || []).includes('housekeeper');
  const gaps = units.filter(u => !live.some(p => hk(p) && (p.slugs || []).includes(u.slug)));

  let html = `<div class="crumb">Team</div>`;

  // Coverage as an EXCEPTION, not a list. Fourteen rows to report that
  // nothing is wrong is fourteen rows of noise; the only state worth space
  // on the page is the one that needs acting on.
  html += gaps.length
    ? `<div class="banner amber"><div><b>${gaps.length} villa${gaps.length > 1 ? 's have' : ' has'} no housekeeper.</b>
        ${gaps.map(u => esc(pname(u.name))).join(', ')} — cleaning tasks there will have nobody to notify.</div></div>`
    : `<div class="banner calm"><div><b>${live.length} on the team.</b> Every villa has a housekeeper.
        <div style="margin-top:5px;font-size:.76rem">Everyone Maya can message: they can send her maintenance photos, be assigned a repair, and appear on the cleaning schedule.</div></div></div>`;

  html += `<div class="actionsrow" style="margin-bottom:16px">
    <button class="btn primary" onclick="staffEdit(null)">Add someone</button></div>`;

  if (!people.length) {
    html += `<div class="empty-state" style="padding:34px">Nobody in the register yet. Add Era's housekeepers and the tukang you call, and Maya can start messaging them.</div>`;
    c.innerHTML = html; return;
  }

  // Grouped by what someone is FOR, because that is how Era looks for them:
  // she needs a cleaner, or she needs someone to fix a tap.
  const groups = [
    ['Housekeeping', live.filter(hk)],
    ['Repairs and pool', live.filter(p => !hk(p) && ((p.roles || []).includes('tukang') || (p.roles || []).includes('pool') || (p.roles || []).includes('gardener')))],
    ['Office', live.filter(p => !hk(p) && (p.roles || []).includes('manager'))],
  ];
  const placed = new Set(groups.flatMap(([, arr]) => arr.map(p => p.id)));
  const rest = live.filter(p => !placed.has(p.id));
  if (rest.length) groups.push(['Everyone else', rest]);
  const inactive = people.filter(p => !p.active);
  if (inactive.length) groups.push(['No longer with us', inactive]);

  for (const [label, arr] of groups) {
    if (!arr.length) continue;
    html += `<div class="grouphead">${esc(label)}<span>${arr.length}</span></div><div class="pgrid">`;
    html += arr.sort((a, b) => String(a.name).localeCompare(String(b.name))).map(p => personCard(p, load, hk(p))).join('');
    html += `</div>`;
  }
  c.innerHTML = html;
}

// "HAUS Canggu · Unit 1", "· Unit 2", "· Unit 4"… repeated down a page is
// almost all redundancy. Collapsing to "HAUS Canggu 1 2 4" says the same
// thing in a quarter of the space and is easier to scan.
function groupedVillas(slugs) {
  const out = new Map();
  for (const slug of slugs) {
    const full = unitName(slug);
    const m = full.match(/^(.*?)\s*·\s*Unit\s*(.+)$/i);
    const [head, unit] = m ? [m[1].trim(), m[2].trim()] : [full, null];
    if (!out.has(head)) out.set(head, []);
    if (unit) out.get(head).push(unit);
  }
  return [...out.entries()].map(([head, list]) =>
    `<span class="vtag">${esc(head)}${list.length ? ' <b>' + list.map(esc).join(' ') + '</b>' : ''}</span>`).join('');
}

// Seven bars, one per day. A flat number hides the shape of a week; three
// visits on Thursday and none otherwise is the thing worth seeing.
//
// Housekeepers only. This counts cleaning tasks, so on a tukang's card "No
// visits this week" would imply he is idle when he simply does a different
// kind of work — his jobs live on maintenance tickets.
function loadBars(entry, from) {
  if (!from) return '';
  const e = entry || { total: 0, days: {} };
  const days = [];
  for (let i = 0; i < 7; i++) days.push(new Date(Date.parse(from) + i * 86400e3).toISOString().slice(0, 10));
  // Scaled against three visits, not against this person's own maximum, so
  // the bars mean the same thing on every card. A relative scale would make
  // one quiet visit look identical to a brutal day.
  const busy = 3;
  const bars = days.map(d => {
    const n = e.days[d] || 0;
    const h = n ? Math.max(6, Math.round(Math.min(n, busy) / busy * 26)) : 2;
    return `<i style="height:${h}px" class="${n ? (n >= busy ? 'hot' : '') : 'nil'}" title="${d}: ${n} visit${n === 1 ? '' : 's'}"></i>`;
  }).join('');
  const dl = days.map(d => `<span>${['S', 'M', 'T', 'W', 'T', 'F', 'S'][new Date(d + 'T00:00:00Z').getUTCDay()]}</span>`).join('');
  return `<div class="pload">
    <div class="lab">${e.total ? `<b>${e.total}</b> visit${e.total === 1 ? '' : 's'} this week` : 'No visits this week'}</div>
    <div class="bars">${bars}</div><div class="dl">${dl}</div>
  </div>`;
}

function personCard(p, load, showLoad) {
  const roles = (p.roles || []).map(r => `<span class="tag role">${esc(ROLE_LABEL[r] || r)}</span>`).join('');
  const trades = realTrades(p).map(t => `<span class="tag job">${esc(TRADE_LABEL[t] || t)}</span>`).join('');
  const villas = (p.slugs || []).length ? groupedVillas(p.slugs) : `<span class="vtag all">Every villa</span>`;
  return `<div class="pcard${p.active ? '' : ' off'}">
    <div class="ph">
      <div class="pn">${esc(p.name)}<small>${esc(waPretty(p.wa_num))}</small></div>
      ${p.pay_type === 'per_job' ? '<span class="tag job">Vendor</span>' : ''}
    </div>
    <div class="pr">${roles}${trades}</div>
    <div class="pv">${villas}</div>
    ${showLoad ? loadBars(load[p.id], load.__from) : ''}
    ${p.notes ? `<div class="pnote">${esc(p.notes)}</div>` : ''}
    <div class="pa">
      <button class="btn ghost" onclick="staffEdit(${p.id})">Edit</button>
      ${p.active ? `<button class="btn ghost" onclick="staffDeactivate(${p.id})">Remove</button>` : ''}
    </div>
  </div>`;
}

// The one form, used by the Team tab and by quick-add from any picker.
function staffFormHtml(p, opts) {
  const o = opts || {};
  const sel = p || {};
  const roles = sel.roles || (o.role ? [o.role] : []);
  const trades = sel.trades || [];
  const slugs = sel.slugs || (o.slug ? [o.slug] : []);
  const units = staffData?.units || [];
  const box = (name, val, label, checked) =>
    `<label><input type="checkbox" name="${name}" value="${esc(val)}"${checked ? ' checked' : ''}>${esc(label)}</label>`;
  return `<h3>${p ? 'Edit ' + esc(p.name) : 'Add someone to the team'}</h3>
    <p>${p ? 'Changes apply the next time Maya messages them.' : 'Only a name and a WhatsApp number are needed. The rest can wait.'}</p>
    <div class="fld"><label>Name</label>
      <input type="text" id="sf-name" value="${esc(sel.name || '')}" placeholder="e.g. Gede"></div>
    <div class="fld"><label>WhatsApp number</label>
      <input type="text" id="sf-wa" value="${esc(sel.wa_num ? waPretty(sel.wa_num) : '')}" placeholder="+62 858-4716-3053">
      <div class="hint">Any format. Maya matches on the digits.</div></div>
    <div class="fld"><label>What they do</label>
      <div class="opts">${ROLES.map(r => box('sf-role', r, ROLE_LABEL[r], roles.includes(r))).join('')}</div></div>
    <div class="fld"><label>Repairs they handle</label>
      <div class="opts">${TRADES.map(t => box('sf-trade', t, TRADE_LABEL[t], trades.includes(t))).join('')}</div>
      <div class="hint">Only for a tukang. It decides who is suggested first on a repair.</div></div>
    <div class="fld"><label>Villas they cover</label>
      <div class="opts">${units.map(u => box('sf-slug', u.slug, pname(u.name), slugs.includes(u.slug))).join('')}</div>
      <div class="hint">Leave all unticked for someone who works across every villa, like the pool man or a tukang.</div></div>
    <div class="fld"><label>How they are paid</label>
      <select id="sf-pay">
        <option value="salaried"${sel.pay_type !== 'per_job' ? ' selected' : ''}>Monthly salary · appears on payroll</option>
        <option value="per_job"${sel.pay_type === 'per_job' ? ' selected' : ''}>Per job · invoices as a maintenance cost</option>
      </select>
      <div class="hint">A per-job vendor never reaches the payroll run: their bills are already charged to the villa as a repair.</div></div>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="sf-save" onclick="staffSave(${sel.id || 'null'}, ${o.pickerId ? `'${esc(o.pickerId)}'` : 'null'})">${p ? 'Save' : 'Add'}</button>
    </div>`;
}

function staffEdit(id) {
  const p = id ? (staffData?.staff || []).find(x => x.id === id) : null;
  modal(staffFormHtml(p, {}), { wide: true });
}

async function staffSave(id, pickerId) {
  const picked = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
  const body = {
    id: id || undefined,
    name: document.getElementById('sf-name').value.trim(),
    wa_num: document.getElementById('sf-wa').value.trim(),
    roles: picked('sf-role'),
    trades: picked('sf-trade'),
    slugs: picked('sf-slug'),
    pay_type: document.getElementById('sf-pay').value,
  };
  if (!body.name) { showToast('A name is needed.', 'error'); return; }
  if (!body.wa_num.replace(/\D/g, '')) { showToast('A WhatsApp number is needed.', 'error'); return; }
  const btn = document.getElementById('sf-save');
  if (btn) btn.disabled = true;
  try {
    const out = await staffApi('staff_upsert', body);
    closeModal();
    showToast(out.merged ? `That number was already ${out.previous_name || 'someone'}'s, so their record was updated instead of adding a second one.`
      : out.created ? 'Added to the team.' : 'Saved.', 'success');
    await refreshStaff(true);
    // Quick-add from a picker: select the new person there rather than
    // making Era find them in a list she has just left.
    if (pickerId && out.staff) {
      const sel = document.getElementById(pickerId);
      if (sel) { staffFillPicker(sel); sel.value = String(out.staff.id); sel.dispatchEvent(new Event('change', { bubbles: true })); }
      return;
    }
    if ((location.hash || '') === '#/staff') renderStaff();
  } catch (e) {
    if (btn) btn.disabled = false;
    if (e.message !== 'unauthorized') showToast(e.message, 'error');
  }
}

async function staffDeactivate(id) {
  const p = (staffData?.staff || []).find(x => x.id === id);
  modal(`<h3>Remove ${esc(p?.name || 'this person')} from the team?</h3>
    <p>They stop appearing on schedules and Maya stops messaging them. Their name stays on past repairs and payroll runs, and you can add them back at any time.</p>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Keep them</button>
    <button class="btn primary" onclick="doStaffDeactivate(${id})">Remove</button></div>`);
}
async function doStaffDeactivate(id) {
  closeModal();
  try { await staffApi('staff_deactivate', { id }); await refreshStaff(true); renderStaff(); }
  catch (e) { if (e.message !== 'unauthorized') showToast(e.message, 'error'); }
}

// ── Staff picker ─────────────────────────────────────────────────────
// Anywhere a person is chosen, the list ends with "Add someone new" so Era
// can register the man standing in front of her without leaving the ticket.
// Used by the Team tab today; tukang dispatch and the cleaning schedule
// call the same helper.
function staffPickerHtml(pickerId, opts) {
  const o = opts || {};
  return `<select id="${esc(pickerId)}" class="flt" onchange="staffPickerChanged(this, ${JSON.stringify(o).replace(/"/g, '&quot;')})">
    <option value="">${esc(o.placeholder || 'Choose someone…')}</option>
  </select>`;
}
// Filled from staffData so the caller does not have to wait on a fetch to
// paint its row.
function staffFillPicker(sel, opts) {
  const o = opts || (sel._staffOpts || {});
  sel._staffOpts = o;
  const keep = sel.value;
  const people = (staffData?.staff || []).filter(p =>
    p.active && (!o.role || (p.roles || []).includes(o.role)));
  // Coverage and trade are a SORT, never a filter. Filtering by villa would
  // empty the dropdown for a unit nobody covers, and hide every possible
  // stand-in on the morning a housekeeper calls in sick — precisely when
  // Era needs the list most.
  const covers = (p) => !!(o.slug && (p.slugs || []).includes(o.slug));
  const score = (p) => (covers(p) ? -2 : 0) + (o.trade && (p.trades || []).includes(o.trade) ? -1 : 0);
  people.sort((a, b) => score(a) - score(b) || String(a.name).localeCompare(String(b.name)));
  sel.innerHTML = `<option value="">${o.placeholder || 'Choose someone…'}</option>`
    // Full trade list here, including one that repeats the role: in the
    // roster "Pool · Pool" is noise, but in a dropdown for a pool repair it
    // is the reason this person is at the top. And when a villa is not
    // normally theirs, say so, so a stand-in is a deliberate choice rather
    // than a mis-click.
    + people.map(p => {
        const t = p.trades || [];
        const why = t.length ? ' · ' + t.map(x => TRADE_LABEL[x] || x).join(', ')
          : (o.slug && !covers(p) ? ' · not their villa' : '');
        return `<option value="${p.id}">${esc(p.name)}${esc(why)}</option>`;
      }).join('')
    + `<option value="__new__">+ Add someone new…</option>`;
  if (keep) sel.value = keep;
}
function staffPickerChanged(sel, opts) {
  if (sel.value !== '__new__') return;
  sel.value = '';
  modal(staffFormHtml(null, { ...(opts || {}), pickerId: sel.id }), { wide: true });
}

// ── Boot ─────────────────────────────────────────────────────────────
if (adminPw) boot(); else showGate();
</script>
</body>
