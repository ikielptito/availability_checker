<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly statement · Samba</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/brand.css">
<script src="/shared.js"></script>
<style>
/* The statement is a serif financial artefact — same document family as the
   weekly report page (report-view.html). Core tokens come from brand.css. */
:root{--accent-soft:var(--sb-terracotta-050);--green:var(--sb-success-fg);--red:var(--sb-error-fg);--yellow:#B8860B;--st-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:clamp(14px,4vw,40px) 14px 60px;}
.brand{max-width:820px;margin:0 auto 18px;display:flex;align-items:center;gap:9px;}
.brand .mark{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--st-serif);font-weight:600;font-size:15px;}
.brand .wm{font-family:var(--st-serif);font-size:1.15rem;letter-spacing:.02em;color:var(--text);}
.brand .wm small{display:block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;margin-top:1px;}
.loading{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:56px 24px;text-align:center;color:var(--muted);font-size:.9rem;}
.st-empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted);max-width:820px;margin:0 auto;}
.st-empty h3{font-family:var(--st-serif);color:var(--text);font-size:1.2rem;margin:0 0 7px;}

.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-width:820px;margin:0 auto;}
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface2);}
.mast .rl{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600;}
.mast .rr{text-align:right;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.mast .rr b{display:block;color:var(--text-2);font-size:.74rem;}
.pad{padding:26px 28px;}
.pad+.pad{border-top:1px solid var(--border);}
.eyebrow{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;}
.title{font-family:var(--st-serif);font-weight:500;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em;color:var(--text);}
.subrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:10px;}
.paidchip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px;background:#e2ede0;color:var(--green);}
.duechip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}

.payout{margin-top:20px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:18px 20px;}
.payout .pl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.payout .pv{font-family:var(--st-serif);font-size:2.5rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.payout .ps{margin-top:9px;font-size:.76rem;color:var(--muted);}

.sec-h{font-family:var(--st-serif);font-weight:500;font-size:1.3rem;color:var(--text);margin-bottom:14px;}
.sec-h small{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:.7rem;color:var(--muted);margin-left:8px;letter-spacing:.04em;}
.tblwrap{overflow-x:auto;}
table.st{width:100%;border-collapse:collapse;font-size:.8rem;}
table.st th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--border);}
table.st td{padding:8px 9px;border-bottom:1px dashed var(--border);vertical-align:top;}
table.st tr:last-child td{border-bottom:none;}
table.st td.num,table.st th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
table.st tr.tot td{border-top:1px solid var(--border);border-bottom:none;font-weight:700;background:var(--surface2);}
.unit-h{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px;}
.unit-h:first-child{margin-top:0;}

.mathline{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.86rem;}
.mathline:last-child{border-bottom:none;}
.mathline .mk{color:var(--text-2);}
.mathline .mv{font-weight:600;font-variant-numeric:tabular-nums;}
.mathline.grand{font-family:var(--st-serif);font-size:1.15rem;padding-top:12px;}
.mathline.grand .mv{color:var(--accent);font-weight:500;}

.hxgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
@media(min-width:560px){.hxgrid{grid-template-columns:repeat(4,1fr);}}
.hxc{background:var(--surface);padding:15px 15px 13px;}
.hxc .kl{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.hxc .kv{font-family:var(--st-serif);font-size:1.7rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.hxc .kv small{font-size:.85rem;color:var(--muted);}
.hxc .kc{margin-top:6px;font-size:.66rem;color:var(--muted);}
.chmix{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
.chrow{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:.76rem;color:var(--text-2);}
.chrow .bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;}
.chrow .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;}
.chrow .n{font-variant-numeric:tabular-nums;color:var(--muted);}

.proof{margin-top:14px;}
.proof img{max-width:100%;border-radius:11px;border:1px solid var(--border);}
.foot{padding:20px 28px;border-top:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.fmeta{font-size:.68rem;color:var(--muted);line-height:1.6;}
.foot-cta{max-width:820px;margin:20px auto 0;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.7;}
.foot-cta a{color:var(--accent);}

@media print{
  body{background:#fff;padding:0;}
  .sheet{border:none;box-shadow:none;border-radius:0;max-width:none;}
  .foot-cta{display:none;}
  .pad{break-inside:avoid;}
}
</style>
</head>
<body>

<div class="brand">
  <div class="mark">S</div>
  <div class="wm">Samba <small>Realty · Owner statement</small></div>
</div>

<div class="loading" id="loading">Opening your statement…</div>
<div id="root"></div>

<div class="foot-cta" id="footcta" style="display:none">
  Questions about this statement? Reply to Maya on WhatsApp — she'll get you an answer.<br>
  This is a private link for you; the numbers are frozen as published by Samba Realty.
</div>

<script>
'use strict';
// ── Reference currency (display convenience ONLY — payouts are in IDR) ──
const CURS = {
  IDR: { sym: 'IDR ', dec: 0 }, USD: { sym: '$', dec: 2 }, EUR: { sym: '€', dec: 2 },
  GBP: { sym: '£', dec: 2 }, AUD: { sym: 'A$', dec: 2 }, SGD: { sym: 'S$', dec: 2 },
};
let CUR = 'IDR', FX = null, DATA = null, HXSEL = 'group';
try { const saved = localStorage.getItem('samba_stmt_cur'); if (saved && CURS[saved]) CUR = saved; } catch {}
const conv = (n) => (CUR === 'IDR' || !FX?.rates?.[CUR]) ? (Number(n) || 0) : (Number(n) || 0) * FX.rates[CUR];
const fmt = (n) => { const c = CURS[CUR] || CURS.IDR; return conv(n).toLocaleString('en-US', { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec }); };
const IDR = (n) => (CURS[CUR] || CURS.IDR).sym + fmt(n);
const mval = (n) => fmt(n);
function setCur(c) {
  CUR = CURS[c] ? c : 'IDR';
  try { localStorage.setItem('samba_stmt_cur', CUR); } catch {}
  if (DATA) render(DATA);
}
function setHx(k) { HXSEL = k; if (DATA) render(DATA); }
// Direct bookings are Samba bookings — say so on the owner's document.
// (Owner stays keep Era's wording; those aren't Samba-sourced revenue.)
const platformLabel = (p) => /direct/i.test(p || '') && !/owner/i.test(p || '') ? 'Samba' : (p || '—');
// Channel keys inside already-frozen Hostex snapshots may carry pre-relabel
// names ("Direct", "Hostex_direct") — normalize at display time.
const chLabel = (k) => /direct|hostex/i.test(k) ? 'Samba' : k;
const dstr = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

function fail(title, msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('root').innerHTML =
    `<div class="st-empty"><h3>${esc(title)}</h3><div>${esc(msg)}</div></div>`;
}

async function boot() {
  const m = location.pathname.match(/\/st\/(.+)$/);
  const token = m ? decodeURIComponent(m[1]) : '';
  if (!token) return fail('Statement link missing', 'Open this page from the link Maya sent you on WhatsApp.');
  let d;
  try {
    const r = await fetch('/api/statements?action=public-statement&token=' + encodeURIComponent(token));
    d = await r.json();
    if (!r.ok) return fail(r.status === 403 ? 'Invalid statement link' : 'Statement unavailable', 'Please open the exact link Maya sent you on WhatsApp — or reply to her there and she\'ll send a fresh one.');
  } catch {
    return fail('Connection problem', 'Could not load your statement — check your connection and try again.');
  }
  DATA = d;
  FX = d.fx || null;
  if (CUR !== 'IDR' && !FX?.rates?.[CUR]) CUR = 'IDR';   // saved choice no longer available
  render(d);
}

function render(d) {
  const t = d.totals || {};
  const bookings = (d.lines || []).filter(l => l.kind === 'booking');
  const expenses = (d.lines || []).filter(l => l.kind === 'expense');
  const adjustments = (d.lines || []).filter(l => l.kind === 'adjustment');
  const units = [...new Set(bookings.map(b => b.unit_name || ''))];
  const paid = d.status === 'paid';
  const partial = d.status === 'partial';
  const balance = Number(t.balance) || 0;
  const paidTotal = Number(t.paid) || 0;

  let html = `<div class="sheet">
    <div class="mast">
      <div class="rl">Monthly owner statement</div>
      <div class="rr">Prepared by<b>Samba Realty · Bali</b></div>
    </div>
    <div class="pad">
      <div class="eyebrow">${esc(d.period_label || d.period)}</div>
      <div class="title">${esc(d.group?.name || '')}</div>
      <div class="subrow">
        ${d.group?.owner_names ? `<span>For ${esc(d.group.owner_names)}</span>` : ''}
        ${paid ? `<span class="paidchip">✓ Paid ${esc(dstr(d.paid_at))}</span>` : partial ? `<span class="duechip">Partially paid · ${IDR(balance)} to follow</span>` : `<span class="duechip">Payout on its way</span>`}
        ${FX && Object.keys(FX.rates || {}).length ? `<span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)">View in
          <select onchange="setCur(this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:.74rem">
            ${['IDR', ...Object.keys(FX.rates)].map(c => `<option value="${c}"${c === CUR ? ' selected' : ''}>${c}</option>`).join('')}
          </select></span>` : ''}
      </div>
      ${CUR !== 'IDR' ? `<div style="margin-top:10px;font-size:.7rem;color:var(--muted);background:var(--surface2);border:1px dashed var(--border);border-radius:9px;padding:8px 12px">≈ Approximate ${esc(CUR)} amounts for reference only (rate as of ${esc(FX?.as_of || 'today')}). All payouts are made in IDR.</div>` : ''}
      ${(() => {
        // The hero figure is whatever matters MOST right now: what's still
        // owed while payments are in flight, the settled total once paid,
        // the deficit when a month closed negative.
        const deficit = Number(t.payout) < 0;
        const h = deficit
          ? { label: 'This month closed in deficit', value: t.payout, sub: `Villa expenses exceeded rental income in ${esc(d.period_label || '')}. Samba Realty covers the shortfall — it carries into your next statement and is repaid from future rental revenue.` }
          : paid
            ? { label: 'Total payout to you — settled in full', value: t.payout, sub: `Paid in full on ${esc(dstr(d.paid_at))}. Rental income after the Samba management fee and villa expenses${Number(t.adjustments) ? ' and adjustments' : ''}, ${esc(d.period_label || '')}.` }
            : partial
              ? { label: 'Balance owed to you', value: balance, sub: `${IDR(paidTotal)} of the ${IDR(t.payout)} total for ${esc(d.period_label || '')} has already been transferred — this is what's still on its way.` }
              : { label: 'Total payout to you', value: t.payout, sub: `Rental income after the Samba management fee and villa expenses${Number(t.adjustments) ? ' and adjustments' : ''}, ${esc(d.period_label || '')}.` };
        return `<div class="payout">
        <div class="pl">${h.label}</div>
        <div class="pv">${IDR(h.value)}</div>
        <div class="ps">${h.sub}</div>
      </div>`;
      })()}
    </div>`;

  // Bookings
  html += `<div class="pad"><div class="sec-h">Bookings</div>`;
  if (!bookings.length) html += `<div style="color:var(--muted);font-size:.84rem">No bookings this month.</div>`;
  for (const u of units) {
    const rows = bookings.filter(b => (b.unit_name || '') === u);
    if (u) html += `<div class="unit-h">${esc(u)}</div>`;
    html += `<div class="tblwrap"><table class="st">
      <tr><th>Guest</th><th>Dates</th><th>Platform</th><th class="num">Nights</th><th class="num">Amount</th><th class="num">Mgmt fee</th><th class="num">Nett to you</th></tr>
      ${rows.map(b => `<tr>
        <td>${esc(b.guest_name || '—')}</td>
        <td>${esc(b.stay_dates || '—')}</td>
        <td>${esc(platformLabel(b.platform))}</td>
        <td class="num">${b.nights != null ? esc(String(b.nights)) : '—'}</td>
        <td class="num">${mval(b.amount)}</td>
        <td class="num">${mval(b.commission)}</td>
        <td class="num">${mval(b.nett)}</td>
      </tr>`).join('')}
      <tr class="tot"><td colspan="4">Total</td>
        <td class="num">${mval(rows.reduce((a, b) => a + (+b.amount || 0), 0))}</td>
        <td class="num">${mval(rows.reduce((a, b) => a + (+b.commission || 0), 0))}</td>
        <td class="num">${mval(rows.reduce((a, b) => a + (+b.nett || 0), 0))}</td></tr>
    </table></div>`;
  }
  html += `</div>`;

  // Expenses
  html += `<div class="pad"><div class="sec-h">Villa expenses<small>paid on your behalf</small></div>`;
  if (!expenses.length) html += `<div style="color:var(--muted);font-size:.84rem">No expenses this month.</div>`;
  else html += `<div class="tblwrap"><table class="st">
    <tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr>
    ${expenses.map(e => `<tr><td style="white-space:nowrap">${esc(e.expense_date || '—')}</td><td>${esc(e.description || '—')}</td><td class="num">${mval(e.amount)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">Total expenses</td><td class="num">${mval(expenses.reduce((a, e) => a + (+e.amount || 0), 0))}</td></tr>
  </table></div>`;
  html += `</div>`;

  // The math
  html += `<div class="pad"><div class="sec-h">How your payout adds up</div>
    <div class="mathline"><span class="mk">Rental income (gross)</span><span class="mv">${IDR(t.gross)}</span></div>
    <div class="mathline"><span class="mk">Samba Realty management fee</span><span class="mv">− ${IDR(t.commission)}</span></div>
    <div class="mathline"><span class="mk">Nett rental income</span><span class="mv">${IDR(t.nett)}</span></div>
    <div class="mathline"><span class="mk">Villa expenses</span><span class="mv">− ${IDR(t.expenses)}</span></div>
    ${adjustments.length ? adjustments.map(a => `<div class="mathline"><span class="mk">${esc(a.description || 'Adjustment')}</span><span class="mv">${Number(a.amount) < 0 ? '− ' + IDR(-a.amount) : '+ ' + IDR(a.amount)}</span></div>`).join('') : ''}
    <div class="mathline grand"><span class="mk">Total payout</span><span class="mv">${IDR(t.payout)}</span></div>
    ${paidTotal > 0 && !paid ? `<div class="mathline"><span class="mk">Paid so far</span><span class="mv">− ${IDR(paidTotal)}</span></div>
    <div class="mathline"><span class="mk"><b>Balance to follow</b></span><span class="mv">${IDR(balance)}</span></div>` : ''}
  </div>`;

  // Payments received
  if ((d.payments || []).length) {
    html += `<div class="pad"><div class="sec-h">Payments${paid ? '' : ' so far'}</div>
      <div class="tblwrap"><table class="st">
      <tr><th>Date</th><th class="num">Amount</th><th>Reference</th><th>Confirmation</th></tr>
      ${d.payments.map(p => `<tr>
        <td style="white-space:nowrap">${esc(dstr(p.paid_at))}</td>
        <td class="num">${mval(p.amount)}</td>
        <td>${esc(p.note || '—')}</td>
        <td>${p.proof_url ? `<a href="${esc(p.proof_url)}" target="_blank" rel="noopener">view ↗</a>` : '—'}</td>
      </tr>`).join('')}
      <tr class="tot"><td>Total paid</td><td class="num">${mval(paidTotal)}</td><td colspan="2">${paid ? 'Settled in full' : IDR(balance) + ' to follow'}</td></tr>
      </table></div></div>`;
  }

  // Payout account on file
  const acct = d.group?.payout_account;
  html += `<div class="pad"><div class="sec-h">Payout account</div>` + (acct && (acct.bank || acct.account_number)
    ? `<div style="font-size:.86rem;line-height:1.8">${esc(acct.bank || '')} · ${esc(acct.account_name || '')} · <b>${esc(acct.account_number || '')}</b>
       <div style="font-size:.72rem;color:var(--muted);margin-top:4px">Payouts go to this account. To change it, update it in your Samba portal (sambarentals.com/portal → Statements) or reply to Maya.</div></div>`
    : `<div style="font-size:.84rem;color:var(--muted)">No payout account on file yet — add yours in your Samba portal (sambarentals.com/portal → Statements) or reply to Maya with your bank details.</div>`) + `</div>`;

  // Hostex occupancy — multi-unit properties get a per-listing toggle
  // (Combined is the default; each unit's own numbers one tap away).
  const hxUnits = d.hostex?.units || {};
  const unitKeys = Object.keys(hxUnits).filter(k => hxUnits[k] && !hxUnits[k].error);
  const unitLabel = (k) => hxUnits[k]?.name?.replace(/^.*–\s*/, '') || k.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  if (HXSEL !== 'group' && !hxUnits[HXSEL]) HXSEL = 'group';
  const hx = HXSEL === 'group' ? d.hostex?.group : hxUnits[HXSEL];
  if (hx) {
    const chTotal = Object.values(hx.channels || {}).reduce((a, b) => a + b, 0) || 1;
    const chip = (key, label) => `<button onclick="setHx('${esc(key)}')" style="border:1px solid ${HXSEL === key ? 'var(--accent)' : 'var(--border)'};background:${HXSEL === key ? 'var(--accent)' : 'var(--surface)'};color:${HXSEL === key ? '#fff' : 'var(--text-2)'};border-radius:999px;padding:6px 13px;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer">${esc(label)}</button>`;
    html += `<div class="pad"><div class="sec-h">Your month in numbers<small>from the booking calendar</small></div>
      ${unitKeys.length > 1 ? `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">${chip('group', 'Combined')}${unitKeys.map(k => chip(k, unitLabel(k))).join('')}</div>` : ''}
      <div class="hxgrid">
        <div class="hxc"><div class="kl">Occupancy</div><div class="kv">${hx.occupancy_pct}<small>%</small></div><div class="kc">of available nights</div></div>
        <div class="hxc"><div class="kl">Nights sold</div><div class="kv">${hx.nights_sold}</div><div class="kc">across the month</div></div>
        <div class="hxc"><div class="kl">Reservations</div><div class="kv">${hx.reservations}</div><div class="kc">stays touching this month</div></div>
        <div class="hxc"><div class="kl">Net nightly rate</div><div class="kv" style="font-size:1.15rem;line-height:1.3">${hx.adr ? IDR(hx.adr) : '—'}</div><div class="kc">average, after platform fees</div></div>
      </div>
      ${Object.keys(hx.channels || {}).length ? `<div class="chmix">${Object.entries(hx.channels).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
        `<div class="chrow"><span>${esc(chLabel(k))}</span><span class="bar"><i style="width:${Math.round(v / chTotal * 100)}%"></i></span><span class="n">${v} nights</span></div>`).join('')}</div>` : ''}
    </div>`;
  }

  const token = (location.pathname.match(/\/st\/(.+)$/) || [])[1] || '';
  html += `<div class="foot">
    <div class="fmeta">Published ${esc(dstr(d.published_at))} · Samba Realty, Bali<br>Figures are final as published; later calendar changes don't alter this statement.</div>
    <a href="/api/statements?action=export&token=${esc(token)}" style="display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-size:.8rem;font-weight:600">⬇ Download Excel (.xlsx)</a>
  </div></div>`;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('root').innerHTML = html;
  document.getElementById('footcta').style.display = '';
  document.title = `${d.period_label || ''} statement · ${d.group?.name || 'Samba'}`;
}

boot();
</script>
